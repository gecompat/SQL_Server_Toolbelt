---
# repo_map.yaml – Maschinenlesbare Repository-Rolle und Artefaktklassen
# SQL Server Toolbelt
# Letzte Aktualisierung: 2026-07-29

repository:
  name: SQL_Server_Toolbelt
  owner: gecompat
  purpose: Modulare Erweiterungsbibliothek für SQL Server 2019+
  status: first_module_designed
  language_primary: T-SQL
  languages_allowed: [T-SQL, C#, Python, Java, R]
  sql_server_versions: ["2019", "2022", "2025"]
  platforms: [Windows, Linux]

sources_of_truth:
  license: LICENSE.md
  project_context: .ai/PROJECT_CONTEXT.md
  project_rules: .ai/PROJECT_RULES.md
  working_rules: .ai/WORKING_RULES.md
  ai_entry_point: AGENTS.md
  copilot_bridge: .github/copilot-instructions.md
  usp_contract: Documentation/Standards/USP_CONTRACT.md
  naming_conventions: Documentation/Standards/SQL_OBJECT_NAMING.md
  decisions: Documentation/Architecture/DECISIONS.md
  result_table_module_design: Documentation/Architecture/RESULT_TABLE_MODULE_DESIGN.md
  result_table_test_matrix: Tests/RESULT_TABLE_CONTRACT_TEST_MATRIX.md
  roadmap: .ai/ROADMAP.md
  backlog: .ai/BACKLOG.md

artifact_classes:
  public:
    description: Öffentlich sichtbare Dokumentation und Inhalte
    paths:
      - README.md
      - LICENSE.md
      - AGENTS.md
      - CONTRIBUTING.md
      - SECURITY.md
      - CHANGELOG.md
      - Documentation/
      - Modules/
      - Templates/
      - Backlog/
      - Tests/
    allowed_content:
      - Dokumentation
      - Synthetische Beispiele
      - Nicht ausführbare Vorlagen mit Endung .sql.template
    prohibited_content:
      - Personenbezogene Daten
      - Reale Infrastrukturnamen
      - Secrets
      - Reale Runtime-Ausgaben

  internal:
    description: KI-Steuerungs- und Metadaten
    paths:
      - .ai/
    allowed_content:
      - Projektzweck und -regeln
      - Arbeitsregeln
      - Backlog und Roadmap
      - Repo-Map

  github_config:
    description: GitHub-Konfiguration und Workflow-Steuerung
    paths:
      - .github/
    allowed_content:
      - Issue Templates
      - Pull-Request-Templates
      - Copilot Instructions
      - Custom-Agent-Profile mit YAML-Frontmatter

  templates:
    description: Nicht ausführbare Vorlagen für neue Module
    paths:
      - Templates/
    note: SQL-Vorlagen haben die Endung .sql.template und sind ausdrücklich als nicht ausführbar gekennzeichnet

  tests:
    description: Test-Infrastruktur, verbindliche Testmatrizen und Richtlinien
    paths:
      - Tests/
    note: Modulspezifische Matrizen sind Planungs- und Vertragsartefakte; Runtime-Evidenz entsteht erst durch tatsächliche Ausführung

  generated:
    description: Abgeleitete oder generierte Artefakte, die nicht versioniert werden
    examples:
      - bin/
      - obj/
      - dist/
      - "*.dll"
      - "*.log"

  runtime:
    description: Laufzeitdaten, die niemals versioniert werden
    prohibited:
      - Query Plans
      - Execution Logs
      - Test-Evidence mit Produktionsdaten
      - Traces

schemas:
  pattern: "toolbelt_<category>"
  examples:
    - toolbelt_core
    - toolbelt_string
    - toolbelt_datetime
    - toolbelt_conversion
    - toolbelt_validation
    - toolbelt_json
    - toolbelt_xml
    - toolbelt_metadata
    - toolbelt_security

object_naming:
  stored_procedure: "USP_{CamelCase}"
  inline_tvf: "TVF_{CamelCase}"
  multi_statement_tvf: "TVF_{CamelCase}"
  scalar_function: "SVF_{CamelCase}"
  view: "VW_{CamelCase}"
  internal_temp_table: "#tbx_<Module>_<Routine>_<Role>[_<Invocation>]"
  persistent_tables: open_decision
  synonyms: open_decision
  assemblies: open_decision
  triggers: open_decision
  sequences: open_decision
  types: open_decision
