research_inputs:
  personal_backlog_brainstorm:
    path: Backlog/personal_Backlog_Bainstorm.md
    content_role: user_authored_non_authoritative_research_input
    required_for_backlog_research: true
    may_define_rules: false
    may_define_public_contracts: false
    may_set_priority: false
    may_authorize_implementation: false
    existing_content_deletion_allowed: false
    allowed_updates:
      - append
      - annotate
      - strikethrough_with_dated_change_comment
      - add_candidate_cross_reference
    canonical_destinations:
      - Backlog/TOOLBELT_CANDIDATES.md
      - Backlog/SQL_SERVER_ANALYZE_CANDIDATES.md
      - Backlog/MAN_KANN_ES_AUCH_UEBERTREIBEN.md
      - .ai/BACKLOG.md
  toolbelt_research_inbox:
    path: Backlog/TOOLBELT_RESEARCH_INBOX.md
    content_role: deduplicated_unfiltered_non_authoritative_research_input
    required_for_backlog_research: true
    may_define_rules: false
    may_define_public_contracts: false
    may_set_priority: false
    may_authorize_implementation: false
    formalization_destination: Backlog/TOOLBELT_CANDIDATES.md
  toolbelt_research_priorities:
    path: Backlog/TOOLBELT_RESEARCH_PRIORITIES.md
    content_role: non_authoritative_rough_focus_and_selection_guide
    depends_on:
      - Backlog/TOOLBELT_RESEARCH_INBOX.md
      - Backlog/TOOLBELT_CANDIDATES.md
      - .ai/ROADMAP.md
    may_define_rules: false
    may_define_public_contracts: false
    may_authorize_implementation: false

artifact_classes:
  public:
    description: Öffentlich sichtbare Dokumentation und Inhalte
    paths:
      - README.md
      - LICENSE.md
      - AGENTS.md
      - CONTRIBUTING.md
      - SECURITY.md
      - CHANGELOG.md
      - Documentation/
      - Modules/
      - Templates/
      - Backlog/
      - Tests/
    allowed_content:
      - Dokumentation
      - Synthetische Beispiele
      - Fachlich relevante öffentliche Organisations- und externe Projektnamen
      - Öffentliche Quellen-, Projekt- und Dokumentations-URLs
      - gecompat und Gerhard Pisch
      - Nicht ausführbare Vorlagen mit Endung .sql.template
    prohibited_content:
      - Personenbezogene oder sensible Daten
      - Interne oder vertrauliche Firmen-, Kunden-, Organisations- und Projektdaten
      - Nicht öffentliche Infrastrukturangaben
      - Original-Tabelleninhalte und Produktionsdaten
      - Secrets
      - Reale Runtime-Ausgaben
      - Konkrete Hardware-, Kapazitäts-, Inventar- oder Umgebungswerte von Remote Runnern

  internal:
    description: KI-Steuerungs- und Metadaten
    paths:
      - .ai/
    allowed_content:
      - Projektzweck und -regeln
      - Arbeitsregeln
      - Backlog und Roadmap
      - Repo-Map

  github_config:
    description: GitHub-Konfiguration und Workflow-Steuerung
    paths:
      - .github/
    allowed_content:
      - Issue Templates
      - Pull-Request-Templates
      - Copilot Instructions
      - Custom-Agent-Profile mit YAML-Frontmatter
      - Pfadbezogene GitHub-Actions-Workflows

  templates:
    description: Nicht ausführbare Vorlagen für neue Module
    paths:
      - Templates/
    note: SQL-Vorlagen haben die Endung .sql.template und sind ausdrücklich als nicht ausführbar gekennzeichnet

  tests:
    description: Test-Infrastruktur, verbindliche Testmatrizen und Richtlinien
    paths:
      - Tests/
    note: Modulspezifische Matrizen sind Planungs- und Vertragsartefakte; Runtime-Evidenz entsteht erst durch tatsächliche Ausführung

  generated:
    description: Abgeleitete oder generierte Artefakte, die nicht versioniert werden
    examples:
      - bin/
      - obj/
      - dist/
      - "*.dll"
      - "*.log"

  runtime:
    description: Laufzeitdaten, die niemals versioniert werden
    prohibited:
      - Query Plans
      - Execution Logs
      - Test-Evidence mit Produktions- oder Originaldaten
      - Traces
      - Konkrete Hardware-, Kapazitäts-, Inventar- oder Umgebungswerte von Remote Runnern

schemas:
  pattern: "toolbelt_<category>"
  examples:
    - toolbelt_core
    - toolbelt_string
    - toolbelt_datetime
    - toolbelt_conversion
    - toolbelt_validation
    - toolbelt_json
    - toolbelt_xml
    - toolbelt_metadata
    - toolbelt_security
    - toolbelt_binary

object_naming:
  stored_procedure: "USP_{CamelCase}"
  inline_tvf: "TVF_{CamelCase}"
  multi_statement_tvf: "TVF_{CamelCase}"
  scalar_function: "SVF_{CamelCase}"
  view: "VW_{CamelCase}"
  internal_temp_table: "#tbx_<Module>_<Routine>_<Role>[_<Invocation>]"
  tables: open_decision
  synonyms: open_decision
  assemblies: open_decision
  triggers: open_decision
  sequences: open_decision
  types: open_decision

