---
# repo_map.yaml – Maschinenlesbare Repository-Rolle und Artefaktklassen
# SQL Server Toolbelt
# Letzte Aktualisierung: 2026-07-29

repository:
  name: SQL_Server_Toolbelt
  owner: gecompat
  purpose: Modulare Erweiterungsbibliothek für SQL Server 2019+
  status: first_module_implemented
  language_primary: T-SQL
  languages_allowed: [T-SQL, C#, Python, Java, R, Bash]
  sql_server_versions: ["2019", "2022", "2025"]
  platforms: [Windows, Linux]

sources_of_truth:
  license: LICENSE.md
  project_context: .ai/PROJECT_CONTEXT.md
  project_rules: .ai/PROJECT_RULES.md
  working_rules: .ai/WORKING_RULES.md
  ai_entry_point: AGENTS.md
  copilot_bridge: .github/copilot-instructions.md
  usp_contract: Documentation/Standards/USP_CONTRACT.md
  naming_conventions: Documentation/Standards/SQL_OBJECT_NAMING.md
  decisions: Documentation/Architecture/DECISIONS.md
  result_table_module_design: Documentation/Architecture/RESULT_TABLE_MODULE_DESIGN.md
  result_table_test_matrix: Tests/RESULT_TABLE_CONTRACT_TEST_MATRIX.md
  result_table_runtime_workflow: .github/workflows/result-table-runtime.yml
  result_table_module: Modules/toolbelt.core.result-table/module.yaml
  documentation_validator: Tests/Documentation/validate_documentation.py
  documentation_workflow: .github/workflows/documentation-consistency.yml
  toolbelt_landscape_research: Documentation/Research/SQL_SERVER_TOOLBELT_LANDSCAPE.md
  roadmap: .ai/ROADMAP.md
  backlog: .ai/BACKLOG.md

research_inputs:
  personal_backlog_brainstorm:
    path: Backlog/personal_Backlog_Bainstorm.md
    content_role: user_authored_non_authoritative_research_input
    required_for_backlog_research: true
    may_define_rules: false
    may_define_public_contracts: false
    may_set_priority: false
    may_authorize_implementation: false
    existing_content_deletion_allowed: false
    allowed_updates:
      - append
      - annotate
      - strikethrough_with_dated_change_comment
      - add_candidate_cross_reference
    canonical_destinations:
      - Backlog/TOOLBELT_CANDIDATES.md
      - Backlog/SQL_SERVER_ANALYZE_CANDIDATES.md
      - Backlog/MAN_KANN_ES_AUCH_UEBERTREIBEN.md
      - .ai/BACKLOG.md

artifact_classes:
  public:
    description: Öffentlich sichtbare Dokumentation und Inhalte
    paths:
      - README.md
      - LICENSE.md
      - AGENTS.md
      - CONTRIBUTING.md
      - SECURITY.md
      - CHANGELOG.md
      - Documentation/
      - Modules/
      - Templates/
      - Backlog/
      - Tests/
    allowed_content:
      - Dokumentation
      - Synthetische Beispiele
      - Nicht ausführbare Vorlagen mit Endung .sql.template
    prohibited_content:
      - Personenbezogene Daten
      - Reale Infrastrukturnamen
      - Secrets
      - Reale Runtime-Ausgaben

  internal:
    description: KI-Steuerungs- und Metadaten
    paths:
      - .ai/
    allowed_content:
      - Projektzweck und -regeln
      - Arbeitsregeln
      - Backlog und Roadmap
      - Repo-Map

  github_config:
    description: GitHub-Konfiguration und Workflow-Steuerung
    paths:
      - .github/
    allowed_content:
      - Issue Templates
      - Pull-Request-Templates
      - Copilot Instructions
      - Custom-Agent-Profile mit YAML-Frontmatter
      - Pfadbezogene GitHub-Actions-Workflows

  templates:
    description: Nicht ausführbare Vorlagen für neue Module
    paths:
      - Templates/
    note: SQL-Vorlagen haben die Endung .sql.template und sind ausdrücklich als nicht ausführbar gekennzeichnet

  tests:
    description: Test-Infrastruktur, verbindliche Testmatrizen und Richtlinien
    paths:
      - Tests/
    note: Modulspezifische Matrizen sind Planungs- und Vertragsartefakte; Runtime-Evidenz entsteht erst durch tatsächliche Ausführung

  generated:
    description: Abgeleitete oder generierte Artefakte, die nicht versioniert werden
    examples:
      - bin/
      - obj/
      - dist/
      - "*.dll"
      - "*.log"

  runtime:
    description: Laufzeitdaten, die niemals versioniert werden
    prohibited:
      - Query Plans
      - Execution Logs
      - Test-Evidence mit Produktionsdaten
      - Traces

schemas:
  pattern: "toolbelt_<category>"
  examples:
    - toolbelt_core
    - toolbelt_string
    - toolbelt_datetime
    - toolbelt_conversion
    - toolbelt_validation
    - toolbelt_json
    - toolbelt_xml
    - toolbelt_metadata
    - toolbelt_security

object_naming:
  stored_procedure: "USP_{CamelCase}"
  inline_tvf: "TVF_{CamelCase}"
  multi_statement_tvf: "TVF_{CamelCase}"
  scalar_function: "SVF_{CamelCase}"
  view: "VW_{CamelCase}"
  internal_temp_table: "#tbx_<Module>_<Routine>_<Role>[_<Invocation>]"
  tables: open_decision
  synonyms: open_decision
  assemblies: open_decision
  triggers: open_decision
  sequences: open_decision
  types: open_decision

module_registry:
  manifests:
    - Modules/toolbelt.core.result-table/module.yaml

change_impact:
  strategy: diff_first_registered_dependencies
  full_scan_default: false
  full_audit_reasons:
    - initial_baseline
    - release
    - governance_change
    - coupling_registry_change
    - explicit_request
  full_audit_paths:
    - .ai/repo_map.yaml
    - .ai/PROJECT_RULES.md
    - .ai/WORKING_RULES.md
    - AGENTS.md
    - Documentation/Architecture/DECISIONS.md
    - Documentation/Architecture/ARTIFACT_ROLES.md
    - Tests/Documentation/validate_documentation.py
    - .github/workflows/documentation-consistency.yml
    - Templates/Module/module.yaml.template
  packages:
    documentation:
      paths:
        - "*.md"
        - ".ai/*.md"
        - ".github/**/*.md"
        - "Backlog/**/*.md"
        - "Documentation/**/*.md"
        - "Modules/**/*.md"
        - "Templates/**/*.md"
        - "Tests/**/*.md"
      checks:
        - markdown_links
    module_status:
      paths:
        - README.md
        - SECURITY.md
        - Modules/README.md
        - Modules/*/module.yaml
        - .ai/BACKLOG.md
        - .ai/ROADMAP.md
        - .ai/PROJECT_CONTEXT.md
        - Documentation/Architecture/MODULE_AND_DEPENDENCY_MODEL.md
        - Documentation/Standards/TEST_AND_VALIDATION_POLICY.md
      checks:
        - generated_status
        - markdown_links
    personal_brainstorm:
      paths:
        - Backlog/personal_Backlog_Bainstorm.md
      checks:
        - brainstorm_history
        - markdown_links
    result_table_contract:
      paths:
        - Modules/toolbelt.core.result-table/**
        - Documentation/Architecture/RESULT_TABLE_MODULE_DESIGN.md
        - Documentation/Architecture/DEPLOYMENT_MODEL.md
        - Documentation/Standards/USP_CONTRACT.md
        - Documentation/Standards/TSQL_ENGINEERING.md
        - Documentation/Standards/MODULE_DEFINITION_OF_DONE.md
        - Tests/RESULT_TABLE_CONTRACT_TEST_MATRIX.md
        - Tests/CI/run-result-table-linux.sh
      checks:
        - result_table_static
        - markdown_links
    runtime_workflow:
      paths:
        - .github/workflows/result-table-runtime.yml
      checks:
        - runtime_workflow_scope
        - result_table_static
    governance:
      paths:
        - .ai/repo_map.yaml
        - .ai/PROJECT_RULES.md
        - .ai/WORKING_RULES.md
        - AGENTS.md
        - Documentation/Architecture/ARTIFACT_ROLES.md
        - Documentation/Architecture/DECISIONS.md
        - Tests/Documentation/**
        - .github/workflows/documentation-consistency.yml
        - .github/pull_request_template.md
        - Templates/Module/module.yaml.template
      checks:
        - generated_status
        - markdown_links
        - brainstorm_history
        - runtime_workflow_scope
        - result_table_static
