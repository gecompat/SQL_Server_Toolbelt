validation_evidence:
  - date: "2026-10-05"
    workflow: "local: Tests/Static/validate_contract.py"
    scope: "Sechs Sourceverträge, explizite schemagebundene Projektionen, feste Fixturecollations und kanonischer nicht schreibender Deploymentgenerator bestanden; unabhängige ScriptDom150- und PowerShell-AST-Prüfungen bestanden. Kein nativer Nachweis daraus."
    result: "success"
  - date: "2026-10-05"
    workflow: "local: Tests/CI/run-safe-cast-lab.ps1"
    scope: "Drei frühere Linux-Gesamtfehlläufe: Deploy SQL1054/state6 durch schemagebundene Projektionswildcards, Fixture SQL102/state1 durch geklammerte Collation, später Fremdslotvorbereitung durch NULL-Hash leerer Metadatenlisten. Je FAILED_CLEANED mit unabhängig frisch bestätigter eigener Bereinigung und Inputpins; kein Gesamt-PASS. Dritter Lauf lokal mit 4368 API-Oracles, Clientmetadaten und 16 gezielten Lifecyclefällen als getrennter Teilnachweis."
    result: "failed"
  - date: "2026-10-05"
    workflow: "local: Tests/CI/run-safe-cast-lab.ps1"
    scope: "Finales gleiches Source-/Deployment-/Fixture-/Adapterpaar auf Linux2019/latest CL150 und Windows2025/exaktCU8 CL170 jeweils local/central und mit separatem SC-/UTF8-Consumer bestanden: je 13104 feste API-Oracles, 54 direkte Clientreader, Clean/Repeat, installierte Baseline, 38 gezielte Caller-/Lock-/Rollback-/TypedMarker-/Fremdslot-/Confirm0-Fälle und Uninstall/Repeat. Je Exit0, vollständige Kanäle und leeres Stderr; frische unabhängige Audits bestätigen COMPLETE38, drei eigene DBs abwesend, je zwei Marker-/Fremdslotfixtures mit exakter Wiederherstellung und zwei Abweisungen sowie alle Inputpins. Keine Konfigurations-/Rechte-/Truständerungen. Weitere physische Ziele, Minimalrechte, Heap-/Produktionskapazität und exakte Head-CI bleiben getrennt offen; frühere Fehlläufe werden nicht umgewertet."
    result: "success"
