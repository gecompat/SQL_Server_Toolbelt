module_id: "toolbelt.core.execution-cancel"
module_name: "Cooperative Execution Cancellation"
version: "1.0.0"
implementation_status: implemented
validation_status: validated
release_status: unreleased
description: "Speichert pro ExecutionId eine irreversible kooperative Cancellation-Anforderung; Worker entscheiden selbst über ihren kontrollierten Ausgang."
sql_server_versions:
  - "2019"
  - "2022"
  - "2025"
compatibility_levels:
  - 150
  - 160
  - 170
platforms:
  windows: validated
  linux: validated
providers:
  - id: persistent-cooperative-signal
    technology: "T-SQL table, TVF, scalar function and procedure"
    platforms: [Windows, Linux]
    status: validated
deployment_capabilities:
  local: true
  central: true
  central_with_synonyms: false
  local_required: false
  central_preferred: true
dependencies:
  - module_id: "toolbelt.core.execution-context"
    minimum_version: "1.0.0"
    reason: "Auflösung der aktuellen sessiongebundenen ExecutionId ohne expliziten Parameter."
schemas:
  - "toolbelt_core"
objects:
  - {type: TABLE, schema: "toolbelt_core", name: "ExecutionCancellation", visibility: internal}
  - {type: TVF, schema: "toolbelt_core", name: "TVF_ExecutionCancellationStatus", visibility: public}
  - {type: SVF, schema: "toolbelt_core", name: "SVF_IsCancellationRequested", visibility: public}
  - {type: USP, schema: "toolbelt_core", name: "USP_RequestExecutionCancellation", visibility: public}
permissions_required:
  - "EXECUTE auf USP_RequestExecutionCancellation für anfordernde Principals"
  - "SELECT auf TVF_ExecutionCancellationStatus oder EXECUTE auf SVF_IsCancellationRequested für kooperative Worker"
collation_contract: "CancellationReason bleibt nvarchar; ExecutionId ist uniqueidentifier."
data_type_contract: "Der öffentliche Status enthält nur ExecutionId, Flag und UTC-Zeit; anfordernde Identität und Grund bleiben intern."
help_contract_version: "1.0"
resultset_contracts:
  - object: "toolbelt_core.TVF_ExecutionCancellationStatus"
    kind: "data"
    resultset: "zero or one row: ExecutionId uniqueidentifier, IsCancellationRequested bit, RequestedAtUtc datetime2(7)"
  - object: "toolbelt_core.SVF_IsCancellationRequested"
    kind: "scalar"
    resultset: "bit; 1 bei persistierter Anforderung, sonst 0"
  - object: "toolbelt_core.USP_RequestExecutionCancellation"
    kind: "infrastructure"
    resultset: null
    return_code_success: 0
    error_range: "52600-52604"
lifecycle_error_range: "52640-52646"
clr:
  used: false
lifecycle:
