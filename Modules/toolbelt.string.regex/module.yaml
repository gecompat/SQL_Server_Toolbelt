module_id: "toolbelt.string.regex"
module_name: "Bounded Regular Expressions"
version: "1.2.0"
implementation_status: implemented
validation_status: "partially validated"
release_status: unreleased
description: "Stellt IsMatch, Instr, Count, Substring/Literal Replace sowie atomare Gesamttreffer-/Split-TVFs über den gemeinsamen SAFE-CLR-Regexkern bereit."
sql_server_versions:
  - "2019"
  - "2022"
  - "2025"
compatibility_levels:
  - 150
  - 160
  - 170
platforms:
  windows: "partially validated"
  linux: "partially validated"
providers:
  - id: safe-clr-toolbelt-regex
    technology: "C# SQL CLR; eigener Syntaxparser; System.Text.RegularExpressions mit festem Timeout"
    platforms: [Windows, Linux]
    status: "partially validated"
deployment_capabilities:
  local: true
  central: true
  central_with_synonyms: false
  local_required: false
  central_preferred: false
dependencies: []
schemas:
  - "toolbelt_string"
objects:
  - {type: TVF, schema: "toolbelt_string", name: "TVF_RegexMatches", visibility: public}
  - {type: TVF, schema: "toolbelt_string", name: "TVF_RegexSplit", visibility: public}
  - {type: CLR_TVF, schema: "toolbelt_string", name: "TVF_RegexMatchesCore", visibility: internal}
  - {type: CLR_TVF, schema: "toolbelt_string", name: "TVF_RegexSplitCore", visibility: internal}
  - {type: CLR_SVF, schema: "toolbelt_string", name: "SVF_RegexIsMatch", visibility: public}
  - {type: CLR_SVF, schema: "toolbelt_string", name: "SVF_RegexInstr", visibility: public}
  - {type: CLR_SVF, schema: "toolbelt_string", name: "SVF_RegexCount", visibility: public}
  - {type: SVF, schema: "toolbelt_string", name: "SVF_RegexReplace", visibility: public}
  - {type: SVF, schema: "toolbelt_string", name: "SVF_RegexSubstring", visibility: public}
  - {type: CLR_SVF, schema: "toolbelt_string", name: "SVF_RegexReplaceCore", visibility: internal}
  - {type: CLR_SVF, schema: "toolbelt_string", name: "SVF_RegexSubstringCore", visibility: internal}
  - {type: ASSEMBLY, name: "Toolbelt_String_Regex", visibility: internal}
permissions_required:
  - "SELECT auf den öffentlichen Regex-TVFs"
  - "SELECT oder REFERENCES auf den Regex-Skalarfunktionen"
  - "CREATE ASSEMBLY beziehungsweise ALTER ANY ASSEMBLY für Deploy"
  - "CREATE FUNCTION und Schema-ALTER für Deploy"
  - "sysadmin ausschließlich für das separate Trust-Opt-in"
collation_contract: "Matching ist ordinal zur Regexengine und unabhängig von der Datenbank-Collation; i verwendet CultureInvariant."
data_type_contract: "R1b unverändert: Input 2 MiB, Pattern 8000 UTF-16-Bytes, Flags nvarchar(4). R2a max-Texte: standard 2 MiB oder explizit large 16 MiB Quelle/Ersatz/Output; Pattern 8000 UTF-16-Codeeinheiten, Flags/Profile nvarchar(max) vor Validierung; Positionen int/UTF-16. R2b verwendet dieselben Profile und Patterngrenzen; Ordinal/StartPosition/Length bigint in UTF-16-Codeeinheiten, Ergebnistextsumme profilbegrenzt und MaxRows default 10000/ceiling 100000, ohne Laufzeitgarantie."
help_contract_version: "not applicable"
resultset_contracts:
  - object: "toolbelt_string.TVF_RegexMatches"
    resultset: "Ordinal bigint, StartPosition bigint, Length bigint, Value nvarchar(max); Metadaten nullable, alle Erfolgswerte nicht NULL"
    max_rows: "default 10000; ceiling 100000"
  - object: "toolbelt_string.TVF_RegexSplit"
    resultset: "Ordinal bigint, StartPosition bigint, Length bigint, Value nvarchar(max); Metadaten nullable, alle Erfolgswerte nicht NULL"
    max_rows: "default 10000; ceiling 100000"
lifecycle_error_range: "52030-52039"
trust_error_range: "52040-52049"
runtime_error_contract: "SQL error 6522 with stable TBX_REGEX_* prefix"
clr:
  used: true
  language: "C#"
  target_framework: ".NET Framework 4.8"
  assembly_sql_name: "Toolbelt_String_Regex"
  assembly_file_name: "Toolbelt.String.Regex.dll"
  permission_set: "SAFE"
