module_id: "toolbelt.archive.zip-memory"
module_name: "ZIP Memory Inspection"
version: "1.2.0"
implementation_status: implemented
validation_status: "partially validated"
release_status: unreleased
description: "Listet ZIP-Metadaten und extrahiert einen einzelnen Entry aus einem In-memory-ZIP-Container über einen begrenzten SAFE-SQL-CLR-Provider."
sql_server_versions:
  - "2019"
  - "2022"
  - "2025"
compatibility_levels: [150, 160, 170]
platforms:
  windows: "not executed"
  linux: "partially validated"
providers:
  - id: clr-zip-memory
    technology: "C# SQL CLR; eigener ZIP-Parser; DeflateStream aus System.dll; eigene CRC32"
    platforms: [Windows, Linux]
    status: "partially validated"
deployment_capabilities:
  local: true
  central: true
  central_with_synonyms: false
  local_required: false
  central_preferred: false
dependencies:
  - module_id: "toolbelt.core.result-table"
    minimum_version: "1.0.0"
    reason: "ResultTable-Integration für den USP-Vertrag (@ResultTable, @KeepData)."
schemas:
  - "toolbelt_archive"
objects:
  - type: USP
    schema: "toolbelt_archive"
    name: "USP_ExtractZipEntryFromBinary"
    visibility: public
  - type: USP
    schema: "toolbelt_archive"
    name: "USP_ListZipEntriesFromBinary"
    visibility: public
  - type: CLR_TVF
    schema: "toolbelt_archive"
    name: "TVF_InternalExtractZipEntryClr"
    visibility: internal
  - type: CLR_TVF
    schema: "toolbelt_archive"
    name: "TVF_InternalListZipEntriesClr"
    visibility: internal
  - type: ASSEMBLY
    name: "Toolbelt_Archive_ZipMemory"
    visibility: internal
permissions_required:
  - "EXECUTE auf toolbelt_archive.USP_ExtractZipEntryFromBinary"
  - "EXECUTE auf toolbelt_archive.USP_ListZipEntriesFromBinary"
  - "EXECUTE auf toolbelt_core.USP_PrepareResultTable bei Nutzung von @ResultTable"
  - "CREATE ASSEMBLY beziehungsweise ALTER ANY ASSEMBLY für Deploy"
  - "CREATE FUNCTION, CREATE PROCEDURE und Schema-ALTER für Deploy"
  - "sysadmin ausschließlich für das separate Trust-Opt-in"
collation_contract: "Entry-Namen werden vom CLR-Provider ordinal und case-sensitive verglichen; UTF-8 gemäß Flag 11, sonst CP437."
data_type_contract: "ZIP-Container und Payload sind varbinary(max); Entry-Namen sind nvarchar(1024)."
help_contract_version: "1.0"
resultset_contracts:
  - object: "toolbelt_archive.USP_ExtractZipEntryFromBinary"
    kind: "data"
    resultset: "EntryName nvarchar(1024), CompressedBytes bigint, UncompressedBytes bigint, CompressionMethod int, Crc32 int null, IsEncrypted bit, EntryPayload varbinary(max)"
    return_code_success: 0
    error_range: "51320-51329"
  - object: "toolbelt_archive.USP_ListZipEntriesFromBinary"
    kind: "data"
    resultset: "EntryOrdinal int, EntryName nvarchar(1024), IsDirectory bit, CompressedBytes bigint, UncompressedBytes bigint, CompressionMethod int, Crc32 int, IsEncrypted bit, IsExtractionSupported bit, DuplicateCount int, IsPathSafe bit, PathStatus varchar(32), LastModifiedAt datetime2(0) null"
    return_code_success: 0
    error_range: "51320-51329"
lifecycle_error_range: "51330-51339"
trust_error_range: "51340-51349"
clr:
  used: true
  language: "C#"
  target_framework: ".NET Framework 4.8"
  assembly_sql_name: "Toolbelt_Archive_ZipMemory"
  assembly_file_name: "Toolbelt.Archive.ZipMemory.dll"
  permission_set: "SAFE"
  trust_method: "SHA2-512 via sys.sp_add_trusted_assembly"
  direct_framework_references:
    - "System"
    - "System.Data"
  disallowed_direct_reference:
    - "System.IO.Compression.dll"
  build_project: "Clr/Toolbelt.Archive.ZipMemory.csproj"
  release_artifact_script: "Scripts/New-ClrReleaseArtifacts.ps1"
lifecycle:
  trust_opt_in: "Deployment/Add-TrustedAssembly.sql"
  deploy_template: "Deployment/Deploy.sql"
  uninstall: "Deployment/Uninstall.sql"
  execution_mode: "SQLCMD"
  release_manifest: "generated from the exact built assembly"
  source_hash_role: "diagnostic_only"
  trust_removed_by_uninstall: false
documentation:
