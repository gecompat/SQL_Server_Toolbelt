    result: "success; vollständiger paralleler Providerlauf und exakte Head-CI bleiben offen"
  - date: "2026-10-05"
    workflow: "local: Tests/CI/run-external-queue-worker-lab.ps1 -Platform windows -Version 2025 -Patch CU8 -ManagedOnly"
    scope: "Windows-Worker und SQL Server 2025 Windows/exakt CU8; zwei Supervisoren, leere Betriebsmodi, Livebudget, tatsächlicher Handlerabbruch/Rollback, Hold und Übernahme durch anderen Worker, Commit-vs-Stop-Rendezvous sowie echter Controltimeout mit UNKNOWN/Slotbelegung und expliziter Reconciliation."
    result: "success including own cleanup; Committransportverlust, minimale Rechte, weitere Ziele und exakte Head-CI bleiben getrennt offen"
  - date: "2026-10-05"
    workflow: "local: Tests/CI/run-external-queue-worker-lab.ps1 -Platform linux -Version 2019 -Patch latest -ManagedOnly"
    scope: "Derselbe fokussierte Managedvertrag mit Windows-Workerhost gegen SQL Server 2019 Linux; zwei Supervisoren, Betriebsmodi, Stop/Rollback/Hold/anderer Worker, Dispositionrennen und Controltimeout/UNKNOWN/keine Übernahme."
