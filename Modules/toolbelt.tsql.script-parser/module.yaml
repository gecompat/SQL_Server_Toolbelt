module_id: "toolbelt.tsql.script-parser"
module_name: "T-SQL Script Parser"
version: "1.0.0"
implementation_status: implemented
validation_status: "partially validated"
release_status: unreleased
description: "SQL-CLR-Provider auf Basis von Microsoft ScriptDom zur syntaktischen Zerlegung von T-SQL-Code in AST-Knoten, Knoteneigenschaften, Tokenstrom und Fehlerlisten."
sql_server_versions:
  - "2019"
  - "2022"
  - "2025"
compatibility_levels: [150, 160, 170]
platforms:
  windows: "partially validated: CLR-Build, Release-Artefakterzeugung und statische Verträge validiert."
  linux: "not applicable: SQL Server on Linux does not support UNSAFE SQL CLR assemblies."
providers:
  - id: clr-tsql-scriptdom
    technology: "C# SQL CLR .NET Framework 4.8; Microsoft.SqlServer.TransactSql.ScriptDom; UNSAFE"
    platforms: [Windows]
    status: implemented
deployment_capabilities:
  local: true
  central: true
  central_with_synonyms: false
  local_required: false
  central_preferred: false
dependencies: []
schemas:
  - "toolbelt_tsql"
objects:
  - { type: ASSEMBLY, name: "Toolbelt_Tsql_ScriptParser", visibility: internal }
  - { type: CLR_TVF, schema: "toolbelt_tsql", name: "TVF_ParseScriptNodes", visibility: public }
  - { type: CLR_TVF, schema: "toolbelt_tsql", name: "TVF_ParseScriptNodeProperties", visibility: public }
  - { type: CLR_TVF, schema: "toolbelt_tsql", name: "TVF_TokenizeScript", visibility: public }
  - { type: CLR_TVF, schema: "toolbelt_tsql", name: "TVF_ParseScriptErrors", visibility: public }
permissions_required:
  - "SELECT on the required public function"
  - "A sysadmin must opt in to the exact SHA2-512 assembly hash."
clr:
  used: true
  language: "C#"
  target_framework: ".NET Framework 4.8"
  assembly_sql_name: "Toolbelt_Tsql_ScriptParser"
  assembly_file_name: "Toolbelt.Tsql.ScriptParser.dll"
  permission_set: "UNSAFE"
  trust_method: "SHA2-512 via sys.sp_add_trusted_assembly"
  build_project: "Clr/Toolbelt.Tsql.ScriptParser.csproj"
  release_artifact_script: "Scripts/New-ClrReleaseArtifacts.ps1"
  trust_removed_by_uninstall: false
lifecycle:
  trust_opt_in: "Deployment/Add-TrustedAssembly.sql"
  deploy_template: "Deployment/Deploy.sql"
  uninstall: "Deployment/Uninstall.sql"
  execution_mode: "SQLCMD"
documentation:
  module: "README.md"
  public_objects:
    - "Documentation/TVF_ParseScriptNodes.md"
    - "Documentation/TVF_ParseScriptNodeProperties.md"
    - "Documentation/TVF_TokenizeScript.md"
    - "Documentation/TVF_ParseScriptErrors.md"
  architecture:
    - "../../Documentation/Architecture/TSQL_SCRIPT_PARSER_MODULE_DESIGN.md"
  test_matrix:
    - "Tests/TSQL_SCRIPT_PARSER_CONTRACT_TEST_MATRIX.md"
  evidence:
    - "Tests/README.md"
contracts:
  usp: "not applicable"
  deployment: "1.0"
  validation: "1.0"
tests:
  static: "Tests/Static/validate_contract.py"
  runtime: "Tests/Runtime/ScriptParser.Contract.sql"
validation_evidence:
  - date: "2026-09-03"
    workflow: "statische Vertragsprüfung und Build-Validierung"
    scope: ".NET Framework 4.8 Assembly, ScriptDom-Integration, 4 CLR-TVFs, Deployment- und Lifecycle-Skripte"
    result: "success"
