validation_evidence:
  - date: "2026-10-16"
    workflow: "local: Tests/Framework/Invoke-Contract.ps1 -Profile Full"
    scope: "18 isolierte Framework-Kindprozesse mit262144-Byte-Stack/40-Sekunden-Watchdog einschließlich konkreter Typ-/NULL-/Längen-/Zeit-Reviewregressionen; zwölf isolierte SQL-Syntaxprüfungen150/160/170 und statische Kopplung bestanden. Begrenzte unabhängige Core-/Securityprüfung nach einem Folgeauftrag bestanden; finaler reproduzierbarer Releasebuild bytegleich zur geprüften Assembly. Native SQL-, ResultTable-, Cache-, Upgrade- und Lifecyclequalifikation wegen Lab-TLS-Preflight offen; kein SQL-Einstieg geladen."
    result: "success"
  - date: "2026-10-17"
    workflow: "local: Tests/Runtime/Invoke-LabContract.ps1 -Version 2019/2022/2025 -Patch base -Modes local,central (je Version)"
    scope: "Windows SQL Server 2019/2022/2025, je lokaler und zentraler Deploymentmodus: 36 Kernassertionen pro Lauf (216 insgesamt) einschließlich Format 6/8, JSON-Vorlage, Zielabfragen, Composite-Lookup-Cache, ResultTable, Help und Callertransaktion. Deployment/Repeat/Uninstall/Repeat und eigener Cleanup bestanden. Functional mit Encrypt=True und explizitem TrustServerCertificate=True; authentifizierte TLS-Abnahme not executed. Aktueller reproduzierbarer Releasebuild, Full18 und Syntax12 bestanden. Vollständige Stufen-/Cacheinvalidierungs-, Parallelitäts-, Minimalrechte-, Fremdobjekt- und echte Vorgängerupgrade-Matrix offen; keine vollständige Nutzungs-/Releasequalifikation."
    result: "success"
  - date: "2026-10-17"
    workflow: "local: Tests/Runtime/Invoke-LabContract.ps1 -Full -Version 2019/2022/2025 -Patch base -Modes local,central -PredecessorRoot (je Version); Framework/Invoke-Contract.ps1 -Profile Full; Framework/Invoke-Syntax.ps1"
    scope: "Finaler reproduzierbarer Produktbuild: Windows SQL2019/BIN2, SQL2022/CS_AS und SQL2025/CI_AS_SC_UTF8, jeweils local/central mit181 Kern-,61 API- und15 Lifecycleassertionen (1542 insgesamt). Alle Stufen frisch und einzeln ausgeführt; direkte DECLARE-/Cacheinvalidierung, Unicode-Lookup, Conversion/Overwrite/Shadowing, ResultTable/Help/Caller-TX/SET, Parallel-DML/Sch-M, Cross-DB, Analyse ohne Quell-SELECT, Katalog-/Computed-/Funktionsgrenzen und atomarer Fremdobjekt-/Consumer-/Lock-Schutz bestanden. Echte Parser2.0.0→2.0.1-/TableClone4.1.0→4.1.1-Upgrades mit ursprünglicher/aktueller Triggerfixture, Deployment/Repeat/Uninstall/Repeat und frische Cleanup-Audits bestanden. Full21 und Syntax12 bestanden; unveränderte Parser245/Guard60 wiederverwendet. Functional: Encrypt=True, explizit TrustServerCertificate=True; authentifizierte TLS-Abnahme separat not executed. Kein SDK-Paritäts-, Produktionslast-, Head-CI- oder Releasenachweis."
    result: "success"
