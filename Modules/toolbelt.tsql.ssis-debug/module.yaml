module_id: "toolbelt.tsql.ssis-debug"
module_name: "SSIS Data Flow Debug SELECT"
version: "1.0.0"
implementation_status: implemented
validation_status: partially validated
release_status: unreleased
description: "Gemeinsamer typisierter DTSX-Kern für Debug-SELECT und externen neutralen Modellaustausch; kein Paketexecutor."
sql_server_versions:
  - "2019"
  - "2022"
  - "2025"
compatibility_levels: [150, 160, 170]
platforms:
  windows: "partially validated: begrenzte Fachmatrix SQL2019/2022/2025 lokal/zentral; buildgebundene Nachweise und Upgradegrenzen in Tests/README.md, Release offen."
  linux: "not applicable: UNSAFE SQL CLR wird nicht unterstützt."
providers:
  - id: clr-ssis-debug
    technology: "C# SQL CLR .NET Framework 4.8; ScriptDom; UNSAFE"
    platforms: [Windows]
    status: implemented
deployment_capabilities:
  local: true
  central: true
  central_with_synonyms: false
  local_required: false
  central_preferred: false
dependencies:
  - module_id: "toolbelt.core.result-table"
    minimum_version: "1.0.0"
    location: same_database
    reason: "Kanonischer ResultTable-Vertrag."
  - module_id: "toolbelt.tsql.script-parser"
    minimum_version: "2.0.1"
    exact_version: "2.0.1"
    location: same_database
    reason: "Gemeinsamer Vorfilter als Buildquelle; exakte Parser-/ScriptDom-Binarypins."
schemas:
  - "toolbelt_tsql"
objects:
  - { type: ASSEMBLY, name: "Toolbelt_Tsql_SsisDebug", visibility: internal }
  - { type: USP, schema: "toolbelt_tsql", name: "USP_ExplainSsisDataFlow", visibility: public }
  - { type: CLR_USP, schema: "toolbelt_tsql", name: "USP_ExplainSsisDataFlowInternal", visibility: internal }
permissions_required:
  - "EXECUTE auf die öffentliche Prozedur; expliziter Metadatenzugriff in den freigegebenen Datenbanken."
  - "SELECT auf die Quellen erst beim manuellen Ausführen des generierten SQL."
  - "Administrativer Opt-in des exakten SHA2-512-Releasehashs; keine automatische Rechtevergabe."
clr:
  used: true
  language: "C#"
  target_framework: ".NET Framework 4.8"
  assembly_sql_name: "Toolbelt_Tsql_SsisDebug"
  assembly_file_name: "Toolbelt.Tsql.SsisDebug.dll"
  permission_set: "UNSAFE"
  trust_method: "SHA2-512 via sys.sp_add_trusted_assembly"
  build_project: "Clr/Toolbelt.Tsql.SsisDebug.csproj"
  release_artifact_script: "Scripts/New-ClrReleaseArtifacts.ps1"
  trust_removed_by_uninstall: false
lifecycle:
  trust_opt_in: "Deployment/Add-TrustedAssembly.sql"
  deploy_template: "Deployment/Deploy.sql"
  uninstall: "Deployment/Uninstall.sql"
  execution_mode: "SQLCMD"
documentation:
  module: "README.md"
  public_objects:
    - "Documentation/USP_ExplainSsisDataFlow.md"
  examples:
    - "Examples/README.md"
    - "Examples/SsmsDebugWalkthrough.sql"
    - "Tests/Fixtures/synthetic-8.dtsx"
    - "Examples/Installation/README.md"
    - "Examples/Installation/PrepareServer.sql"
    - "Examples/Installation/Install-Local.ps1"
    - "Examples/Installation/VerifyInstallation.sql"
    - "InstallPackages/README.md"
  architecture:
    - "../../Documentation/Architecture/SSIS_DTSX_DEBUG_SELECT_V1_CONTRACT.md"
    - "Exchange/README.md"
  test_matrix:
    - "Tests/README.md"
  evidence:
    - "Tests/README.md"
contracts:
  usp: "1.0"
  deployment: "1.0"
  validation: "1.0"
  ssis_object_identities: "1.0.0"
  ssis_iteration_object_identities: "1.1.0"
  ssis_scope_object_identities: "1.2.0"
  ssis_export_bundle: "1.0.0"
tests:
  static: "Tests/Static/validate_contract.py"
  framework: "Tests/Framework/Invoke-Contract.ps1"
  runtime: "Tests/Runtime/Invoke-LabContract.ps1"
