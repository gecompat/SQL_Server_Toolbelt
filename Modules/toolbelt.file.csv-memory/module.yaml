module_id: "toolbelt.file.csv-memory"
module_name: "CSV Memory Parser and Writer"
version: "1.0.0"
implementation_status: implemented
validation_status: "partially validated"
release_status: unreleased
description: "Begrenzte rechteckige CSV-Zellen und atomarer CSV-Writer ohne Datei- oder Netzwerkzugriff."
sql_server_versions:
  - "2019"
  - "2022"
  - "2025"
compatibility_levels: [150, 160, 170]
platforms:
  windows: "partially validated"
  linux: "partially validated"
providers:
  - id: safe-clr-csv-memory
    technology: "Eigener UTF16-Scanner und kanonischer Quoting-Kern; .NET Framework 4.8"
    platforms: [Windows, Linux]
    status: "partially validated"
deployment_capabilities:
  local: true
  central: true
  central_with_synonyms: false
  local_required: false
  central_preferred: false
dependencies:
  - module_id: "toolbelt.core.result-table"
    minimum_version: "1.0.0"
    reason: "Same-database kanonische ResultTable-Runtime."
schemas:
  - "toolbelt_file"
objects:
  - {type: USP, schema: "toolbelt_file", name: "USP_ParseCsv", visibility: public}
  - {type: USP, schema: "toolbelt_file", name: "USP_WriteCsv", visibility: public}
  - {type: CLR_TVF, schema: "toolbelt_file", name: "TVF_InternalParseCsv", visibility: internal}
  - {type: CLR_SVF, schema: "toolbelt_file", name: "SVF_InternalMeasureCsvCell", visibility: internal}
  - {type: CLR_SVF, schema: "toolbelt_file", name: "SVF_InternalQuoteCsvCell", visibility: internal}
  - {type: ASSEMBLY, name: "Toolbelt_File_CsvMemory", visibility: internal}
permissions_required:
  - "Vorhandenes EXECUTE auf den öffentlichen USPs und der verwendeten ResultTable-Runtime; keine Rechtevergabe."
  - "Lifecycle: Datenbank-VIEW DEFINITION, SELECT auf sys.sql_expression_dependencies und passende Schema-/Assembly-DDL-Rechte."
  - "Lifecycle: Datenbankweite Release-Marker benötigen zusätzlich dafür wirksame Rechte; die genaue Minimalrechtekombination ist nicht nativ qualifiziert."
  - "Getrennter exakter SHA2-512-Trust-Opt-in benötigt vorhandene administrative Rechte."
collation_contract: "Wertzeichen unverändert; ordinale UTF16-Tokenvergleiche; öffentliche Texte Latin1_General_100_BIN2."
data_type_contract: "CSV nvarchar(max); Zeilen bigint, Spalten int; UTF16-Textbytes mit DATALENGTH, keine Heap-Zusage."
help_contract_version: "1.0"
resultset_contracts:
  - object: "toolbelt_file.USP_ParseCsv"
    columns: ["RowKind varchar(6) NOT NULL", "RowOrdinal bigint NOT NULL", "ColumnOrdinal int NOT NULL", "Value nvarchar(max) NULL"]
  - object: "toolbelt_file.USP_WriteCsv"
    columns: ["CsvText nvarchar(max) NOT NULL", "DataRows bigint NOT NULL", "ColumnCount int NOT NULL"]
runtime_error_contract: "55300-55309; unerwartete technische Fehler bleiben Originalfehler."
lifecycle_error_range: "55320-55329"
trust_error_range: "55340-55349"
clr:
  used: true
  language: "C#"
  target_framework: ".NET Framework 4.8"
  assembly_sql_name: "Toolbelt_File_CsvMemory"
  assembly_file_name: "Toolbelt.File.CsvMemory.dll"
  permission_set: "SAFE"
  trust_method: "SHA2-512 via separates sys.sp_add_trusted_assembly Opt-in"
  direct_framework_references: [System, System.Data]
  third_party_dependencies: []
  build_project: "Clr/Toolbelt.File.CsvMemory.csproj"
  release_artifact_script: "Scripts/New-ClrReleaseArtifacts.ps1"
lifecycle:
  deploy_template: "Deployment/Deploy.sql"
  uninstall: "Deployment/Uninstall.sql"
  trust_opt_in: "Deployment/Add-TrustedAssembly.sql"
  execution_mode: "SQLCMD"
  source_hash_role: "diagnostic_only"
  trust_removed_by_uninstall: false
documentation:
  module: "README.md"
  public_objects:
    - "Documentation/USP_ParseCsv.md"
    - "Documentation/USP_WriteCsv.md"
  architecture:
