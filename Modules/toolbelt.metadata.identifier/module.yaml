module_id: "toolbelt.metadata.identifier"
module_name: "Identifier and Multipart Name Toolkit"
version: "1.0.0"
implementation_status: implemented
validation_status: validated
release_status: unreleased
description: "Analysiert und begrenzt ein- bis vierteilige SQL-Identifier ohne Objektauflösung."

sql_server_versions:
  - "2019"
  - "2022"
  - "2025"

compatibility_levels:
  - 150
  - 160
  - 170

platforms:
  windows: validated
  linux: validated

providers:
  - id: tsql-state-machine
    technology: T-SQL Multi-statement TVF und Scalar UDF
    platforms: [Windows, Linux]
    status: validated

deployment_capabilities:
  local: true
  central: true
  central_with_synonyms: false
  local_required: false
  central_preferred: false

dependencies: []

schemas:
  - "toolbelt_metadata"

objects:
  - type: TVF
    schema: "toolbelt_metadata"
    name: "TVF_ParseMultipartName"
    visibility: public
  - type: SVF
    schema: "toolbelt_metadata"
    name: "SVF_QuoteMultipartName"
    visibility: public

permissions_required:
  - "SELECT oder REFERENCES auf den Functions"
  - "DDL-Rechte für Deploy und Uninstall"

collation_contract: "Delimiter-, Escape- und Metazeichenprüfungen verwenden Latin1_General_100_BIN2; Identifierinhalte werden nicht nach Groß-/Kleinschreibung normalisiert."
data_type_contract: "Eingabe nvarchar(1035); maximal vier decodierte sysname-Teile; QuotedName nvarchar(1035)."
help_contract_version: "not applicable"
resultset_contracts:
  - name: "TVF_ParseMultipartName"
    columns:
      - "IsValid bit"
      - "ValidationCode varchar(32)"
      - "PartCount tinyint"
      - "ServerName sysname NULL"
      - "DatabaseName sysname NULL"
      - "SchemaName sysname NULL"
      - "ObjectName sysname NULL"
      - "QuotedName nvarchar(1035) NULL"

lifecycle_error_range: "51060-51069"

clr:
  used: false
  permission_set: null
  trust_method: null

lifecycle:
  deploy: "Deployment/Deploy.sql"
  uninstall: "Deployment/Uninstall.sql"
  execution_mode: "SQLCMD"
  release_manifest: "embedded"
  source_hash_role: "diagnostic_only"

documentation:
  module: "README.md"
  public_objects:
    - "Documentation/TVF_ParseMultipartName.md"
    - "Documentation/SVF_QuoteMultipartName.md"
  architecture:
    - "../../Documentation/Architecture/IDENTIFIER_MODULE_DESIGN.md"
  test_matrix:
    - "Tests/IDENTIFIER_CONTRACT_TEST_MATRIX.md"
  evidence:
    - "Tests/README.md"

contracts:
  usp: "not applicable"
  deployment: "1.0"
  validation: "1.0"

tests:
  static: "Tests/Static/validate_contract.py"
  runtime: "Tests/Runtime/Identifier.Contract.sql"
  contract: "Tests/Runtime/Identifier.Contract.sql"
  lifecycle: "Tests/Runtime/Lifecycle.Contract.sql"
  central: "Tests/Runtime/Central.Contract.sql"
  github_hosted_linux: "../../.github/workflows/identifier-runtime.yml"

validation_evidence:
  - date: "2026-07-30"
    workflow: "https://github.com/gecompat/SQL_Server_Toolbelt/actions/workflows/identifier-runtime.yml"
    scope: "Workflow und Contract-Tests vorhanden; Runtime noch nicht ausgeführt"
    result: "not executed"
  - date: "2026-07-30"
    workflow: "https://github.com/gecompat/SQL_Server_Toolbelt/actions/runs/30514751834"
    scope: "SQL Server 2025 Linux; Compatibility Levels 150, 160 und 170; Parser-, Quote-, Escape-, Omission-, Längen-, Fehler-, lokale, zentrale und Lifecycle-Contracts"
    result: "success"
  - date: "2026-08-29"
    workflow: "local: Tests/CI/run-lab-local.ps1"
    scope: "Lokales SQL_Server_Lab; physische SQL-Server-2019-, 2022- und 2025-Linux-Ziele; vollständiger Moduladapter mit lokalen, zentralen, Lifecycle- und Uninstall-Verträgen"
    result: "success"
  - date: "2026-09-01"
    workflow: "https://github.com/gecompat/SQL_Server_Toolbelt/actions/workflows/identifier-runtime.yml"
    scope: "GitHub-hosted Linux-Matrix SQL Server 2019, 2022 und 2025; vollständiger Moduladapter je Zielversion mit den dort zulässigen Compatibility Levels"
    result: "success"
  - date: "2026-09-01"
    workflow: "local: Tests/CI/run-lab-local.ps1"
    scope: "Physische SQL-Server-2019-, 2022- und 2025-Ziele unter Windows base und Linux latest; vollständiger Moduladapter mit lokalem und zentralem Deployment, Vertrags-, Lifecycle-, Kollisions- und Uninstall-Tests"
    result: "success"
