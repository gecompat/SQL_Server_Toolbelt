module_id: "toolbelt.core.second-session"
module_name: "Second Session"
version: "1.1.0"
implementation_status: implemented
validation_status: "partially validated"
release_status: unreleased
description: "Führt registrierte Stored-Procedure-Work-Types synchron über einen administrativ vorbereiteten Loopback-Linked-Server in einer getrennten SQL-Server-Session aus."
sql_server_versions:
  - "2019"
  - "2022"
  - "2025"
compatibility_levels:
  - 150
  - 160
  - 170
platforms:
  windows: "not executed"
  linux: "partially validated"
providers:
  - id: loopback-linked-server-rpc
    technology: "T-SQL four-part RPC over MSOLEDBSQL linked server"
    platforms: [Windows, Linux]
    status: implemented
deployment_capabilities:
  local: true
  central: true
  central_with_synonyms: false
  local_required: false
  central_preferred: true
dependencies:
  - module_id: "toolbelt.core.result-table"
    minimum_version: "1.0.0"
    reason: "Optionale ResultTable-Ausgabe."
  - module_id: "toolbelt.core.execution-context"
    minimum_version: "1.0.0"
    reason: "Execution- und Correlation-Kontext in der Remote-Session."
  - module_id: "toolbelt.core.work-type"
    minimum_version: "1.1.0"
    reason: "Allowlisted Stored-Procedure-Handler, ParameterMode und kontrollierter Lifecycle."
schemas:
  - "toolbelt_core"
objects:
  - {type: TABLE, schema: "toolbelt_core", name: "SecondSessionProvider", visibility: internal}
  - {type: VIEW, schema: "toolbelt_core", name: "VW_SecondSessionProviders", visibility: public}
  - {type: USP, schema: "toolbelt_core", name: "USP_ConfigureSecondSessionLoopback", visibility: public}
  - {type: USP, schema: "toolbelt_core", name: "USP_ExecuteWorkTypeInNewSession", visibility: public}
  - {type: USP, schema: "toolbelt_core", name: "USP_SecondSessionProbe", visibility: internal}
  - {type: USP, schema: "toolbelt_core", name: "USP_DispatchWorkType", visibility: internal}
permissions_required:
  - "Administrativer Linked Server mit rpc out = true und remote proc transaction promotion = false"
  - "Explizites Linked-Server-Login-Mapping ohne im Modul gespeicherte Credentials"
  - "EXECUTE auf die öffentlichen Modul-USPs entsprechend Betriebsrolle"
  - "Remote-Principal benötigt EXECUTE auf Dispatcher und registrierte Zielprocedure"
collation_contract: "Provider- und Work-Type-Identifier verwenden binäre ASCII-Collation; Actor, Tenant und JSON-Payload bleiben nvarchar."
data_type_contract: "Version 1 unterstützt nur Work-Type-ParameterMode NONE und JSON_PAYLOAD mit exakt @PayloadJson nvarchar(max)."
help_contract_version: "1.0"
resultset_contracts:
  - object: "toolbelt_core.VW_SecondSessionProviders"
    kind: "data"
    resultset: "Providerkonfiguration und aktuelle sys.servers-Driftindikatoren"
  - object: "toolbelt_core.USP_ConfigureSecondSessionLoopback"
    kind: "data"
    resultset: "genau eine Providerkonfigurationszeile einschließlich Remote-Probe"
    return_code_success: 0
    error_range: "51600-51609"
  - object: "toolbelt_core.USP_ExecuteWorkTypeInNewSession"
    kind: "data"
    resultset: "standardmäßig genau eine Ausführungszeile; bei @SuppressResult = 1 kein Infrastruktur-Resultset"
    return_code_success: 0
    error_range: "51610-51620"
  - object: "toolbelt_core.USP_DispatchWorkType"
    kind: "infrastructure"
    resultset: null
    return_code_success: 0
    error_range: "51630-51638"
lifecycle_error_range: "51640-51649"
clr:
  used: false
lifecycle:
  deploy: "Deployment/Deploy.sql"
  uninstall: "Deployment/Uninstall.sql"
  execution_mode: "SQLCMD"
documentation:
  module: "README.md"
  public_objects:
    - "Documentation/SECOND_SESSION_OBJECTS.md"
  architecture:
    - "../../Documentation/Architecture/SECOND_SESSION_MODULE_DESIGN.md"
    - "../../Documentation/Architecture/DECISIONS.md"
  test_matrix:
    - "Tests/SECOND_SESSION_CONTRACT_TEST_MATRIX.md"
  evidence:
    - "Tests/README.md"
contracts:
  usp: "1.0"
  deployment: "1.0"
  validation: "1.0"
tests:
  static: "Tests/Static/validate_contract.py"
  runtime: "Tests/Runtime/SecondSession.Contract.sql"
  lifecycle: "Tests/Runtime/Lifecycle.Contract.sql"
  central: "Tests/Runtime/Central.Contract.sql"
  multi_session: "Tests/Runtime/Concurrency.Contract.sql"
  github_hosted_linux: "../../.github/workflows/w5a-second-session-runtime.yml"
validation_evidence:
  - date: "2026-08-01"
    workflow: "https://github.com/gecompat/SQL_Server_Toolbelt/actions/runs/30703841095"
    scope: "SQL Server 2025 Linux Provider-Spike; Caller-Rollback, uncommittable Caller, getrennte SPID, Remote-Fehlerrollback und Resultset-Ablehnung"
    result: "success"
  - date: "2026-08-05"
    workflow: "https://github.com/gecompat/SQL_Server_Toolbelt/actions/runs/31018284410"
    scope: "Second Session 1.1.0: suppressiertes Infrastruktur-Resultset und Event-Log-Abhängigkeit auf SQL Server 2025 Linux CL150/160/170"
    result: "success"
