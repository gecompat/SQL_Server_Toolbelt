module_id: "toolbelt.conversion.integer-base"
module_name: "Integer Base Conversion"
version: "1.1.0"
implementation_status: implemented
validation_status: "partially validated"
release_status: unreleased
description: "Codiert bigint-Werte kanonisch mit einem frei definierbaren ASCII-Alphabet und decodiert sie ohne Overflow."

sql_server_versions:
  - "2019"
  - "2022"
  - "2025"
compatibility_levels:
  - 150
  - 160
  - 170
platforms:
  windows: "not executed"
  linux: "partially validated"

providers:
  - id: tsql-inline-relational
    technology: T-SQL Inline TVFs mit rekursiver decimal(38,0)-Zwischenarithmetik und SVF-Wrappern
    platforms: [Windows, Linux]
    status: implemented

deployment_capabilities:
  local: true
  central: true
  central_with_synonyms: false
  local_required: false
  central_preferred: false

dependencies: []
schemas:
  - "toolbelt_conversion"
objects:
  - type: TVF
    schema: "toolbelt_conversion"
    name: "TVF_IntegerToBase"
    visibility: public
  - type: TVF
    schema: "toolbelt_conversion"
    name: "TVF_TryBaseToInteger"
    visibility: public
  - type: SVF
    schema: "toolbelt_conversion"
    name: "SVF_IntegerToBase"
    visibility: public
  - type: SVF
    schema: "toolbelt_conversion"
    name: "SVF_TryBaseToInteger"
    visibility: public

permissions_required:
  - "SELECT oder REFERENCES auf den Scalar-valued Functions"
  - "DDL-Rechte für Deploy und Uninstall"

collation_contract: "Alphabet-Eindeutigkeit und Ziffernzuordnung verwenden Latin1_General_100_BIN2; Groß- und Kleinschreibung bleiben verschieden."
data_type_contract: "bigint und varchar; Alphabet varchar(93), codierter Wert varchar(65); NULL und ungültige Werte liefern NULL."
help_contract_version: "not applicable"
resultset_contracts: []

lifecycle_error_range: "51090-51099"
clr:
  used: false
  permission_set: null
  trust_method: null
lifecycle:
