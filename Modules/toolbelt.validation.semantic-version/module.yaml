module_id: "toolbelt.validation.semantic-version"
module_name: "Semantic Version Validation"
version: "1.0.0"
implementation_status: implemented
validation_status: "partially validated"
release_status: unreleased
description: "Parst, vergleicht und sortiert strikte Semantic-Version-2.0.0-Werte."

sql_server_versions:
  - "2019"
  - "2022"
  - "2025"
compatibility_levels:
  - 150
  - 160
  - 170
platforms:
  windows: "not executed"
  linux: "partially validated"

providers:
  - id: tsql-state-machine
    technology: T-SQL Multi-statement TVF und Scalar UDFs
    platforms: [Windows, Linux]
    status: implemented

deployment_capabilities:
  local: true
  central: true
  central_with_synonyms: false
  local_required: false
  central_preferred: false

dependencies: []
schemas:
  - "toolbelt_validation"
objects:
  - type: TVF
    schema: "toolbelt_validation"
    name: "TVF_ParseSemanticVersion"
    visibility: public
  - type: SVF
    schema: "toolbelt_validation"
    name: "SVF_CompareSemanticVersion"
    visibility: public
  - type: SVF
    schema: "toolbelt_validation"
    name: "SVF_SemanticVersionSortKey"
    visibility: public

permissions_required:
  - "SELECT oder REFERENCES auf den Functions"
  - "DDL-Rechte für Deploy und Uninstall"

collation_contract: "Grammatik und Präzedenz verwenden Latin1_General_100_BIN2 und sind von der Datenbank-Collation unabhängig."
data_type_contract: "ASCII varchar(8000); numerische Komponenten bleiben Dezimalstrings; Sort Key ist varbinary(max)."
help_contract_version: "not applicable"
resultset_contracts:
  - name: "TVF_ParseSemanticVersion"
    columns:
      - "IsValid bit"
      - "ValidationCode varchar(32)"
      - "Major varchar(8000) NULL"
      - "Minor varchar(8000) NULL"
      - "Patch varchar(8000) NULL"
      - "PreRelease varchar(8000) NULL"
      - "BuildMetadata varchar(8000) NULL"
      - "CanonicalVersion varchar(8000) NULL"

lifecycle_error_range: "51080-51089"
clr:
  used: false
  permission_set: null
  trust_method: null
lifecycle:
  deploy: "Deployment/Deploy.sql"
  uninstall: "Deployment/Uninstall.sql"
  execution_mode: "SQLCMD"
  release_manifest: "embedded"
  source_hash_role: "diagnostic_only"

documentation:
  module: "README.md"
  public_objects:
    - "Documentation/TVF_ParseSemanticVersion.md"
    - "Documentation/SVF_CompareSemanticVersion.md"
    - "Documentation/SVF_SemanticVersionSortKey.md"
  architecture:
    - "../../Documentation/Architecture/SEMANTIC_VERSION_MODULE_DESIGN.md"
  test_matrix:
    - "Tests/SEMANTIC_VERSION_CONTRACT_TEST_MATRIX.md"
  evidence:
    - "Tests/README.md"

contracts:
  usp: "not applicable"
  deployment: "1.0"
  validation: "1.0"
tests:
  static: "Tests/Static/validate_contract.py"
  runtime: "Tests/Runtime/SemanticVersion.Contract.sql"
  contract: "Tests/Runtime/SemanticVersion.Contract.sql"
  lifecycle: "Tests/Runtime/Lifecycle.Contract.sql"
  central: "Tests/Runtime/Central.Contract.sql"
  github_hosted_linux: "../../.github/workflows/semantic-version-runtime.yml"

validation_evidence:
  - date: "2026-07-30"
    workflow: "https://github.com/gecompat/SQL_Server_Toolbelt/actions/runs/30517137373"
    scope: "SQL Server 2025 Linux; Compatibility Levels 150, 160 und 170; Parser, Comparator, Sort Key, lokales und zentrales Deployment, Kollision und Lifecycle"
    result: "success"
