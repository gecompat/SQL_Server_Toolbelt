module_id: "toolbelt.core.generate-series"
module_name: "Portable Integer Series"
version: "1.0.0"
implementation_status: implemented
validation_status: "partially validated"
release_status: unreleased
description: "Erzeugt portable int- und bigint-Zahlenreihen auf SQL Server 2019, 2022 und 2025."

sql_server_versions:
  - "2019"
  - "2022"
  - "2025"

compatibility_levels:
  - 150
  - 160
  - 170

platforms:
  windows: "not executed"
  linux: "partially validated"

providers:
  - id: tsql-inline
    technology: T-SQL Inline TVF
    platforms: [Windows, Linux]
    status: implemented

deployment_capabilities:
  local: true
  central: true
  central_with_synonyms: false
  local_required: false
  central_preferred: false

dependencies: []

schemas:
  - "toolbelt_core"

objects:
  - type: TVF
    schema: "toolbelt_core"
    name: "TVF_GenerateSeriesBigInt"
    visibility: public
  - type: TVF
    schema: "toolbelt_core"
    name: "TVF_GenerateSeriesInt"
    visibility: public

permissions_required:
  - "SELECT oder REFERENCES auf den Inline Table-valued Functions"
  - "DDL-Rechte für Deploy und Uninstall"

collation_contract: "not applicable"
data_type_contract: "Getrennte int- und bigint-Funktionen; Value entspricht dem jeweiligen Parametertyp; decimal(38,0) wird nur intern für sichere Arithmetik verwendet."
help_contract_version: "not applicable"
resultset_contracts:
  - name: "TVF_GenerateSeriesBigInt"
    columns:
      - "Value bigint"
  - name: "TVF_GenerateSeriesInt"
    columns:
      - "Value int"

lifecycle_error_range: "51050-51059"

clr:
