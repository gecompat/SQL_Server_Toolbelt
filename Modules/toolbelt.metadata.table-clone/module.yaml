module_id: "toolbelt.metadata.table-clone"
module_name: "Table Clone Planner and Executor"
version: "4.0.0"
implementation_status: implemented
validation_status: "partially validated"
release_status: unreleased
description: "Begrenzte same-database DDL-Vorschau mit explizitem Windows-Trigger-Opt-in und hashgebundene triggerfreie Ausführung ausschließlich auf neue Ziele; keine Datenkopie."
sql_server_versions:
  - "2019"
  - "2022"
  - "2025"
compatibility_levels: [150, 160, 170]
platforms:
  windows: "partially validated"
  linux: "partially validated"
providers:
  - id: tsql-catalog
    technology: T-SQL
    platforms: [Windows, Linux]
    status: "partially validated"
deployment_capabilities:
  local: true
  central: true
  central_with_synonyms: false
  local_required: false
  central_preferred: false
dependencies:
  - module_id: "toolbelt.core.result-table"
    minimum_version: "1.0.0"
    location: same_database
    reason: "Kanonischer ResultTable-Vertrag, keine kopierte Runtime."
  - module_id: "toolbelt.tsql.script-parser"
    minimum_version: "2.0.0"
    exact_version: "2.0.0"
    location: same_database
    required_when: "Runtime: IncludeTriggers = 1 auf Windows; IncludeTriggers = 0 und Moduldeployment benötigen den Parser nicht."
    reason: "Bereits separat installierter Parser; exakte Provider-/ScriptDom-Binarypins und vier AST-TVFs werden vor dem Opt-in geprüft. Keine automatische Installation."
schemas:
  - "toolbelt_metadata"
objects:
  - type: USP
    schema: "toolbelt_metadata"
    name: "USP_ScriptTableClone"
    visibility: public
  - type: USP
    schema: "toolbelt_metadata"
    name: "USP_ScriptTableCloneInternal"
    visibility: internal
  - type: USP
    schema: "toolbelt_metadata"
    name: "USP_ExecuteTableClone"
    visibility: public
permissions_required:
  - "EXECUTE; datenbankweite VIEW DEFINITION für vollständige FK-/Kollisionssicht"
  - "Lifecycle: vorhandenes DB-VIEW DEFINITION und SELECT sys.sql_expression_dependencies; failclosed53926/2, keine Rechteerteilung"
  - "Computed: vorhandenes SELECT sys.sql_expression_dependencies; fehlend/NULL blockiert53901/3"
  - "ResultTable-Helper EXECUTE und caller-lokale Tempmetadatensicht"
  - "DDL-Rechte für Deploy und Uninstall; keine Rechteausweitung"
  - "Executor: vorhandenes SERVER VIEW ANY DEFINITION und lesbare DB-/Server-Trigger-/Eventnotification-Kataloge; relevante DDL-Seiteneffekte blockieren"
  - "Executor: vorhandene CREATE TABLE-, Schema-ALTER- und REFERENCES-Rechte; keine Rechteerteilung"
  - "Trigger-Opt-in: vorhandenes SELECT auf vier Parser-TVFs und lesbare Assembly-/Modul-/Dependency-Kataloge; bestehender Parser-UNSAFE-/Trustvertrag unverändert"
collation_contract: "Identifierlookup DATABASE_DEFAULT; Scripttext und Resultshape Latin1_General_100_BIN2; Quellcollations explizit erhalten."
data_type_contract: "Identifier nvarchar(max) ungekuerzt validieren; ScriptText nvarchar(max); Ordinal int; ObjectKind varchar(32); TargetName nvarchar(776); Resultspalten NOT NULL."
help_contract_version: "1.0"
resultset_contracts:
  - name: "USP_ScriptTableClone"
    columns: ["Ordinal int NOT NULL", "ObjectKind varchar(32) NOT NULL", "TargetName nvarchar(776) NOT NULL", "ScriptText nvarchar(max) NOT NULL"]
  - name: "USP_ExecuteTableClone"
    columns: ["PlanHash varbinary(32) NOT NULL", "TablesCreated int NOT NULL", "StatementsExecuted int NOT NULL"]
lifecycle_error_range: "53920-53929"
clr:
  used: false
  permission_set: null
  trust_method: null
lifecycle:
  deploy: "Deployment/Deploy.sql"
  uninstall: "Deployment/Uninstall.sql"
  execution_mode: SQLCMD
  release_manifest: embedded
  source_hash_role: diagnostic_only
documentation:
  module: "README.md"
  public_objects:
    - "Documentation/USP_ScriptTableClone.md"
    - "Documentation/USP_ExecuteTableClone.md"
  internal_objects:
    - "Documentation/USP_ScriptTableCloneInternal.md"
  architecture:
    - "../../Documentation/Architecture/TABLE_CLONE_PROPOSAL.md"
    - "../../Documentation/Architecture/TABLE_CLONE_WAVE1_CONTRACT.md"
    - "../../Documentation/Architecture/TABLE_CLONE_WAVE2_CONTRACT.md"
    - "../../Documentation/Architecture/TABLE_CLONE_EXECUTE_CONTRACT.md"
    - "../../Documentation/Architecture/TABLE_CLONE_TRIGGER_CONTRACT.md"
  test_matrix:
    - "Tests/TABLE_CLONE_CONTRACT_TEST_MATRIX.md"
  evidence:
    - "Tests/README.md"
contracts:
  usp: "1.0"
  deployment: "1.0"
  validation: "1.0"
tests:
  static: "Tests/Static/validate_contract.py"
  runtime: "Tests/Runtime/TableClone.Contract.sql"
  contract: "Tests/Runtime/TableClone.Contract.sql"
  lifecycle: "Tests/Runtime/Lifecycle.Contract.sql"
  lifecycle_caller_deploy: "Tests/Runtime/Lifecycle.CallerTransaction.Deploy.sql"
  lifecycle_caller_uninstall: "Tests/Runtime/Lifecycle.CallerTransaction.Uninstall.sql"
  central: "Tests/Runtime/Central.Contract.sql"
  minimum_rights: "Tests/Runtime/MinimumRights.Contract.sql"
  wave2: "Tests/Runtime/Wave2.Contract.sql"
  wave2_safety: "Tests/Runtime/Wave2.Safety.sql"
  wave2_caps: "Tests/Runtime/Wave2.Caps.sql"
  wave1: "Tests/Runtime/Wave1.Contract.sql"
  wave1_datetimeoffset: "Tests/Runtime/Wave1.DateTimeOffset.sql"
  wave1_bytes: "Tests/Runtime/Wave1.Bytes.sql"
  computed_permission_predicate: "Tests/Runtime/Wave1.PermissionPredicate.sql"
  execute: "Tests/Runtime/Execute.Contract.sql"
  execute_safety: "Tests/Runtime/Execute.Safety.sql"
  triggers: "Tests/Runtime/Trigger.Contract.sql"
  trigger_safety: "Tests/Runtime/Trigger.Safety.sql"
  select_metadata: "Tests/Runtime/SelectMetadata.Contract.ps1"
  lab: "../../Tests/CI/run-table-clone-wave1-lab.ps1"
  linux_ci: "../../Tests/CI/run-table-clone-linux.sh"
  github_hosted_linux: "../../.github/workflows/table-clone-runtime.yml"
validation_evidence:
  - date: "2026-10-01"
    workflow: "local: Tests/CI/run-lab-local.ps1"
    scope: "Historische Version1.0.0: SQL Server 2019 Linux/latest CL150 und SQL Server 2025 Windows/CU8 CL150/160/170; synthetische Preview/externeTestDDL/Struktur/Identity/Indexkeys/Include/Optionen/Collations/ResultTable/own-caller-doomedTx/Clientmetadata/local-central/Minrechte/HiddenIncomingFK/Typdrift/MarkerHash/Kollision/Uninstall/LifecycleCallerTxON-OFF. Weitere Versionen/Plattformkombinationen, GitHub und LowprivCrossDB nicht ausgefuehrt."
    result: "success"



  - date: "2026-10-03"
    workflow: "local: Tests/CI/run-table-clone-wave1-lab.ps1; begrenzter Root-Caller und unabhängiger Cleanup-Audit"
    scope: "Historische Version2.0.0: Finaler öffentlicher W1-Labadapter am 2026-10-03 (lokales Datum; UTC 2026-10-02): SQL Server 2019 Linux/latest CL150 und 2025 Windows/CU8 CL150/160/170 jeweils lokal und zentral. Vier Runtime-Fixtures TableClone.Contract.sql, Wave1.Contract.sql, Wave1.DateTimeOffset.sql und Lifecycle.Contract.sql, Clientmetadata/Help/ResultTable, 27 Propertytypen samt Ownern und 18 datetimeoffset-Produktpfadroundtrips, Computed/PERSISTED/Filter, 2MiB-Atomik, Predicate-Injektionen, genuine 1.0-Upgrade, clean/repeat, Caller-TX/SET, AppLock, Rollback, Kollisions-/Dependency-Erhalt, Uninstall und eigene Bereinigung bestanden. Source-/Helper-/Genuine-Inputs hashgebunden, begrenzter Caller mit tatsächlichem Exit und vollständigen Kanälen, exakt gebundenem Journal und frischem unabhängigen Cleanup-Audit. Keine Konfigurations-, Rechte-, Trust- oder Infrastrukturänderungen. Der Zähler32 bezeichnet ausschließlich den Visibility-Teilbereich. CI am geprüften PR-Head 76888216 bestanden: alle sieben Checks SUCCESS einschließlich SQL Server 2019/2022/2025 Linux. Tatsächliche Minimalrechte mit eigenem Principal und weitere physische Ziele bleiben NOT_EXECUTED."
    result: "success"

  - date: "2026-10-04"
    workflow: "Begrenzte private W2-Nativeadapter; physische Prozess-/Journalprüfung und frischer Cleanup-Audit"
    scope: "Historische Version3.0.0: Am 2026-10-04 bestanden begrenzte private Adapter auf SQL Server 2019 Linux/latest CL150 und 2025 Windows/exakt CU8 CL170 ausschließlich lokal: Clean3 und genuine2→3 mit frischer Session, Repeat, resolved Consumer mit Deploy-/Uninstall-Ablehnung53926/1 und unverändertem Katalogsnapshot/gesunder Transaktion sowie Uninstall/Repeat. Je Lauf wurden zwei eigene Datenbanken entfernt; frische Bereinigungsprüfungen bestanden. Keine Konfigurations-, Rechte-, Owner- oder Truständerungen. Linux: drei W2-Fixtures und eine W1-Regressionsfixture stammen als Teilnachweis aus einem historischen insgesamt fehlgeschlagenen Lauf; der identische Produkt- und Fixturestand wurde wiederverwendet und im finalen Lifecycle-PASS nicht erneut ausgeführt. Windows: dieselben vier Fixtures bestanden einmal in Clean3 im aktuellen erfolgreichen Lauf, nicht erneut im Upgradezyklus. Unresolved Consumer: NOT_ESTABLISHED. Keine vollständige Produktqualifikation; weitere Ziele/CL, zentrale V3-Nutzung, Minimalrechte, übrige Lifecycle-Negativfälle und aktuelle Head-CI bleiben offen. Status bleibt teilweise validiert und unveröffentlicht."
    result: "success"

  - date: "2026-10-04"
    workflow: "Begrenzter privater Executor-Nativeadapter (PowerShell/SqlClient); unabhängige physische Prozess-/Journalprüfung"
    scope: "Version3.1.0: SQL Server 2019 Linux/latest CL150 und 2025 Windows/exakt CU8 CL170 ausschließlich lokal. Je Ziel Clean3.1 und genuine3→3.1 aus unveränderten öffentlichen 3.0-Blobs mit frischer Session, Repeat, drei Releaseobjekte und 12/12/14 Parameter, resolved Consumer mit Deploy-/Uninstall53926/1 und unverändertem Snapshot/gesunder Transaktion, Uninstall/Repeat bestanden. Execute.Contract.sql und Execute.Safety.sql je einmal im erfolgreichen Cleanzyklus: Single/Map, CREATE/DEFER, zyklische/Self-FKs, DB-DDL-Trigger-Gate, später ResultTable-Fehlerrollback, DEFAULT-UDF-Gate, Hash-/Temp-Gates und Caller-TX/Help/SET-Erhalt. Unabhängiger Client-Hash und ein dreispaltiges Result mit genauen SQL-/CLR-Typen, NOT NULL, Binary32, EOF und keinem Folgeresult bestanden. Je zwei eigene Datenbanken entfernt; frischer Cleanup-Audit, vollständige Prozesskanäle und unveränderte Inputpins unabhängig geprüft. Keine Konfigurations-, Rechte-, Owner- oder Truständerungen. Frühere fehlgeschlagene Läufe sind kein Gesamt-PASS. Serverweite negative Trigger-/Eventnotification-Fixtures, unresolved Consumer, tatsächliche Minimalrechte, weitere native Ziele/CL und zentrale Executor-Nutzung nicht ausgeführt. Head-CI ist separat im Pull Request nachzuweisen; teilweise validiert und unveröffentlicht."
    result: "success"

  - date: "2026-10-04"
    workflow: "Begrenzter privater Trigger-Nativeadapter; unabhängige physische Prozess-/Journalprüfung"
    scope: "Version4.0.0: SQL Server 2025 Windows/exakt CU8 CL170 ausschließlich lokal. Beide Trigger-Fixtures einmal in Clean4: Map-/Header-/Qualifier-/CTE-/Aliasumschreibung, UTF16/Kommentare/Literale, SET-/Event-/FIRST-LAST-/Disabledzustand und tatsächliches AFTER-/INSTEAD-Verhalten; sieben atomare Negativfälle einschließlich externer AST-Ablehnung53903/19 und bestehender/geplanter Namenskollisionen. Clean4 und genuine3.1→4 mit frischer Session, Repeat, drei Slots/13-13-14 Parameter, unabhängiger Clienthash mit typgenauer dreispaltiger NOT-NULL/Binary32/EOF-Ausgabe, vier resolved-Consumer-Ablehnungen53926/1 und Uninstall/Repeat bestanden. Zwei eigene Datenbanken entfernt, temporärer exakter Parsertrust wiederhergestellt und vorbestehender ScriptDom-Trust erhalten; frischer Cleanup, vollständige Prozesskanäle/Journale/Inputpins unabhängig physisch geprüft. Keine Konfigurations-, Rechte- oder Owneränderung. Separater Linux2019/latest-CL150-Option0-/4.0-Hash-/Lifecycle-PASS wiederverwendet: nachfolgende Coreänderungen ausschließlich Option1 unabhängig sourcegeprüft, keine erneute Linux-Ausführung oder Linux-Triggerqualifikation behauptet. Frühere Fehlerläufe kein Gesamt-PASS. Weitere native Ziele/CL, zentrale4.0, Minimalrechte, serverweite negative Fixtures und unsichtbare/mehrdeutige Kontexte nicht ausgeführt; unresolved Consumer nicht etabliert. Head-CI separat im PR; teilweise validiert und unveröffentlicht."
    result: "success"
