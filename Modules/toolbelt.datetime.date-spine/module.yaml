module_id: "toolbelt.datetime.date-spine"
module_name: "Relational Date Spine"
version: "1.0.0"
implementation_status: implemented
validation_status: validated
release_status: unreleased
description: "Erzeugt portable Tages-, ISO-Wochen- und Monatsperioden für halboffene date-Bereiche."

sql_server_versions:
  - "2019"
  - "2022"
  - "2025"

compatibility_levels:
  - 150
  - 160
  - 170

platforms:
  windows: validated
  linux: "validated"

providers:
  - id: tsql-inline
    technology: T-SQL Inline TVF
    platforms: [Windows, Linux]
    status: validated

deployment_capabilities:
  local: true
  central: true
  central_with_synonyms: false
  local_required: false
  central_preferred: false

dependencies:
  - module_id: "toolbelt.core.generate-series"
    minimum_version: "1.0.0"
    location: same_database
  - module_id: "toolbelt.datetime.truncate"
    minimum_version: "1.0.0"
    location: same_database

schemas:
  - "toolbelt_datetime"

objects:
  - type: TVF
    schema: "toolbelt_datetime"
    name: "TVF_DateSpineDay"
    visibility: public
  - type: TVF
    schema: "toolbelt_datetime"
    name: "TVF_DateSpineIsoWeek"
    visibility: public
  - type: TVF
    schema: "toolbelt_datetime"
    name: "TVF_DateSpineMonth"
    visibility: public
  - type: TVF
    schema: "toolbelt_datetime"
    name: "TVF_DateSpineCore"
    visibility: internal

permissions_required:
  - "SELECT oder REFERENCES auf den öffentlichen Inline Table-valued Functions"
  - "DDL-Rechte für Deploy und Uninstall"

collation_contract: "Nur der interne Grain-Schlüssel verwendet Latin1_General_100_BIN2; Ergebnisse sind collation-unabhängig."
data_type_contract: "Beide Grenzen und PeriodStart sind date; Ordinal ist nullfreies int und beginnt bei 0."
help_contract_version: "not applicable"
resultset_contracts:
  - name: "TVF_DateSpineDay"
    columns:
      - "Ordinal int"
      - "PeriodStart date"
  - name: "TVF_DateSpineIsoWeek"
    columns:
      - "Ordinal int"
      - "PeriodStart date"
  - name: "TVF_DateSpineMonth"
    columns:
      - "Ordinal int"
      - "PeriodStart date"

lifecycle_error_range: "51800-51809"

clr:
  used: false
  permission_set: null
  trust_method: null

lifecycle:
  deploy: "Deployment/Deploy.sql"
  uninstall: "Deployment/Uninstall.sql"
  execution_mode: "SQLCMD"
  release_manifest: "embedded"
  source_hash_role: "diagnostic_only"

documentation:
  module: "README.md"
  public_objects:
    - "Documentation/TVF_DateSpineDay.md"
    - "Documentation/TVF_DateSpineIsoWeek.md"
    - "Documentation/TVF_DateSpineMonth.md"
  internal_objects:
