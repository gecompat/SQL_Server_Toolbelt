  contract: "Tests/Runtime/DateSpine.Contract.sql"
  lifecycle: "Tests/Runtime/Lifecycle.Contract.sql"
  central: "Tests/Runtime/Central.Contract.sql"
  github_hosted_linux: "../../.github/workflows/date-spine-runtime.yml"

