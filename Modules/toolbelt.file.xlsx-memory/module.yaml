version: "1.2.0"
implementation_status: implemented
validation_status: "partially validated"
release_status: unreleased
description: "Begrenzter SAFE Binary-XLSX-Reader, invariante Typinterpretation und explizite Einzelzell-Anzeigeformatierung."
