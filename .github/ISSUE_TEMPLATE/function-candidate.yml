name: Funktionskandidat
description: Vorschlag für eine Toolbelt-Funktion oder einen geprüften Backlog-Kandidaten
title: "[Kandidat] "
labels: ["kandidat", "backlog"]
body:
  - type: markdown
    attributes:
      value: |
        Verwende synthetische oder fachlich relevante öffentliche Informationen. Öffentliche Organisations-/Projektnamen und Links sind zulässig. Keine personenbezogenen/sensiblen, internen/vertraulichen, Original-, nicht öffentlichen Infrastruktur-, realen Runtime-, Remote-Runner-Hardware- oder Secret-Daten.

  - type: dropdown
    id: ziel_repo
    attributes:
      label: Ziel-Repository
      options:
        - SQL_Server_Toolbelt
        - SQL_Server_Analyze
        - Man kann es auch übertreiben
    validations:
      required: true

  - type: dropdown
    id: kategorie
    attributes:
      label: Kategorie
      options:
        - String
        - Datetime
        - Conversion
        - Validation
        - JSON
        - XML
        - Metadata
        - Security
        - Core
        - Analyse
        - Sonstige
    validations:
      required: true

  - type: textarea
    id: luecke
    attributes:
      label: SQL-Server-Lücke
      description: Was fehlt ab SQL Server 2019 oder ist nur mit wiederkehrender Implementierung möglich?
    validations:
      required: true

  - type: checkboxes
    id: versionen
    attributes:
      label: Betroffene SQL-Server-Versionen
      options:
        - label: SQL Server 2019
        - label: SQL Server 2022
        - label: SQL Server 2025
        - label: spätere oder andere Version

  - type: dropdown
    id: native_later
    attributes:
      label: Spätere native Funktion bekannt?
      options:
        - "Nein"
        - "Ja – Version und Quelle unten angeben"
        - "Unklar"
    validations:
      required: true

  - type: textarea
    id: nutzen
    attributes:
      label: Nutzen und Use Case
      description: Realistischer oder theoretischer Use Case und Mehrwert gegenüber dem Status quo.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Fakten, Vermutungen und offene Fragen
      description: Dokumentierte Fakten und noch ungeprüfte Aussagen getrennt aufführen.
    validations:
      required: true

  - type: textarea
    id: duplikatpruefung
    attributes:
      label: Duplikatprüfung
      description: Geprüfte Backlog-Listen und bei Analyze-Kandidaten das geprüfte Ziel-Repository.
    validations:
      required: true

  - type: textarea
    id: primaerquelle
    attributes:
      label: Primärquelle
      description: Microsoft-Dokumentation, offizielle Release Notes oder andere belastbare Primärquelle.

  - type: checkboxes
    id: datenschutz
    attributes:
      label: Datenschutzbestätigung
      options:
        - label: Dieser Issue enthält keine personenbezogenen/sensiblen, internen/vertraulichen, Original-, nicht öffentlichen Infrastruktur-, realen Runtime-, konkreten Remote-Runner-Hardware- oder Secret-Daten. Öffentliche relevante Organisations-/Projektnamen und Links sind zulässig.
          required: true
