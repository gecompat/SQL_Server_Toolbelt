name: Temporary Generate Repository Status Output

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/temp-generate-status-output.yml
      - Tests/Documentation/run_temp_status_sync.py
      - .github/workflows/temp-sync-repository-status.yml

permissions:
  contents: read

jobs:
  windows-filesystem-build:
    name: Windows filesystem build and static contract
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build .NET Framework SQL CLR assembly
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere)) {
            throw "Visual Studio locator was not found on the Windows runner."
          }
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($msbuild) -or -not (Test-Path -LiteralPath $msbuild)) {
            throw "MSBuild.exe was not found through vswhere."
          }
          & $msbuild Modules/toolbelt.filesystem.windows/Clr/Toolbelt.Filesystem.Windows.csproj /p:Configuration=Release /p:Platform=AnyCPU
          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild.exe failed with exit code $LASTEXITCODE."
          }
      - name: Validate Windows filesystem static contract
        shell: pwsh
        run: python Modules/toolbelt.filesystem.windows/Tests/Static/validate_contract.py

  generate-output:
    name: Generate validated repository output
    needs: windows-filesystem-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EVIDENCE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Patch repository metadata and planning artifacts
        run: python3 Tests/Documentation/run_temp_status_sync.py
      - name: Validate File Content static contract
        run: python3 Modules/toolbelt.file.content/Tests/Static/validate_contract.py
      - name: Execute File Content SQL Server 2025 Linux matrix
        env:
          TBX_SQL_IMAGE: mcr.microsoft.com/mssql/server:2025-latest
        run: bash Tests/CI/run-file-content-linux.sh
      - name: Generate and validate repository status
        run: |
          python3 Tests/Documentation/validate_documentation.py --all --write
          python3 Tests/Documentation/validate_documentation.py --all
      - name: Package validated output
        run: |
          mkdir -p .runtime
          git diff --name-only --diff-filter=ACMR > .runtime/changed-files.txt
          tar --exclude=.git --exclude=.runtime -czf .runtime/repository-status-output.tar.gz .
      - name: Upload validated output
        uses: actions/upload-artifact@v4
        with:
          name: repository-status-output
          if-no-files-found: error
          path: |
            .runtime/repository-status-output.tar.gz
            .runtime/changed-files.txt
