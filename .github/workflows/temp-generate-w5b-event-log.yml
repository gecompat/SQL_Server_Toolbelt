name: Temporary Generate W5b Event Log

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/temp-generate-w5b-event-log.yml
      - Tests/Documentation/generate_w5b_event_module.py
      - Tests/Documentation/patch_w5b_repository.py
      - Tests/CI/run-w5b-event-log-linux.sh

permissions:
  contents: write

jobs:
  generate-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EVIDENCE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      TBX_SQL_IMAGE: mcr.microsoft.com/mssql/server:2025-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Generate modules
        run: python3 Tests/Documentation/generate_w5b_event_module.py
      - name: Couple repository metadata
        run: python3 Tests/Documentation/patch_w5b_repository.py
      - name: Validate static contracts
        run: |
          python3 Modules/toolbelt.core.second-session/Tests/Static/validate_contract.py
          python3 Modules/toolbelt.core.event-log/Tests/Static/validate_contract.py
      - name: Execute SQL Server 2025 compatibility matrix
        run: bash Tests/CI/run-w5b-event-log-linux.sh
      - name: Generate and validate repository status
        run: |
          python3 Tests/Documentation/validate_documentation.py --all --write
          python3 Tests/Documentation/validate_documentation.py --all
      - name: Commit consistent W5b state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- \
            .github/workflows/temp-generate-w5b-event-log.yml \
            Tests/Documentation/generate_w5b_event_module.py \
            Tests/Documentation/patch_w5b_repository.py
          if git diff --cached --quiet; then
            echo "Keine dauerhaften W5b-Änderungen zu committen."
            exit 0
          fi
          git commit -m "ChatGPT [LLM: GPT-5.6 Thinking]: Implementiere W5b Event Log"
          git push origin HEAD:${{ github.head_ref }}
