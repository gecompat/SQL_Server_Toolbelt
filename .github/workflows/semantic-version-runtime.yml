name: Semantic-Version Runtime

on:
  pull_request:
    paths:
      - ".github/workflows/semantic-version-runtime.yml"
      - "Modules/toolbelt.validation.semantic-version/module.yaml"
      - "Modules/toolbelt.validation.semantic-version/Source/**"
      - "Modules/toolbelt.validation.semantic-version/Deployment/**"
      - "Modules/toolbelt.validation.semantic-version/Tests/Runtime/**"
      - "Modules/toolbelt.validation.semantic-version/Tests/Static/**"
      - "Tests/CI/run-semantic-version-linux.sh"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/semantic-version-runtime.yml"
      - "Modules/toolbelt.validation.semantic-version/module.yaml"
      - "Modules/toolbelt.validation.semantic-version/Source/**"
      - "Modules/toolbelt.validation.semantic-version/Deployment/**"
      - "Modules/toolbelt.validation.semantic-version/Tests/Runtime/**"
      - "Modules/toolbelt.validation.semantic-version/Tests/Static/**"
      - "Tests/CI/run-semantic-version-linux.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semantic-version-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: SQL Server ${{ matrix.sql-version }} Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sql-version: ["2019", "2022", "2025"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate static contract
        run: >-
          python3
          Modules/toolbelt.validation.semantic-version/Tests/Static/validate_contract.py

      - name: Execute synthetic compatibility and lifecycle tests
        env:
          TBX_SQL_VERSION: ${{ matrix.sql-version }}
          TBX_SQL_IMAGE: mcr.microsoft.com/mssql/server:${{ matrix.sql-version }}-latest
        run: bash Tests/CI/run-lab-target.sh Tests/CI/run-semantic-version-linux.sh
