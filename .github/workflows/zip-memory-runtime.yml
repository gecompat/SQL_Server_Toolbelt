# Current markerless install gates run separately; native lifecycle jobs below retain their original source.
name: ZIP Memory CLR Runtime

on:
  pull_request:
    paths:
      - "Tests/CI/run-lab-target.sh"
      - "Tests/CI/Set-SqlClientTlsPolicy.ps1"
      - "Modules/toolbelt.archive.zip-memory/Clr/**"
      - "Modules/toolbelt.archive.zip-memory/Source/**"
      - "Modules/toolbelt.archive.zip-memory/Deployment/**"
      - "Modules/toolbelt.archive.zip-memory/Scripts/**"
      - "Modules/toolbelt.archive.zip-memory/Tests/Runtime/**"
      - "Modules/toolbelt.archive.zip-memory/Tests/Static/**"
      - "Modules/toolbelt.archive.zip-memory/module.yaml"
      - "Modules/toolbelt.filesystem.windows/Clr/**"
      - "Modules/toolbelt.filesystem.windows/Tests/Runtime/ArchiveDestination.Framework.cs"
      - "Modules/toolbelt.core.result-table/Source/**"
      - "Modules/toolbelt.core.result-table/Deployment/**"
      - "Modules/toolbelt.core.result-table/module.yaml"
      - "Tests/CI/run-zip-memory-linux.sh"
      - ".github/workflows/zip-memory-runtime.yml"
  push:
    branches: [main]
    paths:
      - "Tests/CI/run-lab-target.sh"
      - "Tests/CI/Set-SqlClientTlsPolicy.ps1"
      - "Modules/toolbelt.archive.zip-memory/Clr/**"
      - "Modules/toolbelt.archive.zip-memory/Source/**"
      - "Modules/toolbelt.archive.zip-memory/Deployment/**"
      - "Modules/toolbelt.archive.zip-memory/Scripts/**"
      - "Modules/toolbelt.archive.zip-memory/Tests/Runtime/**"
      - "Modules/toolbelt.archive.zip-memory/Tests/Static/**"
      - "Modules/toolbelt.archive.zip-memory/module.yaml"
      - "Modules/toolbelt.filesystem.windows/Clr/**"
      - "Modules/toolbelt.filesystem.windows/Tests/Runtime/ArchiveDestination.Framework.cs"
      - "Modules/toolbelt.core.result-table/Source/**"
      - "Modules/toolbelt.core.result-table/Deployment/**"
      - "Modules/toolbelt.core.result-table/module.yaml"
      - "Tests/CI/run-zip-memory-linux.sh"
      - ".github/workflows/zip-memory-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zip-memory-clr-${{ github.ref }}
  # Laufende Runtimeprüfung erhalten: keine belegte Hard-Interrupt-Bereinigung.
  cancel-in-progress: false

jobs:
  static-contract:
    name: Static contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && '2fbe8e3e86f370b22ad2ce9f9716d971072a052b' || github.sha }}
      - run: >-
          python3
          Modules/toolbelt.archive.zip-memory/Tests/Static/validate_contract.py

  build-net-framework:
    name: .NET Framework 4.8 build
    needs: static-contract
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && '2fbe8e3e86f370b22ad2ce9f9716d971072a052b' || github.sha }}
          fetch-depth: 0
      - name: Historical 1.2.0 release fixture
        shell: pwsh
        run: ./Modules/toolbelt.archive.zip-memory/Scripts/New-LegacyReleaseFixture.ps1
      - name: Build assembly and generate release inputs
        shell: pwsh
        run: >-
          ./Modules/toolbelt.archive.zip-memory/Scripts/New-ClrReleaseArtifacts.ps1
          -Configuration Release
          -OutputDirectory ./.runtime/zip-memory-release
      - name: Independent Framework writer contract
        shell: powershell
        run: |
          $assembly = [IO.Path]::GetFullPath('./.runtime/zip-memory-release/Toolbelt.Archive.ZipMemory.dll')
          $manifest = Get-Content -LiteralPath './.runtime/zip-memory-release/Toolbelt.Archive.ZipMemory.trust-manifest.json' -Raw | ConvertFrom-Json
          if ($manifest.moduleId -cne 'toolbelt.archive.zip-memory' -or $manifest.assemblyFileName -cne 'Toolbelt.Archive.ZipMemory.dll' -or $manifest.sha512 -isnot [string] -or $manifest.sha512 -cnotmatch '\A[A-Fa-f0-9]{128}\z') { throw 'ZIP_WRITER_FRAMEWORK_BINARY_INTAKE' }
          $length = (Get-Item -LiteralPath $assembly).Length
          if ($length -lt 1 -or $length -gt 4194304) { throw 'ZIP_WRITER_FRAMEWORK_BINARY_INTAKE' }
          $ownDirectory = [IO.Path]::GetFullPath((Join-Path $env:RUNNER_TEMP ('zip-writer-framework-' + [guid]::NewGuid().ToString('N'))))
          ./Modules/toolbelt.archive.zip-memory/Tests/Runtime/Writer.Framework.ps1 -AssemblyPath $assembly -ExpectedAssemblySHA512 $manifest.sha512 -ExpectedAssemblyLength $length.ToString([Globalization.CultureInfo]::InvariantCulture) -EvidenceDirectory $ownDirectory
      - name: Current Archive Reader and NTFS extraction contracts
        if: github.event_name != 'workflow_dispatch'
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP ('toolbelt-archive-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $out | Out-Null
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $msbuild = & $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -find 'MSBuild/**/Bin/MSBuild.exe' | Select-Object -First 1
          & $msbuild Modules/toolbelt.filesystem.windows/Clr/Toolbelt.Filesystem.Windows.csproj /t:Rebuild /p:Configuration=Release "/p:OutputPath=$out/" "/p:BaseIntermediateOutputPath=$out/obj/" /nologo /v:minimal /m:1
          if ($LASTEXITCODE) { throw 'ZIP_PROVIDER_BUILD_FAILED' }
          $csc = Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          $zip = Join-Path $out 'Toolbelt.Archive.ZipMemory.dll'
          $filesystem = Join-Path $out 'Toolbelt.Filesystem.Windows.dll'
          $entry = (Resolve-Path Modules/toolbelt.archive.zip-memory/Tests/Runtime/EntrySecurity.Framework.cs).Path
          $destination = (Resolve-Path Modules/toolbelt.filesystem.windows/Tests/Runtime/ArchiveDestination.Framework.cs).Path
          $entryTest = Join-Path $out 'ZipEntrySecurity.exe'
          $destinationTest = Join-Path $out 'ArchiveDestination.Framework.exe'
          & $csc /nologo "/out:$entryTest" /reference:System.Data.dll /reference:System.IO.Compression.dll "/reference:$zip" $entry
          if ($LASTEXITCODE) { throw 'ZIP_ENTRY_SECURITY_TEST_BUILD_FAILED' }
          & $csc /nologo "/out:$destinationTest" /reference:System.Data.dll /reference:System.IO.Compression.dll "/reference:$zip" "/reference:$filesystem" $destination
          if ($LASTEXITCODE) { throw 'ZIP_DESTINATION_TEST_BUILD_FAILED' }
          & $entryTest
          if ($LASTEXITCODE) { throw 'ZIP_ENTRY_SECURITY_TEST_FAILED' }
          & $destinationTest ([IO.Path]::GetTempPath())
          if ($LASTEXITCODE) { throw 'ZIP_DESTINATION_TEST_FAILED' }
      - name: Upload exact deployment input
        uses: actions/upload-artifact@v4
        with:
          name: zip-memory-clr-release-input
          if-no-files-found: error
          path: .runtime/zip-memory-release/**

  sql-server-linux:
    # Retired SQLCMD/marker lifecycle: explicit historical dispatch only.
    if: github.event_name == 'workflow_dispatch'
    name: SQL Server ${{ matrix.sql_version }} Linux / compatibility ${{ matrix.compatibility_level }}
    needs: build-net-framework
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - sql_version: "2019"
            image: "mcr.microsoft.com/mssql/server:2019-latest"
            compatibility_level: 150
          - sql_version: "2022"
            image: "mcr.microsoft.com/mssql/server:2022-latest"
            compatibility_level: 160
          - sql_version: "2025"
            image: "mcr.microsoft.com/mssql/server:2025-latest"
            compatibility_level: 150
          - sql_version: "2025"
            image: "mcr.microsoft.com/mssql/server:2025-latest"
            compatibility_level: 160
          - sql_version: "2025"
            image: "mcr.microsoft.com/mssql/server:2025-latest"
            compatibility_level: 170
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && '2fbe8e3e86f370b22ad2ce9f9716d971072a052b' || github.sha }}
      - name: Download exact deployment input
        uses: actions/download-artifact@v4
        with:
          name: zip-memory-clr-release-input
          path: .runtime/zip-memory-release
      - name: Deploy, execute and uninstall CLR ZIP module
        env:
          TBX_SQL_IMAGE: ${{ matrix.image }}
          TBX_SQL_VERSION: ${{ matrix.sql_version }}
          TBX_COMPATIBILITY_LEVEL: ${{ matrix.compatibility_level }}
          TBX_ASSEMBLY_ROOT: .runtime/zip-memory-release
        run: bash Tests/CI/run-lab-target.sh Tests/CI/run-zip-memory-linux.sh
