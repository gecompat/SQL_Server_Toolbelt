name: ZIP Memory CLR Runtime

on:
  pull_request:
    paths:
      - "Modules/toolbelt.archive.zip-memory/Clr/**"
      - "Modules/toolbelt.archive.zip-memory/Source/**"
      - "Modules/toolbelt.archive.zip-memory/Deployment/**"
      - "Modules/toolbelt.archive.zip-memory/Scripts/**"
      - "Modules/toolbelt.archive.zip-memory/Tests/Runtime/**"
      - "Modules/toolbelt.archive.zip-memory/Tests/Static/**"
      - "Modules/toolbelt.archive.zip-memory/module.yaml"
      - "Modules/toolbelt.core.result-table/Source/**"
      - "Modules/toolbelt.core.result-table/Deployment/**"
      - "Modules/toolbelt.core.result-table/module.yaml"
      - "Tests/CI/run-zip-memory-linux.sh"
      - ".github/workflows/zip-memory-runtime.yml"
  push:
    branches: [main]
    paths:
      - "Modules/toolbelt.archive.zip-memory/Clr/**"
      - "Modules/toolbelt.archive.zip-memory/Source/**"
      - "Modules/toolbelt.archive.zip-memory/Deployment/**"
      - "Modules/toolbelt.archive.zip-memory/Scripts/**"
      - "Modules/toolbelt.archive.zip-memory/Tests/Runtime/**"
      - "Modules/toolbelt.archive.zip-memory/Tests/Static/**"
      - "Modules/toolbelt.archive.zip-memory/module.yaml"
      - "Modules/toolbelt.core.result-table/Source/**"
      - "Modules/toolbelt.core.result-table/Deployment/**"
      - "Modules/toolbelt.core.result-table/module.yaml"
      - "Tests/CI/run-zip-memory-linux.sh"
      - ".github/workflows/zip-memory-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zip-memory-clr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-contract:
    name: Static contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: >-
          python3
          Modules/toolbelt.archive.zip-memory/Tests/Static/validate_contract.py

  build-net-framework:
    name: .NET Framework 4.8 build
    needs: static-contract
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build assembly and generate release inputs
        shell: pwsh
        run: >-
          ./Modules/toolbelt.archive.zip-memory/Scripts/New-ClrReleaseArtifacts.ps1
          -Configuration Release
          -OutputDirectory ./.runtime/zip-memory-release
      - name: Upload exact deployment input
        uses: actions/upload-artifact@v4
        with:
          name: zip-memory-clr-release-input
          if-no-files-found: error
          path: .runtime/zip-memory-release/*

  sql-server-linux:
    name: SQL Server ${{ matrix.sql_version }} Linux / compatibility ${{ matrix.compatibility_level }}
    needs: build-net-framework
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - sql_version: "2019"
            image: "mcr.microsoft.com/mssql/server:2019-latest"
            compatibility_level: 150
          - sql_version: "2022"
            image: "mcr.microsoft.com/mssql/server:2022-latest"
            compatibility_level: 160
          - sql_version: "2025"
            image: "mcr.microsoft.com/mssql/server:2025-latest"
            compatibility_level: 150
          - sql_version: "2025"
            image: "mcr.microsoft.com/mssql/server:2025-latest"
            compatibility_level: 160
          - sql_version: "2025"
            image: "mcr.microsoft.com/mssql/server:2025-latest"
            compatibility_level: 170
    steps:
      - uses: actions/checkout@v4
      - name: Download exact deployment input
        uses: actions/download-artifact@v4
        with:
          name: zip-memory-clr-release-input
          path: .runtime/zip-memory-release
      - name: Deploy, execute and uninstall CLR ZIP module
        env:
          TBX_SQL_IMAGE: ${{ matrix.image }}
          TBX_SQL_VERSION: ${{ matrix.sql_version }}
          TBX_COMPATIBILITY_LEVEL: ${{ matrix.compatibility_level }}
          TBX_ASSEMBLY_ROOT: .runtime/zip-memory-release
        run: bash Tests/CI/run-zip-memory-linux.sh
