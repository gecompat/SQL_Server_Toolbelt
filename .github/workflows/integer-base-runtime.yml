# Current markerless install gates run separately; native lifecycle jobs below retain their original source.
name: IntegerBase Runtime

on:
  pull_request:
    paths:
      - "Tests/CI/run-lab-target.sh"
      - ".github/workflows/integer-base-runtime.yml"
      - "Modules/toolbelt.conversion.integer-base/module.yaml"
      - "Modules/toolbelt.conversion.integer-base/Source/**"
      - "Modules/toolbelt.conversion.integer-base/Deployment/**"
      - "Modules/toolbelt.conversion.integer-base/Tests/Runtime/**"
      - "Modules/toolbelt.conversion.integer-base/Tests/Static/**"
      - "Tests/CI/run-integer-base-linux.sh"
  push:
    branches:
      - main
    paths:
      - "Tests/CI/run-lab-target.sh"
      - ".github/workflows/integer-base-runtime.yml"
      - "Modules/toolbelt.conversion.integer-base/module.yaml"
      - "Modules/toolbelt.conversion.integer-base/Source/**"
      - "Modules/toolbelt.conversion.integer-base/Deployment/**"
      - "Modules/toolbelt.conversion.integer-base/Tests/Runtime/**"
      - "Modules/toolbelt.conversion.integer-base/Tests/Static/**"
      - "Tests/CI/run-integer-base-linux.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integer-base-runtime-${{ github.ref }}
  # Laufende Runtimeprüfung erhalten: keine belegte Hard-Interrupt-Bereinigung.
  cancel-in-progress: false

jobs:
  current-component-contract:
    name: Current component equivalence and original lifecycle assertions
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject business drift before reusing original assertions
        run: |
          python -B Modules/toolbelt.conversion.integer-base/Tests/Static/validate_contract.py
  runtime:
    # Retired SQLCMD/marker lifecycle: explicit historical dispatch only.
    if: github.event_name == 'workflow_dispatch'
    name: SQL Server ${{ matrix.sql-version }} Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sql-version: ["2019", "2022", "2025"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && '2fbe8e3e86f370b22ad2ce9f9716d971072a052b' || github.sha }}

      - name: Validate static contract
        run: >-
          python3
          Modules/toolbelt.conversion.integer-base/Tests/Static/validate_contract.py

      - name: Execute synthetic compatibility and lifecycle tests
        env:
          TBX_SQL_VERSION: ${{ matrix.sql-version }}
          TBX_SQL_IMAGE: mcr.microsoft.com/mssql/server:${{ matrix.sql-version }}-latest
        run: bash Tests/CI/run-lab-target.sh Tests/CI/run-integer-base-linux.sh
