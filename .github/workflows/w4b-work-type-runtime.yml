# Current markerless install gates run separately; native lifecycle jobs below retain their original source.
name: W4b Work Type Runtime

on:
  pull_request:
    branches:
      - main
    paths:
      - "Tests/CI/run-lab-target.sh"
      - "Modules/toolbelt.core.result-table/Source/**"
      - "Modules/toolbelt.core.result-table/Deployment/**"
      - "Modules/toolbelt.core.result-table/module.yaml"
      - Tests/CI/WorkTypeAuthorization.Fixture.sql
      - Modules/toolbelt.core.work-type/**
      - Documentation/Architecture/WORK_TYPE_MODULE_DESIGN.md
      - Documentation/Standards/SQL_OBJECT_NAMING.md
      - Tests/CI/run-w4b-work-type-linux.sh
      - .github/workflows/w4b-work-type-runtime.yml
      # Reine Moduldokumentation benötigt keine Runtime-/Buildmatrix.
      - "!Modules/*/Documentation/**/*.md"
      - "!Modules/*/README.md"
      - "!Modules/*/CHANGELOG.md"
      - "!Modules/*/Tests/**/*.md"
      - "!Modules/*/Tests/*.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: Static contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && '2fbe8e3e86f370b22ad2ce9f9716d971072a052b' || github.sha }}
      - name: Validate Work Type
        run: python3 Modules/toolbelt.core.work-type/Tests/Static/validate_contract.py

  runtime:
    # Retired SQLCMD/marker lifecycle: explicit historical dispatch only.
    if: github.event_name == 'workflow_dispatch'
    name: SQL Server ${{ matrix.sql-version }} Linux
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        sql-version: ["2019", "2022", "2025"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && '2fbe8e3e86f370b22ad2ce9f9716d971072a052b' || github.sha }}
      - name: Execute catalog, concurrency, lifecycle and central contracts
        env:
          TBX_SQL_VERSION: ${{ matrix.sql-version }}
          TBX_SQL_IMAGE: mcr.microsoft.com/mssql/server:${{ matrix.sql-version }}-latest
        run: bash Tests/CI/run-lab-target.sh Tests/CI/run-w4b-work-type-linux.sh
