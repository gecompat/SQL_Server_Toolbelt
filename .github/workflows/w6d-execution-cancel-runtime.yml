name: W6d Execution Cancellation Runtime

on:
  pull_request:
    paths:
      - ".github/workflows/w6d-execution-cancel-runtime.yml"
      - "Modules/toolbelt.core.execution-cancel/**"
      - "Modules/toolbelt.core.execution-context/**"
      - "Tests/CI/run-w6d-execution-cancel-linux.sh"
  push:
    branches: [main]
    paths:
      - ".github/workflows/w6d-execution-cancel-runtime.yml"
      - "Modules/toolbelt.core.execution-cancel/**"
      - "Modules/toolbelt.core.execution-context/**"
      - "Tests/CI/run-w6d-execution-cancel-linux.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: w6d-execution-cancel-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: SQL Server ${{ matrix.sql-version }} Linux
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        sql-version: ["2019", "2022", "2025"]
    steps:
      - uses: actions/checkout@v4
      - name: Validate static contract
        run: python3 Modules/toolbelt.core.execution-cancel/Tests/Static/validate_contract.py
      - name: Execute synthetic contracts
        env:
          TBX_SQL_VERSION: ${{ matrix.sql-version }}
          TBX_SQL_IMAGE: mcr.microsoft.com/mssql/server:${{ matrix.sql-version }}-latest
        run: bash Tests/CI/run-lab-target.sh Tests/CI/run-w6d-execution-cancel-linux.sh
