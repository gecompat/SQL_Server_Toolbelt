# Current markerless install gates run separately; native lifecycle jobs below retain their original source.
name: W6d Execution Cancellation Runtime

on:
  pull_request:
    paths:
      - "Tests/CI/run-lab-target.sh"
      - ".github/workflows/w6d-execution-cancel-runtime.yml"
      - "Modules/toolbelt.core.execution-cancel/**"
      - "Modules/toolbelt.core.execution-context/**"
      - "Tests/CI/run-w6d-execution-cancel-linux.sh"
      - "Tests/CI/test_w6d_repeat_levels.py"
      # Reine Moduldokumentation benötigt keine Runtime-/Buildmatrix.
      - "!Modules/*/Documentation/**/*.md"
      - "!Modules/*/README.md"
      - "!Modules/*/CHANGELOG.md"
      - "!Modules/*/Tests/**/*.md"
      - "!Modules/*/Tests/*.md"
  push:
    branches: [main]
    paths:
      - "Tests/CI/run-lab-target.sh"
      - ".github/workflows/w6d-execution-cancel-runtime.yml"
      - "Modules/toolbelt.core.execution-cancel/**"
      - "Modules/toolbelt.core.execution-context/**"
      - "Tests/CI/run-w6d-execution-cancel-linux.sh"
      - "Tests/CI/test_w6d_repeat_levels.py"
      # Reine Moduldokumentation benötigt keine Runtime-/Buildmatrix.
      - "!Modules/*/Documentation/**/*.md"
      - "!Modules/*/README.md"
      - "!Modules/*/CHANGELOG.md"
      - "!Modules/*/Tests/**/*.md"
      - "!Modules/*/Tests/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: w6d-execution-cancel-runtime-${{ github.ref }}
  # Laufende Runtimeprüfung erhalten: keine belegte Hard-Interrupt-Bereinigung.
  cancel-in-progress: false

jobs:
  current-component-contract:
    name: Current component equivalence and original lifecycle assertions
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject business drift before reusing original assertions
        run: |
          python -B Modules/toolbelt.core.execution-cancel/Tests/Static/validate_contract.py
          python -B Modules/toolbelt.core.execution-context/Tests/Static/validate_contract.py
  runtime:
    # Retired SQLCMD/marker lifecycle: explicit historical dispatch only.
    if: github.event_name == 'workflow_dispatch'
    name: SQL Server ${{ matrix.sql-version }} Linux
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        sql-version: ["2019", "2022", "2025"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && '2fbe8e3e86f370b22ad2ce9f9716d971072a052b' || github.sha }}
      - name: Validate static contract
        run: |
          python3 Modules/toolbelt.core.execution-cancel/Tests/Static/validate_contract.py
          python3 Tests/CI/test_w6d_repeat_levels.py
      - name: Execute synthetic contracts
        env:
          TBX_SQL_VERSION: ${{ matrix.sql-version }}
          TBX_SQL_IMAGE: mcr.microsoft.com/mssql/server:${{ matrix.sql-version }}-latest
        run: bash Tests/CI/run-lab-target.sh Tests/CI/run-w6d-execution-cancel-linux.sh
