name: Edit Distance CLR Offline
on:
  pull_request:
    paths:
      - "Modules/toolbelt.string.edit-distance/**"
      - "Documentation/Architecture/EDIT_DISTANCE_CONTRACT.md"
      - "Documentation/Architecture/JARO_WINKLER_CONTRACT.md"
      - ".github/workflows/edit-distance-runtime.yml"

      # Reine Moduldokumentation benötigt keine Runtime-/Buildmatrix.
      - "!Modules/*/Documentation/**"
      - "!Modules/*/README.md"
      - "!Modules/*/CHANGELOG.md"
      - "!Modules/*/Tests/**/*.md"
      - "!Modules/*/Tests/*.md"
  push:
    branches: [main]
    paths:
      - "Modules/toolbelt.string.edit-distance/**"
      - ".github/workflows/edit-distance-runtime.yml"

      # Reine Moduldokumentation benötigt keine Runtime-/Buildmatrix.
      - "!Modules/*/Documentation/**"
      - "!Modules/*/README.md"
      - "!Modules/*/CHANGELOG.md"
      - "!Modules/*/Tests/**/*.md"
      - "!Modules/*/Tests/*.md"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: edit-distance-${{ github.ref }}
  # Laufende Runtimeprüfung erhalten: keine belegte Hard-Interrupt-Bereinigung.
  cancel-in-progress: false
jobs:
  offline:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Static contract
        run: python -B Modules/toolbelt.string.edit-distance/Tests/Static/validate_contract.py
      - name: Framework contract
        shell: pwsh
        run: Modules/toolbelt.string.edit-distance/Tests/Framework/run-framework-distance.ps1
      - name: Exact Release build
        shell: pwsh
        run: Modules/toolbelt.string.edit-distance/Scripts/New-ClrReleaseArtifacts.ps1 -OutputDirectory "$env:RUNNER_TEMP/EditDistanceRelease"
      - name: Genuine 1.0 source and Release build
        shell: pwsh
        run: |
          $legacy = "$env:RUNNER_TEMP/EditDistanceLegacySource"
          Modules/toolbelt.string.edit-distance/Scripts/New-LegacyTestArtifacts.ps1 -OutputDirectory $legacy
          & "$legacy/Scripts/New-ClrReleaseArtifacts.ps1" -OutputDirectory "$env:RUNNER_TEMP/EditDistanceLegacyRelease"
