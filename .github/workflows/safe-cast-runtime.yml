# Current markerless install gates run separately; native lifecycle jobs below retain their original source.
name: Safe Cast Runtime

on:
  pull_request:
    paths:
      - ".github/workflows/safe-cast-runtime.yml"
      - "Modules/toolbelt.conversion.safe-cast/module.yaml"
      - "Modules/toolbelt.conversion.safe-cast/Source/**"
      - "Modules/toolbelt.conversion.safe-cast/Deployment/**"
      - "Modules/toolbelt.conversion.safe-cast/Tests/Runtime/**"
      - "Modules/toolbelt.conversion.safe-cast/Tests/Static/**"
      - "Modules/toolbelt.conversion.safe-cast/Scripts/generate-deployment.py"
      - "Modules/toolbelt.conversion.safe-cast/Tests/CI/**"
      - "Tests/CI/run-safe-cast-linux.sh"
      - "Tests/CI/run-safe-cast-client.ps1"
      - "Tests/CI/SafeCastLifecycle.Helpers.ps1"
      - "Tests/CI/generate-safe-cast-reference.py"
      - "Tests/CI/run-lab-target.sh"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/safe-cast-runtime.yml"
      - "Modules/toolbelt.conversion.safe-cast/module.yaml"
      - "Modules/toolbelt.conversion.safe-cast/Source/**"
      - "Modules/toolbelt.conversion.safe-cast/Deployment/**"
      - "Modules/toolbelt.conversion.safe-cast/Tests/Runtime/**"
      - "Modules/toolbelt.conversion.safe-cast/Tests/Static/**"
      - "Modules/toolbelt.conversion.safe-cast/Scripts/generate-deployment.py"
      - "Modules/toolbelt.conversion.safe-cast/Tests/CI/**"
      - "Tests/CI/run-safe-cast-linux.sh"
      - "Tests/CI/run-safe-cast-client.ps1"
      - "Tests/CI/SafeCastLifecycle.Helpers.ps1"
      - "Tests/CI/generate-safe-cast-reference.py"
      - "Tests/CI/run-lab-target.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safe-cast-runtime-${{ github.ref }}
  # Laufende Runtimeprüfung erhalten: ein EXIT-Trap belegt kein Hard-Interrupt-Cleanup.
  cancel-in-progress: false

jobs:
  current-component-contract:
    name: Current component equivalence and original lifecycle assertions
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject business drift before reusing original assertions
        run: |
          python -B Modules/toolbelt.conversion.safe-cast/Tests/Static/validate_contract.py
  runtime:
    # Retired SQLCMD/marker lifecycle: explicit historical dispatch only.
    if: github.event_name == 'workflow_dispatch'
    name: SQL Server ${{ matrix.sql-version }} Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sql-version: ["2019", "2022", "2025"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && '2fbe8e3e86f370b22ad2ce9f9716d971072a052b' || github.sha }}

      - name: Validate static contract
        run: python3 Modules/toolbelt.conversion.safe-cast/Tests/Static/validate_contract.py

      - name: Execute synthetic API, client and 38 canonical lifecycle cases per CL
        env:
          TBX_SQL_VERSION: ${{ matrix.sql-version }}
          TBX_SQL_IMAGE: mcr.microsoft.com/mssql/server:${{ matrix.sql-version }}-latest
        run: bash Tests/CI/run-lab-target.sh Tests/CI/run-safe-cast-linux.sh
