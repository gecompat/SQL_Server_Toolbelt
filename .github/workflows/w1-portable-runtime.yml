# Current markerless install gates run separately; native lifecycle jobs below retain their original source.
name: W1 Portable Runtime

on:
  pull_request:
    paths:
      - "Tests/CI/run-lab-target.sh"
      - "Modules/toolbelt.core.generate-series/Source/**"
      - "Modules/toolbelt.core.generate-series/Deployment/**"
      - "Modules/toolbelt.core.generate-series/module.yaml"
      - "Modules/toolbelt.datetime.calendar-difference/Source/**"
      - "Modules/toolbelt.datetime.calendar-difference/Deployment/**"
      - "Modules/toolbelt.datetime.calendar-difference/Tests/Runtime/**"
      - "Modules/toolbelt.datetime.calendar-difference/Tests/Static/**"
      - "Modules/toolbelt.datetime.calendar-difference/module.yaml"
      - "Modules/toolbelt.string.directional-trim/Source/**"
      - "Modules/toolbelt.string.directional-trim/Deployment/**"
      - "Modules/toolbelt.string.directional-trim/Tests/Runtime/**"
      - "Modules/toolbelt.string.directional-trim/Tests/Static/**"
      - "Modules/toolbelt.string.directional-trim/module.yaml"
      - "Modules/toolbelt.conversion.uri-component/Source/**"
      - "Modules/toolbelt.conversion.uri-component/Deployment/**"
      - "Modules/toolbelt.conversion.uri-component/Tests/Runtime/**"
      - "Modules/toolbelt.conversion.uri-component/Tests/Static/**"
      - "Modules/toolbelt.conversion.uri-component/module.yaml"
      - "Tests/CI/run-w1-linux.sh"
      - ".github/workflows/w1-portable-runtime.yml"
  push:
    branches: [main]
    paths:
      - "Tests/CI/run-lab-target.sh"
      - "Modules/toolbelt.core.generate-series/Source/**"
      - "Modules/toolbelt.core.generate-series/Deployment/**"
      - "Modules/toolbelt.core.generate-series/module.yaml"
      - "Modules/toolbelt.datetime.calendar-difference/Source/**"
      - "Modules/toolbelt.datetime.calendar-difference/Deployment/**"
      - "Modules/toolbelt.datetime.calendar-difference/Tests/Runtime/**"
      - "Modules/toolbelt.datetime.calendar-difference/Tests/Static/**"
      - "Modules/toolbelt.datetime.calendar-difference/module.yaml"
      - "Modules/toolbelt.string.directional-trim/Source/**"
      - "Modules/toolbelt.string.directional-trim/Deployment/**"
      - "Modules/toolbelt.string.directional-trim/Tests/Runtime/**"
      - "Modules/toolbelt.string.directional-trim/Tests/Static/**"
      - "Modules/toolbelt.string.directional-trim/module.yaml"
      - "Modules/toolbelt.conversion.uri-component/Source/**"
      - "Modules/toolbelt.conversion.uri-component/Deployment/**"
      - "Modules/toolbelt.conversion.uri-component/Tests/Runtime/**"
      - "Modules/toolbelt.conversion.uri-component/Tests/Static/**"
      - "Modules/toolbelt.conversion.uri-component/module.yaml"
      - "Tests/CI/run-w1-linux.sh"
      - ".github/workflows/w1-portable-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-component-contract:
    name: Current component equivalence and original lifecycle assertions
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject business drift before reusing original assertions
        run: |
          python -B Modules/toolbelt.conversion.uri-component/Tests/Static/validate_contract.py
          python -B Modules/toolbelt.core.generate-series/Tests/Static/validate_contract.py
          python -B Modules/toolbelt.datetime.calendar-difference/Tests/Static/validate_contract.py
          python -B Modules/toolbelt.string.directional-trim/Tests/Static/validate_contract.py
  runtime:
    # Retired SQLCMD/marker lifecycle: explicit historical dispatch only.
    if: github.event_name == 'workflow_dispatch'
    name: SQL Server ${{ matrix.sql-version }} Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sql-version: ["2019", "2022", "2025"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && '2fbe8e3e86f370b22ad2ce9f9716d971072a052b' || github.sha }}
      - run: python3 Modules/toolbelt.datetime.calendar-difference/Tests/Static/validate_contract.py
      - run: python3 Modules/toolbelt.string.directional-trim/Tests/Static/validate_contract.py
      - run: python3 Modules/toolbelt.conversion.uri-component/Tests/Static/validate_contract.py
      - env:
          TBX_SQL_VERSION: ${{ matrix.sql-version }}
          TBX_SQL_IMAGE: mcr.microsoft.com/mssql/server:${{ matrix.sql-version }}-latest
        run: bash Tests/CI/run-lab-target.sh Tests/CI/run-w1-linux.sh
