name: W1 Portable Runtime

on:
  pull_request:
    paths:
      - "Modules/toolbelt.datetime.calendar-difference/**"
      - "Modules/toolbelt.string.directional-trim/**"
      - "Modules/toolbelt.conversion.uri-component/**"
      - "Tests/CI/run-w1-linux.sh"
      - ".github/workflows/w1-portable-runtime.yml"
  push:
    branches: [main]
    paths:
      - "Modules/toolbelt.datetime.calendar-difference/**"
      - "Modules/toolbelt.string.directional-trim/**"
      - "Modules/toolbelt.conversion.uri-component/**"
      - "Tests/CI/run-w1-linux.sh"
      - ".github/workflows/w1-portable-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sql-server-2025-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 Modules/toolbelt.datetime.calendar-difference/Tests/Static/validate_contract.py
      - run: python3 Modules/toolbelt.string.directional-trim/Tests/Static/validate_contract.py
      - run: python3 Modules/toolbelt.conversion.uri-component/Tests/Static/validate_contract.py
      - env:
          TBX_SQL_IMAGE: mcr.microsoft.com/mssql/server:2025-latest
        run: bash Tests/CI/run-w1-linux.sh
