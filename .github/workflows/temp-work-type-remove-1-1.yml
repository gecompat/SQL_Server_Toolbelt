name: Temporary Work Type Remove 1.1

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/temp-work-type-remove-1-1.yml
      - Tests/Documentation/patch_work_type_remove_1_1.py
      - Modules/toolbelt.core.work-type/**
      - Tests/CI/run-w4b-work-type-linux.sh

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      EVIDENCE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      TBX_SQL_IMAGE: mcr.microsoft.com/mssql/server:2025-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Couple documentation
        run: python3 Tests/Documentation/patch_work_type_remove_1_1.py
      - name: Validate static contract
        run: python3 Modules/toolbelt.core.work-type/Tests/Static/validate_contract.py
      - name: Execute SQL Server 2025 compatibility matrix
        run: bash Tests/CI/run-w4b-work-type-linux.sh
      - name: Generate and validate repository status
        run: |
          python3 Tests/Documentation/validate_documentation.py --all --write
          python3 Tests/Documentation/validate_documentation.py --all
      - name: Commit consistent Work Type 1.1 state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- \
            .github/workflows/temp-work-type-remove-1-1.yml \
            Tests/Documentation/patch_work_type_remove_1_1.py
          if git diff --cached --quiet; then
            echo "Keine dauerhaften Änderungen zu committen."
            exit 0
          fi
          git commit -m "ChatGPT [LLM: GPT-5.6 Thinking]: Validiere Work-Type-Removal 1.1.0"
          git push origin HEAD:${{ github.head_ref }}
