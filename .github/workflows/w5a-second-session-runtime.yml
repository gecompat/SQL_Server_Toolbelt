name: W5a Second Session Runtime

on:
  pull_request:
    branches:
      - main
    paths:
      - Modules/toolbelt.core.second-session/**
      - Tests/CI/run-w5a-second-session-linux.sh
      - .github/workflows/w5a-second-session-runtime.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: Static contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate Second Session
        run: python3 Modules/toolbelt.core.second-session/Tests/Static/validate_contract.py

  runtime:
    name: SQL Server ${{ matrix.sql-version }} Linux
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        sql-version: ["2019", "2022", "2025"]
    steps:
      - uses: actions/checkout@v4
      - name: Execute Second Session contracts
        env:
          TBX_SQL_VERSION: ${{ matrix.sql-version }}
          TBX_SQL_IMAGE: mcr.microsoft.com/mssql/server:${{ matrix.sql-version }}-latest
        run: bash Tests/CI/run-lab-target.sh Tests/CI/run-w5a-second-session-linux.sh
