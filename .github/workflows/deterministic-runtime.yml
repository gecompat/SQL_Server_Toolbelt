# Current markerless install gates run separately; native lifecycle jobs below retain their original source.
name: Deterministic Mapping Runtime

on:
  pull_request:
    paths:
      - "Modules/toolbelt.core.result-table/Source/**"
      - "Modules/toolbelt.core.result-table/Deployment/**"
      - "Modules/toolbelt.core.result-table/module.yaml"
      - "Tests/CI/Set-SqlClientTlsPolicy.ps1"
      - ".github/workflows/deterministic-runtime.yml"
      - "Modules/toolbelt.pseudonymization.deterministic/module.yaml"
      - "Modules/toolbelt.pseudonymization.deterministic/Source/**"
      - "Modules/toolbelt.pseudonymization.deterministic/Deployment/**"
      - "Modules/toolbelt.pseudonymization.deterministic/Tests/Runtime/**"
      - "Modules/toolbelt.pseudonymization.deterministic/Tests/Static/**"
      - "Tests/CI/run-deterministic-linux.sh"
      - "Tests/CI/run-deterministic-translate-lab.ps1"
      - "Tests/CI/run-deterministic-geo-lab.ps1"
  push:
    branches: [main]
    paths:
      - "Modules/toolbelt.core.result-table/Source/**"
      - "Modules/toolbelt.core.result-table/Deployment/**"
      - "Modules/toolbelt.core.result-table/module.yaml"
      - "Tests/CI/Set-SqlClientTlsPolicy.ps1"
      - ".github/workflows/deterministic-runtime.yml"
      - "Modules/toolbelt.pseudonymization.deterministic/module.yaml"
      - "Modules/toolbelt.pseudonymization.deterministic/Source/**"
      - "Modules/toolbelt.pseudonymization.deterministic/Deployment/**"
      - "Modules/toolbelt.pseudonymization.deterministic/Tests/Runtime/**"
      - "Modules/toolbelt.pseudonymization.deterministic/Tests/Static/**"
      - "Tests/CI/run-deterministic-linux.sh"
      - "Tests/CI/run-deterministic-translate-lab.ps1"
      - "Tests/CI/run-deterministic-geo-lab.ps1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deterministic-runtime-${{ github.ref }}
  # Laufende Runtimeprüfung erhalten: keine belegte Hard-Interrupt-Bereinigung.
  cancel-in-progress: false

jobs:
  current-component-contract:
    name: Current component equivalence and original lifecycle assertions
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject business drift before reusing original assertions
        run: |
          python -B Modules/toolbelt.core.result-table/Tests/Static/validate_contract.py
          python -B Modules/toolbelt.pseudonymization.deterministic/Tests/Static/validate_contract.py
  runtime:
    # Retired SQLCMD/marker lifecycle: explicit historical dispatch only.
    if: github.event_name == 'workflow_dispatch'
    name: SQL Server ${{ matrix.sql-version }} Linux CL${{ matrix.compatibility-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {sql-version: "2019", compatibility-level: "150"}
          - {sql-version: "2022", compatibility-level: "150"}
          - {sql-version: "2022", compatibility-level: "160"}
          - {sql-version: "2025", compatibility-level: "150"}
          - {sql-version: "2025", compatibility-level: "160"}
          - {sql-version: "2025", compatibility-level: "170"}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && '2fbe8e3e86f370b22ad2ce9f9716d971072a052b' || github.sha }}
          fetch-depth: 0
      - name: Statische deterministische Verträge prüfen
        run: python3 Modules/toolbelt.pseudonymization.deterministic/Tests/Static/validate_contract.py
      - name: Echte unveränderte 1.0-Upgradequellen paketieren
        shell: pwsh
        run: ./Modules/toolbelt.pseudonymization.deterministic/Deployment/New-LegacyTestArtifacts.ps1 -OutputDirectory .runtime/deterministic-legacy
      - name: Echte unveränderte 1.1-Upgradequellen paketieren
        shell: pwsh
        run: ./Modules/toolbelt.pseudonymization.deterministic/Deployment/New-LegacyTestArtifacts.ps1 -Version 1.1.0 -OutputDirectory .runtime/deterministic-legacy11
      - name: Synthetische API-, Ressourcen- und Lifecycle-Verträge prüfen
        env:
          TBX_SQL_VERSION: ${{ matrix.sql-version }}
          TBX_SQL_COMPATIBILITY_LEVEL: ${{ matrix.compatibility-level }}
          TBX_SQL_IMAGE: mcr.microsoft.com/mssql/server:${{ matrix.sql-version }}-latest
        run: bash Tests/CI/run-deterministic-linux.sh
