name: W2a Portable Runtime

on:
  pull_request:
    paths:
      - "Modules/toolbelt.datetime.truncate/Source/**"
      - "Modules/toolbelt.datetime.truncate/Deployment/**"
      - "Modules/toolbelt.datetime.truncate/Tests/Runtime/**"
      - "Modules/toolbelt.datetime.truncate/Tests/Static/**"
      - "Modules/toolbelt.datetime.truncate/module.yaml"
      - "Modules/toolbelt.datetime.bucket/Source/**"
      - "Modules/toolbelt.datetime.bucket/Deployment/**"
      - "Modules/toolbelt.datetime.bucket/Tests/Runtime/**"
      - "Modules/toolbelt.datetime.bucket/Tests/Static/**"
      - "Modules/toolbelt.datetime.bucket/module.yaml"
      - "Modules/toolbelt.binary.bit-operations/Source/**"
      - "Modules/toolbelt.binary.bit-operations/Deployment/**"
      - "Modules/toolbelt.binary.bit-operations/Tests/Runtime/**"
      - "Modules/toolbelt.binary.bit-operations/Tests/Static/**"
      - "Modules/toolbelt.binary.bit-operations/module.yaml"
      - "Tests/CI/run-w2a-linux.sh"
      - ".github/workflows/w2a-portable-runtime.yml"
  push:
    branches: [main]
    paths:
      - "Modules/toolbelt.datetime.truncate/Source/**"
      - "Modules/toolbelt.datetime.truncate/Deployment/**"
      - "Modules/toolbelt.datetime.truncate/Tests/Runtime/**"
      - "Modules/toolbelt.datetime.truncate/Tests/Static/**"
      - "Modules/toolbelt.datetime.truncate/module.yaml"
      - "Modules/toolbelt.datetime.bucket/Source/**"
      - "Modules/toolbelt.datetime.bucket/Deployment/**"
      - "Modules/toolbelt.datetime.bucket/Tests/Runtime/**"
      - "Modules/toolbelt.datetime.bucket/Tests/Static/**"
      - "Modules/toolbelt.datetime.bucket/module.yaml"
      - "Modules/toolbelt.binary.bit-operations/Source/**"
      - "Modules/toolbelt.binary.bit-operations/Deployment/**"
      - "Modules/toolbelt.binary.bit-operations/Tests/Runtime/**"
      - "Modules/toolbelt.binary.bit-operations/Tests/Static/**"
      - "Modules/toolbelt.binary.bit-operations/module.yaml"
      - "Tests/CI/run-w2a-linux.sh"
      - ".github/workflows/w2a-portable-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    name: SQL Server ${{ matrix.sql-version }} Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sql-version: ["2019", "2022", "2025"]
    steps:
      - uses: actions/checkout@v4
      - run: >-
          python3
          Modules/toolbelt.datetime.truncate/Tests/Static/validate_contract.py
      - run: >-
          python3
          Modules/toolbelt.datetime.bucket/Tests/Static/validate_contract.py
      - run: >-
          python3
          Modules/toolbelt.binary.bit-operations/Tests/Static/validate_contract.py
      - env:
          TBX_SQL_VERSION: ${{ matrix.sql-version }}
          TBX_SQL_IMAGE: mcr.microsoft.com/mssql/server:${{ matrix.sql-version }}-latest
        run: bash Tests/CI/run-lab-target.sh Tests/CI/run-w2a-linux.sh
