# Current markerless install gates run separately; native lifecycle jobs below retain their original source.
name: ResultTable Runtime

on:
  pull_request:
    paths:
      - "Tests/CI/run-lab-target.sh"
      - ".github/workflows/result-table-runtime.yml"
      - "Modules/toolbelt.core.result-table/module.yaml"
      - "Modules/toolbelt.core.result-table/Source/**"
      - "Modules/toolbelt.core.result-table/Deployment/**"
      - "Modules/toolbelt.core.result-table/Tests/Runtime/**"
      - "Tests/CI/run-result-table-linux.sh"
  push:
    branches:
      - main
    paths:
      - "Tests/CI/run-lab-target.sh"
      - ".github/workflows/result-table-runtime.yml"
      - "Modules/toolbelt.core.result-table/module.yaml"
      - "Modules/toolbelt.core.result-table/Source/**"
      - "Modules/toolbelt.core.result-table/Deployment/**"
      - "Modules/toolbelt.core.result-table/Tests/Runtime/**"
      - "Tests/CI/run-result-table-linux.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: result-table-runtime-${{ github.ref }}
  # Laufende Runtimeprüfung erhalten: keine belegte Hard-Interrupt-Bereinigung.
  cancel-in-progress: false

jobs:
  static-contract:
    name: Static contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && '2fbe8e3e86f370b22ad2ce9f9716d971072a052b' || github.sha }}

      - name: Validate static contract
        run: python3 Modules/toolbelt.core.result-table/Tests/Static/validate_contract.py

  sql-server-linux:
    # Retired SQLCMD/marker lifecycle: explicit historical dispatch only.
    if: github.event_name == 'workflow_dispatch'
    name: SQL Server ${{ matrix.version }} Linux
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "2019"
            image: "mcr.microsoft.com/mssql/server:2019-latest"
            suite: "full"
          - version: "2022"
            image: "mcr.microsoft.com/mssql/server:2022-latest"
            suite: "full"
          - version: "2025"
            image: "mcr.microsoft.com/mssql/server:2025-latest"
            suite: "full"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && '2fbe8e3e86f370b22ad2ce9f9716d971072a052b' || github.sha }}

      - name: Execute synthetic SQL Server tests
        env:
          TBX_SQL_IMAGE: ${{ matrix.image }}
          TBX_TEST_SUITE: ${{ matrix.suite }}
          TBX_SQL_VERSION: ${{ matrix.version }}
        run: bash Tests/CI/run-lab-target.sh Tests/CI/run-result-table-linux.sh
