name: Documentation Consistency

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-consistency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  change-impact:
    name: Incremental change impact
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate affected documentation packages
        if: github.event_name != 'workflow_dispatch'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python3 Tests/Documentation/validate_documentation.py
          --base "$BASE_SHA"
          --head "$HEAD_SHA"

      - name: Validate complete baseline
        if: github.event_name == 'workflow_dispatch'
        run: python3 Tests/Documentation/validate_documentation.py --all

      - name: Test standalone SQL export without SQL access
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $runScope = $env:EVENT_NAME -eq 'workflow_dispatch'
          if (-not $runScope) {
            git diff --quiet $env:BASE_SHA $env:HEAD_SHA -- Deployment/ 'Modules/*/Deployment/**' 'Modules/*/Source/**' 'Modules/*/module.yaml' .github/workflows/documentation-consistency.yml
            $scopeResult = $LASTEXITCODE
            if ($scopeResult -notin 0,1) { throw 'DOCUMENTATION_SCOPE_DIFF_FAILED' }
            $LASTEXITCODE = 0
            $runScope = $scopeResult -eq 1
          }
          if ($runScope) {
            ./Deployment/Tests/Test-SqlExport.ps1
          }

      - name: Validate ZIP file facade source contract
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          run_scope=false
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            run_scope=true
          elif git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- Modules/toolbelt.archive.zip-files/ Documentation/Architecture/ZIP_FILES_CONTRACT.md Documentation/Standards/SQL_OBJECT_NAMING.md Documentation/Standards/USP_CONTRACT.md .github/workflows/documentation-consistency.yml; then
            :
          else
            scope_result=$?
            if [ "$scope_result" -ne 1 ]; then
              echo "DOCUMENTATION_SCOPE_DIFF_FAILED" >&2
              exit "$scope_result"
            fi
            run_scope=true
          fi
          if [ "$run_scope" = true ]; then
            python3 Modules/toolbelt.archive.zip-files/Tests/Static/validate_contract.py
          fi

      # SafeCast/JSON Pointer laufen bereits im Change-Impact-Validator.
      - name: Test owned module CI cleanup with synthetic Docker responses
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          run_scope=false
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            run_scope=true
          elif git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- Tests/CI/test_owned_container_cleanup.py Tests/CI/run-json-pointer-linux.sh Tests/CI/run-safe-cast-linux.sh Tests/CI/run-json-constructors-linux.sh Tests/CI/run-table-clone-linux.sh Tests/CI/run-deterministic-linux.sh Tests/CI/run-regex-linux.sh Tests/CI/run-result-table-linux.sh Tests/CI/run-w4a-execution-foundations-linux.sh Tests/CI/run-work-queue-linux.sh Tests/CI/run-w4b-work-type-linux.sh Tests/CI/run-w5a-second-session-linux.sh Tests/CI/run-w5b-event-log-linux.sh Tests/CI/run-w6d-execution-cancel-linux.sh Tests/CI/run-w2c-linux.sh Tests/CI/run-w2b-json-path-linux.sh Tests/CI/run-w2a-linux.sh Tests/CI/run-w1-linux.sh Tests/CI/run-integer-base-linux.sh Tests/CI/run-identifier-linux.sh Tests/CI/run-split-characters-linux.sh Tests/CI/run-semantic-version-linux.sh Tests/CI/run-base64-linux.sh Tests/CI/run-generate-series-linux.sh Tests/CI/run-date-spine-linux.sh .github/workflows/documentation-consistency.yml; then
            :
          else
            scope_result=$?
            if [ "$scope_result" -ne 1 ]; then
              echo "DOCUMENTATION_SCOPE_DIFF_FAILED" >&2
              exit "$scope_result"
            fi
            run_scope=true
          fi
          if [ "$run_scope" = true ]; then
            python3 Tests/CI/test_owned_container_cleanup.py
          fi

      - name: Test disposable ZIP spike cleanup without Docker
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          run_scope=false
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            run_scope=true
          else
            scope_result=0
            git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- Tests/CI/test_zip_spike_cleanup.py .github/workflows/sql-clr-zip-spike.yml .github/workflows/documentation-consistency.yml || scope_result=$?
            if [ "$scope_result" -eq 1 ]; then run_scope=true; elif [ "$scope_result" -ne 0 ]; then exit "$scope_result"; fi
          fi
          if [ "$run_scope" = true ]; then python3 Tests/CI/test_zip_spike_cleanup.py; fi

      - name: Test manual Pointer cleanup without Docker
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          run_scope=false
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            run_scope=true
          else
            scope_result=0
            git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- Tests/CI/test_pointer_probe_cleanup.py Modules/toolbelt.json.pointer/Tests/CI/run_max_workload.py Modules/toolbelt.json.pointer/Tests/CI/test_hard_interrupt_recovery.py .github/workflows/documentation-consistency.yml || scope_result=$?
            if [ "$scope_result" -eq 1 ]; then run_scope=true; elif [ "$scope_result" -ne 0 ]; then exit "$scope_result"; fi
          fi
          if [ "$run_scope" = true ]; then python3 Tests/CI/test_pointer_probe_cleanup.py; fi

      - name: Test strict Lab driver arguments without Lab access
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $runScope = $env:EVENT_NAME -eq 'workflow_dispatch'
          if (-not $runScope) {
            git diff --quiet $env:BASE_SHA $env:HEAD_SHA -- Tests/CI/run-safe-cast-lab.ps1 Tests/CI/run-json-pointer-lab.ps1 Tests/CI/Test-LabDriverArgumentCase.ps1 .github/workflows/documentation-consistency.yml
            $scopeResult = $LASTEXITCODE
            if ($scopeResult -notin 0,1) { throw 'DOCUMENTATION_SCOPE_DIFF_FAILED' }
            $LASTEXITCODE = 0
            $runScope = $scopeResult -eq 1
          }
          if ($runScope) {
            ./Tests/CI/Test-LabDriverArgumentCase.ps1
          }

      - name: Test synthetic Lab target selection
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          run_scope=false
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            run_scope=true
          elif git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- Tests/CI/run-lab-local.ps1 Tests/CI/test-lab-selector.ps1 Tests/CI/validate_lab_selector.py Tests/CI/run-lab-target.sh Tests/CI/test_lab_tls.py Tests/CI/test_lab_cleanup.py Tests/CI/Set-SqlClientTlsPolicy.ps1 Tests/CI/LabQualifiedContract.ps1 Tests/CI/Assert-LabQualifiedTlsBinding.ps1 Tests/CI/test-lab-qualified-contract.ps1 Tests/CI/run-authenticated-tls-lab.sh .github/workflows/documentation-consistency.yml; then
            :
          else
            scope_result=$?
            if [ "$scope_result" -ne 1 ]; then
              echo "DOCUMENTATION_SCOPE_DIFF_FAILED" >&2
              exit "$scope_result"
            fi
            run_scope=true
          fi
          if [ "$run_scope" = true ]; then
            python3 Tests/CI/validate_lab_selector.py
          fi

  qualified-consumer-windows:
    name: Qualified Lab consumer Windows fixture
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select affected Windows consumer fixture
        id: scope
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $runScope = $env:EVENT_NAME -eq 'workflow_dispatch'
          if (-not $runScope) {
            git diff --quiet $env:BASE_SHA $env:HEAD_SHA -- Tests/CI/run-lab-local.ps1 Tests/CI/LabQualifiedContract.ps1 Tests/CI/Assert-LabQualifiedTlsBinding.ps1 Tests/CI/test-lab-qualified-contract.ps1 Tests/CI/Set-SqlClientTlsPolicy.ps1 .github/workflows/documentation-consistency.yml
            $scopeResult = $LASTEXITCODE
            if ($scopeResult -notin 0,1) { throw 'QUALIFIED_CONSUMER_SCOPE_DIFF_FAILED' }
            $LASTEXITCODE = 0
            $runScope = $scopeResult -eq 1
          }
          "run=$($runScope.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Test private Windows bytes and ACL boundaries without SQL
        if: steps.scope.outputs.run == 'true'
        shell: pwsh
        run: |
          if ($PSVersionTable.PSVersion -lt [version]'7.5') { throw 'QUALIFIED_CONSUMER_PWSH75_REQUIRED' }
          ./Tests/CI/test-lab-qualified-contract.ps1
