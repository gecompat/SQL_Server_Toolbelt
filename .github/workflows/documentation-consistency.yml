name: Documentation Consistency

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-consistency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  change-impact:
    name: Incremental change impact
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate affected documentation packages
        if: github.event_name != 'workflow_dispatch'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python3 Tests/Documentation/validate_documentation.py
          --base "$BASE_SHA"
          --head "$HEAD_SHA"

      - name: Validate complete baseline
        if: github.event_name == 'workflow_dispatch'
        run: python3 Tests/Documentation/validate_documentation.py --all

      - name: Validate ZIP file facade source contract
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ] || git diff --name-only "$BASE_SHA" "$HEAD_SHA" | rg '^(Modules/toolbelt\.archive\.zip-files/|Documentation/Architecture/ZIP_FILES_CONTRACT\.md$|Documentation/Standards/(SQL_OBJECT_NAMING|USP_CONTRACT)\.md$|\.github/workflows/documentation-consistency\.yml$)' > /dev/null; then
            python3 Modules/toolbelt.archive.zip-files/Tests/Static/validate_contract.py
          fi

      - name: Validate Safe Cast source contract
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ] || git diff --name-only "$BASE_SHA" "$HEAD_SHA" | rg '^(Modules/toolbelt\.conversion\.safe-cast/|\.github/workflows/documentation-consistency\.yml$)' > /dev/null; then
            python3 Modules/toolbelt.conversion.safe-cast/Tests/Static/validate_contract.py
          fi

      - name: Validate JSON Pointer source contract
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ] || git diff --name-only "$BASE_SHA" "$HEAD_SHA" | rg '^(Modules/toolbelt\.json\.pointer/|\.github/workflows/documentation-consistency\.yml$)' > /dev/null; then
            python3 Modules/toolbelt.json.pointer/Tests/Static/validate_contract.py
          fi

      - name: Test owned module CI cleanup with synthetic Docker responses
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ] || git diff --name-only "$BASE_SHA" "$HEAD_SHA" | rg '^(Tests/CI/(test_owned_container_cleanup\.py|run-json-pointer-linux\.sh|run-safe-cast-linux\.sh|run-json-constructors-linux\.sh|run-table-clone-linux\.sh)|\.github/workflows/documentation-consistency\.yml)$' > /dev/null; then
            python3 Tests/CI/test_owned_container_cleanup.py
          fi

      - name: Test strict Lab driver arguments without Lab access
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $changed = @(git diff --name-only $env:BASE_SHA $env:HEAD_SHA)
          if ($env:EVENT_NAME -eq 'workflow_dispatch' -or @($changed | Where-Object { $_ -match '^(Tests/CI/(run-safe-cast-lab|run-json-pointer-lab|Test-LabDriverArgumentCase)\.ps1$|\.github/workflows/documentation-consistency\.yml$)' }).Count -gt 0) {
            ./Tests/CI/Test-LabDriverArgumentCase.ps1
          }

      - name: Test synthetic Lab target selection
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ] || git diff --name-only "$BASE_SHA" "$HEAD_SHA" | rg '^(Tests/CI/(run-lab-local\.ps1|test-lab-selector\.ps1|validate_lab_selector\.py)|\.github/workflows/documentation-consistency\.yml)$' > /dev/null; then
            python3 Tests/CI/validate_lab_selector.py
          fi
