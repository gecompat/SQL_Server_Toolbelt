name: Documentation Consistency

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-consistency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  change-impact:
    name: Incremental change impact
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate affected documentation packages
        if: github.event_name != 'workflow_dispatch'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python3 Tests/Documentation/validate_documentation.py
          --base "$BASE_SHA"
          --head "$HEAD_SHA"

      - name: Validate complete baseline
        if: github.event_name == 'workflow_dispatch'
        run: python3 Tests/Documentation/validate_documentation.py --all

      - name: Validate ZIP file facade source contract
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          run_scope=false
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            run_scope=true
          elif git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- Modules/toolbelt.archive.zip-files/ Documentation/Architecture/ZIP_FILES_CONTRACT.md Documentation/Standards/SQL_OBJECT_NAMING.md Documentation/Standards/USP_CONTRACT.md .github/workflows/documentation-consistency.yml; then
            :
          else
            scope_result=$?
            if [ "$scope_result" -ne 1 ]; then
              echo "DOCUMENTATION_SCOPE_DIFF_FAILED" >&2
              exit "$scope_result"
            fi
            run_scope=true
          fi
          if [ "$run_scope" = true ]; then
            python3 Modules/toolbelt.archive.zip-files/Tests/Static/validate_contract.py
          fi

      - name: Validate Safe Cast source contract
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          run_scope=false
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            run_scope=true
          elif git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- Modules/toolbelt.conversion.safe-cast/ .github/workflows/documentation-consistency.yml; then
            :
          else
            scope_result=$?
            if [ "$scope_result" -ne 1 ]; then
              echo "DOCUMENTATION_SCOPE_DIFF_FAILED" >&2
              exit "$scope_result"
            fi
            run_scope=true
          fi
          if [ "$run_scope" = true ]; then
            python3 Modules/toolbelt.conversion.safe-cast/Tests/Static/validate_contract.py
          fi

      - name: Validate JSON Pointer source contract
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          run_scope=false
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            run_scope=true
          elif git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- Modules/toolbelt.json.pointer/ .github/workflows/documentation-consistency.yml; then
            :
          else
            scope_result=$?
            if [ "$scope_result" -ne 1 ]; then
              echo "DOCUMENTATION_SCOPE_DIFF_FAILED" >&2
              exit "$scope_result"
            fi
            run_scope=true
          fi
          if [ "$run_scope" = true ]; then
            python3 Modules/toolbelt.json.pointer/Tests/Static/validate_contract.py
          fi

      - name: Test owned module CI cleanup with synthetic Docker responses
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          run_scope=false
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            run_scope=true
          elif git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- Tests/CI/test_owned_container_cleanup.py Tests/CI/run-json-pointer-linux.sh Tests/CI/run-safe-cast-linux.sh Tests/CI/run-json-constructors-linux.sh Tests/CI/run-table-clone-linux.sh Tests/CI/run-deterministic-linux.sh Tests/CI/run-regex-linux.sh Tests/CI/run-result-table-linux.sh Tests/CI/run-w4a-execution-foundations-linux.sh Tests/CI/run-work-queue-linux.sh Tests/CI/run-w4b-work-type-linux.sh Tests/CI/run-w5a-second-session-linux.sh Tests/CI/run-w5b-event-log-linux.sh Tests/CI/run-w6d-execution-cancel-linux.sh Tests/CI/run-w2c-linux.sh Tests/CI/run-w2b-json-path-linux.sh Tests/CI/run-w2a-linux.sh Tests/CI/run-w1-linux.sh Tests/CI/run-integer-base-linux.sh .github/workflows/documentation-consistency.yml; then
            :
          else
            scope_result=$?
            if [ "$scope_result" -ne 1 ]; then
              echo "DOCUMENTATION_SCOPE_DIFF_FAILED" >&2
              exit "$scope_result"
            fi
            run_scope=true
          fi
          if [ "$run_scope" = true ]; then
            python3 Tests/CI/test_owned_container_cleanup.py
          fi

      - name: Test strict Lab driver arguments without Lab access
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $runScope = $env:EVENT_NAME -eq 'workflow_dispatch'
          if (-not $runScope) {
            git diff --quiet $env:BASE_SHA $env:HEAD_SHA -- Tests/CI/run-safe-cast-lab.ps1 Tests/CI/run-json-pointer-lab.ps1 Tests/CI/Test-LabDriverArgumentCase.ps1 .github/workflows/documentation-consistency.yml
            $scopeResult = $LASTEXITCODE
            if ($scopeResult -notin 0,1) { throw 'DOCUMENTATION_SCOPE_DIFF_FAILED' }
            $LASTEXITCODE = 0
            $runScope = $scopeResult -eq 1
          }
          if ($runScope) {
            ./Tests/CI/Test-LabDriverArgumentCase.ps1
          }

      - name: Test synthetic Lab target selection
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          run_scope=false
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            run_scope=true
          elif git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- Tests/CI/run-lab-local.ps1 Tests/CI/test-lab-selector.ps1 Tests/CI/validate_lab_selector.py .github/workflows/documentation-consistency.yml; then
            :
          else
            scope_result=$?
            if [ "$scope_result" -ne 1 ]; then
              echo "DOCUMENTATION_SCOPE_DIFF_FAILED" >&2
              exit "$scope_result"
            fi
            run_scope=true
          fi
          if [ "$run_scope" = true ]; then
            python3 Tests/CI/validate_lab_selector.py
          fi
