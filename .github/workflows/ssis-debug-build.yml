name: SSIS Debug offline contracts

on:
  pull_request:
    paths:
      - 'Modules/toolbelt.tsql.ssis-debug/**'
      - 'Modules/toolbelt.tsql.script-parser/**'
      - '.github/workflows/ssis-debug-build.yml'
      - '!Modules/*/Documentation/**/*.md'
      - '!Modules/*/README.md'
      - '!Modules/*/CHANGELOG.md'
      - '!Modules/*/Tests/**/*.md'
      - '!Modules/*/Tests/*.md'
  push:
    branches: [main]
    paths:
      - 'Modules/toolbelt.tsql.ssis-debug/**'
      - 'Modules/toolbelt.tsql.script-parser/**'
      - '.github/workflows/ssis-debug-build.yml'
      - '!Modules/*/Documentation/**/*.md'
      - '!Modules/*/README.md'
      - '!Modules/*/CHANGELOG.md'
      - '!Modules/*/Tests/**/*.md'
      - '!Modules/*/Tests/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ssis-debug-offline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-contract:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Obtain exact ScriptDom input
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'ssis-scriptdom-180.117.0'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $archive = Join-Path $root 'package.zip'
          Invoke-WebRequest -Uri 'https://api.nuget.org/v3-flatcontainer/microsoft.sqlserver.transactsql.scriptdom/180.117.0/microsoft.sqlserver.transactsql.scriptdom.180.117.0.nupkg' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath (Join-Path $root 'package')
          $expected = '459E137268A4CA378023CD7E68A04655CEC2C19A8D01546E81B1A7ABF1FE2F9226A03CC3FA2323081C3C1B05626AF988C98527711D577919CF409367F853DAC7'
          $dom = Get-ChildItem (Join-Path $root 'package/lib') -Recurse -Filter Microsoft.SqlServer.TransactSql.ScriptDom.dll |
            Where-Object { (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA512).Hash -ceq $expected } | Select-Object -First 1
          if (-not $dom) { throw 'SSIS_CI_SCRIPT_DOM_PIN_MISMATCH' }
          "SSIS_SCRIPT_DOM_PATH=$($dom.FullName)" >> $env:GITHUB_ENV
      - name: Static contract and canonical generation
        run: python Modules/toolbelt.tsql.ssis-debug/Tests/Static/validate_contract.py
      - name: Versioned ZIP integrity, exact build sources and tampering controls without SQL
        run: python -m unittest discover -s Modules/toolbelt.tsql.ssis-debug/Tests/Static -p test_install_package.py
      - name: Reproduce current provider build
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild/**/Bin/MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw 'SSIS_CI_MSBUILD_UNAVAILABLE' }
          $project = 'Modules/toolbelt.tsql.ssis-debug/Clr/Toolbelt.Tsql.SsisDebug.csproj'
          $assembly = 'Modules/toolbelt.tsql.ssis-debug/Clr/bin/Release/Toolbelt.Tsql.SsisDebug.dll'
          $first = $null
          foreach ($build in 1..2) {
            & $msbuild $project /t:Rebuild /p:Configuration=Release "/p:ScriptDomDllPath=$env:SSIS_SCRIPT_DOM_PATH" /m:1 /v:minimal /nologo
            if ($LASTEXITCODE -ne 0) { throw 'SSIS_CI_BUILD_FAILED' }
            $hash = (Get-FileHash -LiteralPath $assembly -Algorithm SHA512).Hash
            if ($first -and $hash -cne $first) { throw 'SSIS_CI_BUILD_NOT_REPRODUCIBLE' }
            $first = $hash
          }
      - name: Full bounded framework contract
        shell: pwsh
        run: >-
          ./Modules/toolbelt.tsql.ssis-debug/Tests/Framework/Invoke-Contract.ps1
          -ScriptDomDllPath $env:SSIS_SCRIPT_DOM_PATH
          -ProviderAssemblyPath Modules/toolbelt.tsql.ssis-debug/Clr/bin/Release/Toolbelt.Tsql.SsisDebug.dll
          -Profile Full
      - name: Shared DTSX model and native framework parity
        shell: pwsh
        run: |
          dotnet build Modules/toolbelt.tsql.ssis-debug/Exchange/Host/Toolbelt.Ssis.Export.csproj -c Release "-p:SourceRevisionId=${{ github.sha }}" --nologo --verbosity quiet
          if ($LASTEXITCODE -ne 0) { throw 'SSIS_EXCHANGE_HOST_BUILD_FAILED' }
          python -m pip install --disable-pip-version-check 'jsonschema==4.26.0'
          if ($LASTEXITCODE -ne 0) { throw 'SSIS_EXCHANGE_TEST_DEPENDENCY_FAILED' }
          python Modules/toolbelt.tsql.ssis-debug/Exchange/Tests/test_contract.py --host Modules/toolbelt.tsql.ssis-debug/Exchange/Host/bin/Release/net10.0/Toolbelt.Ssis.Export.dll --framework-assembly Modules/toolbelt.tsql.ssis-debug/Clr/bin/Release/Toolbelt.Tsql.SsisDebug.dll
          if ($LASTEXITCODE -ne 0) { throw 'SSIS_EXCHANGE_PARITY_FAILED' }
          python -c "import json,jsonschema; from pathlib import Path; p=Path('Modules/toolbelt.tsql.ssis-debug/Contracts'); jsonschema.Draft202012Validator(json.loads((p/'ComponentsV2.schema.json').read_text())).validate(json.loads((p/'ComponentsV2.json').read_text())); print('SSIS_V2_HELP_OVERLAY_SCHEMA_PASS')"
          if ($LASTEXITCODE -ne 0) { throw 'SSIS_V2_HELP_OVERLAY_SCHEMA_FAILED' }
      - name: Native deadline inheritance without SQL
        shell: pwsh
        run: '& Modules/toolbelt.tsql.ssis-debug/Tests/Framework/Invoke-NativeDeadline.ps1'
      - name: Source and SSMS example syntax SQL150 SQL160 SQL170
        shell: pwsh
        run: >-
          ./Modules/toolbelt.tsql.ssis-debug/Tests/Framework/Invoke-Syntax.ps1
          -ScriptDomDllPath $env:SSIS_SCRIPT_DOM_PATH -SourceOnly
      - name: Native adapter syntax without SQL access
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem Modules/toolbelt.tsql.ssis-debug/Tests/Runtime -Filter *.ps1) {
            $tokens = $null; $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) { throw 'SSIS_CI_NATIVE_ADAPTER_SYNTAX_INVALID' }
          }
          & Modules/toolbelt.tsql.ssis-debug/Tests/Framework/Invoke-ReleaseRightsAdapter.ps1
          & Modules/toolbelt.tsql.ssis-debug/Tests/Framework/Invoke-ComponentsV2Adapter.ps1
      - name: Installation example contract without SQL access
        shell: pwsh
        run: ./Modules/toolbelt.tsql.ssis-debug/Tests/Framework/Invoke-InstallationExample.ps1
# Offline evidence only: no SQL host, trusted assembly, Lab or authenticated TLS qualification.
