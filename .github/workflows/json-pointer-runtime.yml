name: JSON Pointer Runtime

on:
  pull_request:
    paths:
      - ".github/workflows/json-pointer-runtime.yml"
      - "Modules/toolbelt.json.pointer/module.yaml"
      - "Modules/toolbelt.json.pointer/Source/**"
      - "Modules/toolbelt.json.pointer/Deployment/**"
      - "Modules/toolbelt.json.pointer/Tests/Runtime/**"
      - "Modules/toolbelt.json.pointer/Tests/Static/**"
      - "Modules/toolbelt.json.pointer/Scripts/generate-deployment.py"
      - "Modules/toolbelt.json.pointer/Tests/CI/run_max_workload.py"
      - "Modules/toolbelt.json.pointer/Tests/CI/test_hard_interrupt_recovery.py"
      - "Modules/toolbelt.json.pointer/Tests/CI/Test-JsonPointerLifecycle.ps1"
      - "Tests/CI/run-json-pointer-linux.sh"
      - "Tests/CI/run-json-pointer-client.ps1"
      - "Tests/CI/JsonPointerLifecycle.Helpers.ps1"
      - "Tests/CI/generate-json-pointer-reference.py"
      - "Tests/CI/run-lab-target.sh"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/json-pointer-runtime.yml"
      - "Modules/toolbelt.json.pointer/module.yaml"
      - "Modules/toolbelt.json.pointer/Source/**"
      - "Modules/toolbelt.json.pointer/Deployment/**"
      - "Modules/toolbelt.json.pointer/Tests/Runtime/**"
      - "Modules/toolbelt.json.pointer/Tests/Static/**"
      - "Modules/toolbelt.json.pointer/Scripts/generate-deployment.py"
      - "Modules/toolbelt.json.pointer/Tests/CI/run_max_workload.py"
      - "Modules/toolbelt.json.pointer/Tests/CI/test_hard_interrupt_recovery.py"
      - "Modules/toolbelt.json.pointer/Tests/CI/Test-JsonPointerLifecycle.ps1"
      - "Tests/CI/run-json-pointer-linux.sh"
      - "Tests/CI/run-json-pointer-client.ps1"
      - "Tests/CI/JsonPointerLifecycle.Helpers.ps1"
      - "Tests/CI/generate-json-pointer-reference.py"
      - "Tests/CI/run-lab-target.sh"
  workflow_dispatch:
    inputs:
      workload_bytes:
        description: "Optionaler einzelner synthetischer Lastfall; none startet die reguläre Matrix"
        type: choice
        required: true
        default: "none"
        options: ["none", "65536", "1048576", "4194304", "16777216"]
      workload_shape:
        description: "JSON-Form für den manuellen Lastfall"
        type: choice
        required: true
        default: "root"
        options: ["root", "object", "array", "nested"]
      workload_depth:
        description: "Nur für nested: Anzahl der /k-Container und Pointer-Schritte"
        type: choice
        required: true
        default: "1"
        options: ["1", "2", "4", "8", "16", "32", "64", "128"]
      workload_sql_version:
        description: "SQL-Version für genau einen flüchtigen Container"
        type: choice
        required: true
        default: "2019"
        options: ["2019", "2022", "2025"]

permissions:
  contents: read

concurrency:
  group: json-pointer-runtime-${{ github.ref }}
  # Laufende Runtimeprüfung erhalten: ein EXIT-Trap belegt kein Hard-Interrupt-Cleanup.
  cancel-in-progress: false

jobs:
  runtime:
    if: github.event_name != 'workflow_dispatch' || inputs.workload_bytes == 'none'
    name: SQL Server ${{ matrix.sql-version }} Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sql-version: ["2019", "2022", "2025"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate static contract
        run: python3 Modules/toolbelt.json.pointer/Tests/Static/validate_contract.py

      - name: Execute synthetic API, safety, client and full lifecycle tests
        env:
          TBX_SQL_VERSION: ${{ matrix.sql-version }}
          TBX_SQL_IMAGE: mcr.microsoft.com/mssql/server:${{ matrix.sql-version }}-latest
        run: bash Tests/CI/run-lab-target.sh Tests/CI/run-json-pointer-linux.sh

  max-workload:
    if: github.event_name == 'workflow_dispatch' && inputs.workload_bytes != 'none'
    name: Manual synthetic ${{ inputs.workload_bytes }} bytes
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate static contract
        run: python3 Modules/toolbelt.json.pointer/Tests/Static/validate_contract.py
      - name: Execute one bounded owned-container probe
        env:
          STAGE_BYTES: ${{ inputs.workload_bytes }}
          SHAPE: ${{ inputs.workload_shape }}
          DEPTH: ${{ inputs.workload_depth }}
          SQL_VERSION: ${{ inputs.workload_sql_version }}
        run: >-
          python3 Modules/toolbelt.json.pointer/Tests/CI/run_max_workload.py
          --stage-bytes "$STAGE_BYTES" --shape "$SHAPE" --depth "$DEPTH"
          --sql-version "$SQL_VERSION"
