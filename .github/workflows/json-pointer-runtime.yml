name: JSON Pointer Runtime

on:
  pull_request:
    paths:
      - ".github/workflows/json-pointer-runtime.yml"
      - "Modules/toolbelt.json.pointer/module.yaml"
      - "Modules/toolbelt.json.pointer/Source/**"
      - "Modules/toolbelt.json.pointer/Deployment/**"
      - "Modules/toolbelt.json.pointer/Tests/Runtime/**"
      - "Modules/toolbelt.json.pointer/Tests/Static/**"
      - "Tests/CI/run-json-pointer-linux.sh"
      - "Tests/CI/run-json-pointer-client.ps1"
      - "Tests/CI/run-lab-target.sh"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/json-pointer-runtime.yml"
      - "Modules/toolbelt.json.pointer/module.yaml"
      - "Modules/toolbelt.json.pointer/Source/**"
      - "Modules/toolbelt.json.pointer/Deployment/**"
      - "Modules/toolbelt.json.pointer/Tests/Runtime/**"
      - "Modules/toolbelt.json.pointer/Tests/Static/**"
      - "Tests/CI/run-json-pointer-linux.sh"
      - "Tests/CI/run-json-pointer-client.ps1"
      - "Tests/CI/run-lab-target.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: json-pointer-runtime-${{ github.ref }}
  # Laufende Runtimeprüfung erhalten: ein EXIT-Trap belegt kein Hard-Interrupt-Cleanup.
  cancel-in-progress: false

jobs:
  runtime:
    name: SQL Server ${{ matrix.sql-version }} Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sql-version: ["2019", "2022", "2025"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate static contract
        run: python3 Modules/toolbelt.json.pointer/Tests/Static/validate_contract.py

      - name: Execute synthetic API, safety, client and installed lifecycle tests
        env:
          TBX_SQL_VERSION: ${{ matrix.sql-version }}
          TBX_SQL_IMAGE: mcr.microsoft.com/mssql/server:${{ matrix.sql-version }}-latest
        run: bash Tests/CI/run-lab-target.sh Tests/CI/run-json-pointer-linux.sh
