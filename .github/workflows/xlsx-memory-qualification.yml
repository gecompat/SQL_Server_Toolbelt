name: XLSX Memory Qualification
on:
  pull_request:
    paths:
      - "Modules/toolbelt.file.xlsx-memory/**"
      - "Modules/toolbelt.archive.zip-memory/**"
      - "Spikes/XlsxMemory/**"
      - "Documentation/Architecture/XLSX_CELL_TYPE_CONTRACT.md"
      - "Documentation/Architecture/XLSX_CELL_DISPLAY_CONTRACT.md"
      - "Modules/toolbelt.string.edit-distance/Scripts/Invoke-OwnedProcess.ps1"
      - "Tests/CI/run-xlsx-types-lab.ps1"
      - ".github/workflows/xlsx-memory-qualification.yml"
  push:
    branches: [main]
    paths:
      - "Modules/toolbelt.file.xlsx-memory/**"
      - "Modules/toolbelt.archive.zip-memory/**"
      - "Spikes/XlsxMemory/**"
      - "Documentation/Architecture/XLSX_CELL_TYPE_CONTRACT.md"
      - "Documentation/Architecture/XLSX_CELL_DISPLAY_CONTRACT.md"
      - "Modules/toolbelt.string.edit-distance/Scripts/Invoke-OwnedProcess.ps1"
      - "Tests/CI/run-xlsx-types-lab.ps1"
      - ".github/workflows/xlsx-memory-qualification.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xlsx-memory-qualification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualification:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Structural contracts
        shell: pwsh
        run: |
          python Modules/toolbelt.file.xlsx-memory/Tests/Static/validate_contract.py
          if ($LASTEXITCODE) { throw 'XLSX static contract failed.' }
          python Modules/toolbelt.archive.zip-memory/Tests/Static/validate_contract.py
          if ($LASTEXITCODE) { throw 'ZIP static contract failed.' }
          foreach ($path in @('Tests/CI/run-xlsx-types-lab.ps1','Modules/toolbelt.file.xlsx-memory/Tests/Runtime/Invoke-TypesComposition.ps1','Modules/toolbelt.file.xlsx-memory/Tests/Runtime/Invoke-DisplayComposition.ps1','Modules/toolbelt.file.xlsx-memory/Tests/Runtime/Display.Metadata.ps1','Modules/toolbelt.file.xlsx-memory/Tests/Framework/Invoke-Display.ps1','Modules/toolbelt.file.xlsx-memory/Scripts/New-Xlsx11LegacyFixture.ps1','Modules/toolbelt.file.xlsx-memory/Tests/Framework/Invoke-CandidateQualification.ps1','Modules/toolbelt.file.xlsx-memory/Tests/Framework/Invoke-CandidatePackaging.ps1','Modules/toolbelt.file.xlsx-memory/Tests/Framework/Test-CandidateMetadata.ps1')) {
            $errors=$null; $tokens=$null
            [Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count) { throw 'XLSX adapter parse failed.' }
          }
      - name: Build current artifacts once and preserve genuine predecessors
        shell: pwsh
        run: |
          # Historische Framework-Compiler benötigen kurze Archiv-/Buildpfade.
          $packageRoot=Join-Path $env:RUNNER_TEMP ('tbx-'+[guid]::NewGuid().ToString('N'))
          ('XLSX_PACKAGE_ROOT='+$packageRoot) >> $env:GITHUB_ENV
          ./Modules/toolbelt.file.xlsx-memory/Tests/Framework/Invoke-CandidatePackaging.ps1 -OutputDirectory $packageRoot
      - name: Consume exact packaged binaries - 19 bounded offline phases
        shell: pwsh
        run: |
          ./Spikes/XlsxMemory/Run-FrameworkQualification.ps1 -XlsxDirectory (Join-Path $env:XLSX_PACKAGE_ROOT 'xlsx') -ZipDirectory (Join-Path $env:XLSX_PACKAGE_ROOT 'zip') -OutputDirectory (Join-Path $env:XLSX_PACKAGE_ROOT 'qualification')
      - uses: actions/upload-artifact@v4
        with:
          name: xlsx-qualified-release-input
          if-no-files-found: error
          path: ${{ env.XLSX_PACKAGE_ROOT }}/**
# Dieser Workflow qualifiziert begrenzte Framework-/IL-Evidenz, keinen SQL-Host.
# Öffentliche SAFE-/Lifecycle-/Clientverträge verwenden den dokumentierten,
# schema-validierten lokalen Labadapter; kein fehlender SQL-Lauf wird behauptet.
