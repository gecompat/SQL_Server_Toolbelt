name: SQL CLR ZIP Spike

on:
  pull_request:
    paths:
      - "Spikes/sql-clr-zip-provider/**"
      - "Documentation/Architecture/ZIP_CLR_PROVIDER_DESIGN.md"
      - ".ai/BACKLOG.md"
      - "Backlog/TOOLBELT_CANDIDATE_IMPLEMENTATION_PLAN.md"
      - ".github/workflows/sql-clr-zip-spike.yml"
  push:
    branches: [main]
    paths:
      - "Spikes/sql-clr-zip-provider/**"
      - "Documentation/Architecture/ZIP_CLR_PROVIDER_DESIGN.md"
      - ".ai/BACKLOG.md"
      - "Backlog/TOOLBELT_CANDIDATE_IMPLEMENTATION_PLAN.md"
      - ".github/workflows/sql-clr-zip-spike.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sql-clr-zip-spike-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-contract:
    name: Static contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 Spikes/sql-clr-zip-provider/Tests/Static/validate_spike.py

  build-net-framework:
    name: .NET Framework 4.8 build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build minimal SAFE SQL CLR assembly
        shell: pwsh
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * -requires Microsoft.Component.MSBuild `
            -find 'MSBuild/**/Bin/MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild wurde nicht gefunden.' }
          & $msbuild Spikes/sql-clr-zip-provider/Source/Toolbelt.ZipClr.Spike.csproj `
            /t:Rebuild /p:Configuration=Release /p:Platform=AnyCPU /m:1
          if ($LASTEXITCODE -ne 0) { throw 'MSBuild ist fehlgeschlagen.' }
      - name: Create SHA2-512 trust manifest
        shell: pwsh
        run: >-
          ./Spikes/sql-clr-zip-provider/Scripts/New-TrustManifest.ps1
          -AssemblyPath ./Spikes/sql-clr-zip-provider/Source/bin/Release/Toolbelt.ZipClr.Spike.dll
          -OutputPath ./Spikes/sql-clr-zip-provider/Artifacts/Toolbelt.ZipClr.Spike.trust-manifest.json
      - name: Upload deployment input
        uses: actions/upload-artifact@v4
        with:
          name: sql-clr-zip-spike-deployment-input
          if-no-files-found: error
          path: |
            Spikes/sql-clr-zip-provider/Source/bin/Release/Toolbelt.ZipClr.Spike.dll
            Spikes/sql-clr-zip-provider/Artifacts/Toolbelt.ZipClr.Spike.trust-manifest.json

  linux-runtime:
    name: Linux SQL Server 2022 runtime
    needs: build-net-framework
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download deployment input
        uses: actions/download-artifact@v4
        with:
          name: sql-clr-zip-spike-deployment-input
          path: .runtime/sql-clr-zip-spike
      - name: Deploy, execute and uninstall in disposable Linux SQL Server
        shell: bash
        run: |
          set -euo pipefail

          sqlcmd_path=/opt/mssql-tools18/bin/sqlcmd
          container_name=toolbelt-sql-clr-zip-spike
          database_name=Toolbelt_ClrZipSpike
          spike_root=Spikes/sql-clr-zip-provider
          runtime_artifacts=.runtime/sql-clr-zip-spike

          cleanup() {
            docker rm --force "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          os_version="$(. /etc/os-release && printf '%s' "$VERSION_ID")"
          curl --fail --silent --show-error --location \
            "https://packages.microsoft.com/config/ubuntu/$os_version/packages-microsoft-prod.deb" \
            --output /tmp/packages-microsoft-prod.deb
          sudo dpkg --install /tmp/packages-microsoft-prod.deb
          rm --force /tmp/packages-microsoft-prod.deb
          sudo apt-get update
          sudo env ACCEPT_EULA=Y apt-get install --yes mssql-tools18

          sa_password="$(openssl rand -hex 20)Aa1!"
          docker run --detach --name "$container_name" \
            --publish 1433:1433 \
            --env ACCEPT_EULA=Y \
            --env MSSQL_SA_PASSWORD="$sa_password" \
            mcr.microsoft.com/mssql/server:2022-latest >/dev/null

          for attempt in {1..60}; do
            if "$sqlcmd_path" -S localhost,1433 -U sa -P "$sa_password" -C -l 1 -b \
              -Q "SELECT 1;" >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker logs "$container_name"
              exit 1
            fi
            sleep 2
          done

          # Nur die wegwerfbare CI-Instanz wird vorbereitet. Die Spike-Skripte
          # selbst verändern weder Instanzoptionen noch Trust-Konfigurationen.
          "$sqlcmd_path" -S localhost,1433 -U sa -P "$sa_password" -C -b \
            -Q "EXEC sys.sp_configure N'clr enabled', 1; RECONFIGURE;"
          "$sqlcmd_path" -S localhost,1433 -U sa -P "$sa_password" -C -b \
            -Q "IF NOT EXISTS (SELECT 1 FROM sys.configurations WHERE name = N'clr strict security' AND value_in_use = 1) THROW 51480, N'clr strict security muss auf der CI-Testinstanz aktiviert bleiben.', 1;"
          "$sqlcmd_path" -S localhost,1433 -U sa -P "$sa_password" -C -b \
            -Q "CREATE DATABASE [$database_name];"

          assembly_file="$(find "$runtime_artifacts" -name Toolbelt.ZipClr.Spike.dll -print -quit)"
          manifest_file="$(find "$runtime_artifacts" -name Toolbelt.ZipClr.Spike.trust-manifest.json -print -quit)"
          test -n "$assembly_file"
          test -n "$manifest_file"

          assembly_hash="$(jq --raw-output '.sqlServerHexLiteral' "$manifest_file")"
          assembly_description="$(jq --raw-output '.description' "$manifest_file")"

          deploy_script="$(mktemp --suffix=.sql)"
          python3 - "$spike_root/Deployment/Deploy-TestDatabase.sql" "$deploy_script" "$assembly_file" <<'PY'
          from pathlib import Path
          import sys

          template_path, output_path, assembly_path = map(Path, sys.argv[1:])
          template = template_path.read_text(encoding="utf-8")
          marker = "$(AssemblyBits)"
          if template.count(marker) != 1:
              raise SystemExit("Deploy-TestDatabase.sql muss genau einen AssemblyBits-Platzhalter enthalten.")
          assembly_hex = "0x" + assembly_path.read_bytes().hex().upper()
          output_path.write_text(template.replace(marker, assembly_hex), encoding="utf-8")
          PY

          "$sqlcmd_path" -S localhost,1433 -U sa -P "$sa_password" -C -b -d master \
            -v "AssemblyHash=$assembly_hash" "AssemblyDescription=$assembly_description" \
            -i "$spike_root/Deployment/Add-TrustedAssembly.sql"
          "$sqlcmd_path" -S localhost,1433 -U sa -P "$sa_password" -C -b -d "$database_name" \
            -v "TestDatabase=$database_name" \
            -i "$deploy_script"
          "$sqlcmd_path" -S localhost,1433 -U sa -P "$sa_password" -C -b -d "$database_name" \
            -v "TestDatabase=$database_name" \
            -i "$spike_root/Deployment/Verify-TestDatabase.sql"
          "$sqlcmd_path" -S localhost,1433 -U sa -P "$sa_password" -C -b -d "$database_name" \
            -v "TestDatabase=$database_name" \
            -i "$spike_root/Deployment/Uninstall-TestDatabase.sql"
          "$sqlcmd_path" -S localhost,1433 -U sa -P "$sa_password" -C -b -d "$database_name" \
            -Q "IF EXISTS (SELECT 1 FROM sys.assemblies WHERE name = N'Toolbelt_ZipClr_Spike') OR OBJECT_ID(N'toolbelt_spike.USP_ProbeDeflatePrimitive', N'PC') IS NOT NULL THROW 51481, N'Der CLR-Spike wurde nicht vollständig deinstalliert.', 1;"

          rm --force "$deploy_script"

  synchronize-status-metadata:
    name: Synchronize status metadata
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/fix-sql-clr-zip-provider'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-sql-clr-zip-provider
          fetch-depth: 0
      - name: Patch backlog and W8 plan
        shell: python
        run: |
          from pathlib import Path
          import re

          backlog_path = Path('.ai/BACKLOG.md')
          backlog = backlog_path.read_text(encoding='utf-8')
          replacement = '''### AP-2026-022: SQL CLR ZIP Build-/Deployment-Spike

          | Feld | Wert |
          |---|---|
          | ID | `AP-2026-022` |
          | Ziel | Den technisch kleinsten SQL-CLR-Providerpfad für ZIP Method 8 mit einer minimalen `SAFE`-Assembly kontrolliert bauen, deployen, ausführen und wieder entfernen. |
          | Scope | C#-Projekt für .NET Framework 4.8; Raw-Deflate über `DeflateStream` aus der unterstützten `System.dll`; eigene CRC32-Prüfung; SHA2-512-Trust-Manifest; binäres `CREATE ASSEMBLY`; getrennte Trust-, Deploy-, Verify- und Uninstall-Skripte; positiver SQL-Server-2022-Linux-Runtime-Gate. Keine produktive ZIP-Funktion, keine öffentliche API und kein Modulmanifest. |
          | Dependencies | `AP-2026-021`, `ZIP_CLR_PROVIDER_DESIGN.md`, `CLR_SECURITY_AND_PORTABILITY.md`, .NET-Framework-4.8-Targeting-Pack, MSBuild, SQLCMD und eine disposable SQL-Server-Testinstanz. |
          | Priorität | `P1` |
          | Status | `active` |
          | Akzeptanzkriterien | Keine direkte Referenz auf `System.IO.Compression.dll` oder `ZipArchive`; `DeflateStream` wird aus `System.dll` geladen; die Testassembly bleibt `SAFE`; der Trust-Hash entsteht aus dem konkreten Binary; Deployment benötigt keinen serverlokalen Buildpfad; tatsächlicher CLR-Aufruf prüft Payload und CRC32; kein Skript setzt `TRUSTWORTHY ON`, deaktiviert `clr strict security` oder verwendet `EXTERNAL_ACCESS`/`UNSAFE`; Uninstall berührt keinen Trust-Eintrag. |
          | Tests | Statische Vertragsprüfung, Windows-GitHub-hosted .NET-Framework-Build und positiver SQL-Server-2022-Linux-Lauf mit Trust, `CREATE ASSEMBLY`, Deflate-/CRC32-Ausführung und Uninstall sind erfolgreich. SQL Server 2019, SQL Server 2025 und Windows-Runtime bleiben separate Pflichtläufe vor Produktfreigabe. |
          | Blocker | Kein bekannter technischer Blocker für den korrigierten Deflate-/CRC32-Spike. Der frühere Fehler 10301 entstand durch den ungeeigneten `ZipArchive`-Pfad und die direkte Abhängigkeit von `System.IO.Compression.dll`. |
          | Evidenz | `Spikes/sql-clr-zip-provider/README.md`, `Source/ZipClrProbe.cs`, `Tests/Static/validate_spike.py`, `.github/workflows/sql-clr-zip-spike.yml` und SQL CLR ZIP Spike Run 30608612435. |
          | Nächster Schritt | SQL Server 2019, SQL Server 2025 und Windows gezielt validieren und erst anschließend die produktive Providerimplementierung erneut zur Freigabe vorlegen. |
          '''
          replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in replacement.splitlines())
          pattern = re.compile(
              r'### AP-2026-022: SQL CLR ZIP Build-/Deployment-Spike\n.*?(?=\n### AP-2026-003:)',
              re.DOTALL,
          )
          backlog, count = pattern.subn(replacement.rstrip(), backlog)
          if count != 1:
              raise SystemExit(f'AP-2026-022 replacement count was {count}, expected 1')
          backlog_path.write_text(backlog, encoding='utf-8')

          plan_path = Path('Backlog/TOOLBELT_CANDIDATE_IMPLEMENTATION_PLAN.md')
          plan = plan_path.read_text(encoding='utf-8')
          plan = plan.replace('Stand: 2026-07-30', 'Stand: 2026-07-31', 1)
          w8 = '| `W8` | `active` | Archive und XLSX | `033`, `034`, `035`, `036`, `045` | Untrusted-input-Limits; Dateiprovider nur bei pfadbasiertem Scope | V1A ist als T-SQL-`Stored`-Slice implementiert, jedoch ohne Runtime-Evidenz. Der optionale CLR-Providervertrag `AP-2026-021` ist abgeschlossen. Der korrigierte Build-/Deployment-Spike `AP-2026-022` verwendet Raw-Deflate über `DeflateStream` aus `System.dll`, eigene CRC32-Prüfung und ist auf SQL Server 2022 Linux positiv validiert; SQL Server 2019/2025 und Windows bleiben vor Produktfreigabe offen. |'
          plan, count = re.subn(r'^\| `W8` \|.*$', w8, plan, count=1, flags=re.MULTILINE)
          if count != 1:
              raise SystemExit(f'W8 replacement count was {count}, expected 1')
          plan_path.write_text(plan, encoding='utf-8')
      - name: Commit status synchronization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ai/BACKLOG.md Backlog/TOOLBELT_CANDIDATE_IMPLEMENTATION_PLAN.md
          git commit -m "ChatGPT: Synchronisiere CLR-ZIP-Metadaten"
          git push origin HEAD:agent/fix-sql-clr-zip-provider
