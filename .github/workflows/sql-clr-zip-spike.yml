name: SQL CLR ZIP Spike

on:
  pull_request:
    paths:
      - "Spikes/sql-clr-zip-provider/**"
      - ".github/workflows/sql-clr-zip-spike.yml"
  push:
    branches: [main]
    paths:
      - "Spikes/sql-clr-zip-provider/**"
      - ".github/workflows/sql-clr-zip-spike.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sql-clr-zip-spike-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-contract:
    name: Static contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 Spikes/sql-clr-zip-provider/Tests/Static/validate_spike.py

  build-net-framework:
    name: .NET Framework 4.8 build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build minimal SAFE SQL CLR assembly
        shell: pwsh
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * -requires Microsoft.Component.MSBuild `
            -find 'MSBuild/**/Bin/MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild wurde nicht gefunden.' }
          & $msbuild Spikes/sql-clr-zip-provider/Source/Toolbelt.ZipClr.Spike.csproj `
            /t:Rebuild /p:Configuration=Release /p:Platform=AnyCPU /m:1
      - name: Create SHA2-512 trust manifest
        shell: pwsh
        run: >-
          ./Spikes/sql-clr-zip-provider/Scripts/New-TrustManifest.ps1
          -AssemblyPath ./Spikes/sql-clr-zip-provider/Source/bin/Release/Toolbelt.ZipClr.Spike.dll
          -OutputPath ./Spikes/sql-clr-zip-provider/Artifacts/Toolbelt.ZipClr.Spike.trust-manifest.json
      - name: Upload deployment input
        uses: actions/upload-artifact@v4
        with:
          name: sql-clr-zip-spike-deployment-input
          if-no-files-found: error
          path: |
            Spikes/sql-clr-zip-provider/Source/bin/Release/Toolbelt.ZipClr.Spike.dll
            Spikes/sql-clr-zip-provider/Artifacts/Toolbelt.ZipClr.Spike.trust-manifest.json

  linux-runtime:
    name: Linux SQL Server 2022 runtime
    needs: build-net-framework
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download deployment input
        uses: actions/download-artifact@v4
        with:
          name: sql-clr-zip-spike-deployment-input
          path: .runtime/sql-clr-zip-spike
      - name: Deploy and verify in disposable Linux SQL Server container
        shell: bash
        run: |
          set -euo pipefail

          sqlcmd_path=/opt/mssql-tools18/bin/sqlcmd
          container_name=toolbelt-sql-clr-zip-spike
          database_name=Toolbelt_ClrZipSpike
          assembly_path=/var/opt/mssql/data/Toolbelt.ZipClr.Spike.dll
          spike_root=Spikes/sql-clr-zip-provider
          runtime_artifacts=.runtime/sql-clr-zip-spike

          cleanup() {
            docker rm --force "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          os_version="$(. /etc/os-release && printf '%s' "$VERSION_ID")"
          curl --fail --silent --show-error --location             "https://packages.microsoft.com/config/ubuntu/$os_version/packages-microsoft-prod.deb"             --output /tmp/packages-microsoft-prod.deb
          sudo dpkg --install /tmp/packages-microsoft-prod.deb
          rm --force /tmp/packages-microsoft-prod.deb
          sudo apt-get update
          sudo env ACCEPT_EULA=Y apt-get install --yes mssql-tools18

          sa_password="$(openssl rand -hex 20)Aa1!"
          docker run --detach --name "$container_name"             --publish 1433:1433             --env ACCEPT_EULA=Y             --env MSSQL_SA_PASSWORD="$sa_password"             mcr.microsoft.com/mssql/server:2022-latest >/dev/null

          for attempt in {1..60}; do
            if "$sqlcmd_path" -S localhost,1433 -U sa -P "$sa_password" -C -l 1 -b               -Q "SELECT 1;" >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker logs "$container_name"
              exit 1
            fi
            sleep 2
          done

          # Nur die wegwerfbare CI-Instanz wird vorbereitet. Die Spike-Skripte
          # selbst verändern weder Instanzoptionen noch Trust-Konfigurationen.
          "$sqlcmd_path" -S localhost,1433 -U sa -P "$sa_password" -C -b             -Q "EXEC sys.sp_configure N'clr enabled', 1; RECONFIGURE;"
          "$sqlcmd_path" -S localhost,1433 -U sa -P "$sa_password" -C -b             -Q "IF NOT EXISTS (SELECT 1 FROM sys.configurations WHERE name = N'clr strict security' AND value_in_use = 1) THROW 51480, N'clr strict security muss auf der CI-Testinstanz aktiviert bleiben.', 1;"
          "$sqlcmd_path" -S localhost,1433 -U sa -P "$sa_password" -C -b             -Q "CREATE DATABASE [$database_name];"

          assembly_file="$(find "$runtime_artifacts" -name Toolbelt.ZipClr.Spike.dll -print -quit)"
          manifest_file="$(find "$runtime_artifacts" -name Toolbelt.ZipClr.Spike.trust-manifest.json -print -quit)"
          test -n "$assembly_file"
          test -n "$manifest_file"

          assembly_hash="$(jq --raw-output '.sqlServerHexLiteral' "$manifest_file")"
          assembly_description="$(jq --raw-output '.description' "$manifest_file")"
          docker cp "$assembly_file" "$container_name:$assembly_path"

          "$sqlcmd_path" -S localhost,1433 -U sa -P "$sa_password" -C -b -d master             -v "AssemblyHash=$assembly_hash" "AssemblyDescription=$assembly_description"             -i "$spike_root/Deployment/Add-TrustedAssembly.sql"
          "$sqlcmd_path" -S localhost,1433 -U sa -P "$sa_password" -C -b -d "$database_name"             -v "TestDatabase=$database_name" "AssemblyPath=$assembly_path"             -i "$spike_root/Deployment/Deploy-TestDatabase.sql"
          "$sqlcmd_path" -S localhost,1433 -U sa -P "$sa_password" -C -b -d "$database_name"             -v "TestDatabase=$database_name"             -i "$spike_root/Deployment/Verify-TestDatabase.sql"
          "$sqlcmd_path" -S localhost,1433 -U sa -P "$sa_password" -C -b -d "$database_name"             -v "TestDatabase=$database_name"             -i "$spike_root/Deployment/Uninstall-TestDatabase.sql"
          "$sqlcmd_path" -S localhost,1433 -U sa -P "$sa_password" -C -b -d master             -Q "DROP DATABASE [$database_name];"
