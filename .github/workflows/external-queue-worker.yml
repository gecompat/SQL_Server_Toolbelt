name: External Queue Worker

on:
  pull_request:
    paths:
      - "Deployment/Deploy-All.ps1"
      - "Deployment/Tests/Invoke-ExportPopulatedRepeat.ps1"
      - "Deployment/Tests/Runtime/ExportPopulated*.sql"
      - "Deployment/Tests/Runtime/ExportUpgrade*.sql"
      - "Deployment/Tests/Runtime/ExportParameter*.sql"
      - "Modules/toolbelt.file.content/Source/**"
      - "Modules/toolbelt.file.content/Deployment/**"
      - "Modules/toolbelt.file.content/module.yaml"
      - "Modules/toolbelt.core.second-session/Source/**"
      - "Modules/toolbelt.core.second-session/Deployment/**"
      - "Modules/toolbelt.core.second-session/module.yaml"
      - "Modules/toolbelt.core.result-table/Source/**"
      - "Modules/toolbelt.core.result-table/Deployment/**"
      - "Modules/toolbelt.core.result-table/module.yaml"
      - "Modules/toolbelt.core.event-log/Source/**"
      - "Modules/toolbelt.core.event-log/Deployment/**"
      - "Modules/toolbelt.core.event-log/module.yaml"
      - "Workers/ExternalQueue/**"
      - "Modules/toolbelt.json.constructors/Scripts/Invoke-OwnedProcess.ps1"
      - "Documentation/Architecture/EXTERNAL_QUEUE_WORKER_CONTRACT.md"
      - "Documentation/Architecture/WORKER_CONTROL_CONTRACT.md"
      - "Modules/toolbelt.core.work-queue/**"
      - "Modules/toolbelt.core.worker-control/**"
      - "Modules/toolbelt.core.work-type/**"
      - "Modules/toolbelt.core.execution-context/**"
      - "Modules/toolbelt.core.execution-cancel/**"
      - "Tests/CI/run-external-queue-worker-lab.ps1"
      - ".github/workflows/external-queue-worker.yml"
      # Reine Evidenzpflege ändert weder Worker noch SQL-Vertrag.
      - "!Workers/ExternalQueue/README.md"
      - "!Workers/ExternalQueue/Tests/README.md"
      - "!Modules/toolbelt.core.worker-control/Tests/README.md"
  push:
    branches: [main]
    paths:
      - "Deployment/Deploy-All.ps1"
      - "Deployment/Tests/Invoke-ExportPopulatedRepeat.ps1"
      - "Deployment/Tests/Runtime/ExportPopulated*.sql"
      - "Deployment/Tests/Runtime/ExportUpgrade*.sql"
      - "Deployment/Tests/Runtime/ExportParameter*.sql"
      - "Modules/toolbelt.core.execution-context/Source/**"
      - "Modules/toolbelt.core.execution-context/Deployment/**"
      - "Modules/toolbelt.core.execution-context/module.yaml"
      - "Modules/toolbelt.core.result-table/Source/**"
      - "Modules/toolbelt.core.result-table/Deployment/**"
      - "Modules/toolbelt.core.result-table/module.yaml"
      - "Modules/toolbelt.file.content/Source/**"
      - "Modules/toolbelt.file.content/Deployment/**"
      - "Modules/toolbelt.file.content/module.yaml"
      - "Modules/toolbelt.core.execution-cancel/Source/**"
      - "Modules/toolbelt.core.execution-cancel/Deployment/**"
      - "Modules/toolbelt.core.execution-cancel/module.yaml"
      - "Modules/toolbelt.core.work-type/Source/**"
      - "Modules/toolbelt.core.work-type/Deployment/**"
      - "Modules/toolbelt.core.work-type/module.yaml"
      - "Modules/toolbelt.core.second-session/Source/**"
      - "Modules/toolbelt.core.second-session/Deployment/**"
      - "Modules/toolbelt.core.second-session/module.yaml"
      - "Modules/toolbelt.core.work-queue/Source/**"
      - "Modules/toolbelt.core.work-queue/Deployment/**"
      - "Modules/toolbelt.core.work-queue/module.yaml"
      - "Modules/toolbelt.core.event-log/Source/**"
      - "Modules/toolbelt.core.event-log/Deployment/**"
      - "Modules/toolbelt.core.event-log/module.yaml"
      - "Modules/toolbelt.core.worker-control/Source/**"
      - "Modules/toolbelt.core.worker-control/Deployment/**"
      - "Modules/toolbelt.core.worker-control/module.yaml"
      - "Workers/ExternalQueue/**"
      - "Modules/toolbelt.json.constructors/Scripts/Invoke-OwnedProcess.ps1"
      - ".github/workflows/external-queue-worker.yml"
      # Gleiche Ausschlüsse auf main; gemischte Code-/Doku-Diffs bleiben aktiv.
      - "!Workers/ExternalQueue/README.md"
      - "!Workers/ExternalQueue/Tests/README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-queue-worker-${{ github.ref }}
  # Laufende Runtimeprüfung erhalten: keine belegte Hard-Interrupt-Bereinigung.
  cancel-in-progress: false

jobs:
  fault-contract:
    name: Worker fault contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Execute deterministic worker faults
        shell: pwsh
        run: ./Workers/ExternalQueue/Tests/Worker.Contract.ps1
      - name: Verify synthetic CI target ownership
        run: python Workers/ExternalQueue/Tests/CiTarget.Contract.py
      - name: Execute execution actor isolation faults
        shell: pwsh
        run: ./Workers/ExternalQueue/Tests/ExecutionActors.Contract.ps1
      - name: Execute managed worker client contracts
        shell: pwsh
        run: ./Workers/ExternalQueue/Tests/ManagedWorker.Contract.ps1

  linux-runtime:
    name: Linux worker / SQL Server 2019
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Start disposable synthetic SQL target
        shell: bash
        run: |
          set -euo pipefail
          container_name="tbx-external-worker-${GITHUB_RUN_ID:-}-${GITHUB_RUN_ATTEMPT:-}"
          [[ "${container_name}" =~ ^tbx-external-worker-[0-9]+-[0-9]+$ ]] || { echo WORKER_CI_IDENTITY_INVALID >&2; exit 1; }
          container_owner="$(openssl rand -hex 16)"
          [[ "${container_owner}" =~ ^[0-9a-f]{32}$ ]] || { echo WORKER_CI_OWNER_INVALID >&2; exit 1; }
          # Vor Dockerstart für den separaten always-Cleanup verfügbar machen.
          # Das Label bindet auch einen teilweise fehlgeschlagenen eigenen Start.
          printf 'TBX_WORKER_CI_NAME=%s\nTBX_WORKER_CI_OWNER=%s\n' "${container_name}" "${container_owner}" >> "$GITHUB_ENV"
          worker_password="Tbx!$(openssl rand -hex 18)Aa1"
          echo "::add-mask::${worker_password}"
          docker run -d --name "${container_name}" \
            --label "tbx.external-worker.ci.owner=${container_owner}" \
            -e ACCEPT_EULA=Y -e MSSQL_PID=Developer \
            -e MSSQL_SA_PASSWORD="${worker_password}" \
            -p 127.0.0.1:1433:1433 \
            mcr.microsoft.com/mssql/server:2019-latest >/dev/null
          worker_connection="Data Source=127.0.0.1,1433;Initial Catalog=master;User ID=sa;Password=${worker_password};Encrypt=True;TrustServerCertificate=True;Connect Timeout=5"
          echo "::add-mask::${worker_connection}"
          echo "TBX_WORKER_TEST_CONNECTION_STRING=${worker_connection}" >> "$GITHUB_ENV"
      - name: Wait for synthetic target
        shell: pwsh
        run: |
          $ready = $false
          for ($attempt = 0; $attempt -lt 60; $attempt++) {
            $connection = [System.Data.SqlClient.SqlConnection]::new($env:TBX_WORKER_TEST_CONNECTION_STRING)
            try { $connection.Open(); $ready = $true; break }
            catch { Start-Sleep -Seconds 2 }
            finally { $connection.Dispose() }
          }
          if (-not $ready) { throw 'WORKER.CI_TARGET_UNAVAILABLE' }
      - name: Execute real Linux worker contracts
        shell: pwsh
        run: >-
          ./Workers/ExternalQueue/Tests/Runtime/Invoke-Contract.ps1
          -ConnectionStringEnvironmentVariable TBX_WORKER_TEST_CONNECTION_STRING
          -ExpectedSqlVersion 2019
      - name: Execute managed worker SQL contracts
        shell: pwsh
        run: >-
          ./Workers/ExternalQueue/Tests/Runtime/Invoke-Contract.ps1
          -ConnectionStringEnvironmentVariable TBX_WORKER_TEST_CONNECTION_STRING
          -ExpectedSqlVersion 2019
          -ManagedOnly
      - name: Execute managed admission and generation contracts
        shell: pwsh
        run: >-
          ./Workers/ExternalQueue/Tests/Runtime/Invoke-Contract.ps1
          -ConnectionStringEnvironmentVariable TBX_WORKER_TEST_CONNECTION_STRING
          -ExpectedSqlVersion 2019
          -ManagedSqlOnly
      - name: Execute genuine Queue 2.0 to 2.1 upgrade
        shell: pwsh
        run: >-
          ./Workers/ExternalQueue/Tests/Runtime/Invoke-Contract.ps1
          -ConnectionStringEnvironmentVariable TBX_WORKER_TEST_CONNECTION_STRING
          -ExpectedSqlVersion 2019
          -QueueUpgradeOnly
      # Der Exporttest verwendet denselben eigenen Targetscope; keine neue
      # Infrastruktur, Providerkonfiguration oder breitere Versionsmatrix.
      - name: Execute populated nine-module SQL export repeats
        shell: pwsh
        run: >-
          ./Deployment/Tests/Invoke-ExportPopulatedRepeat.ps1
          -ConnectionStringEnvironmentVariable TBX_WORKER_TEST_CONNECTION_STRING
      - name: Execute exported genuine Queue 2.0 migration
        shell: pwsh
        run: >-
          ./Deployment/Tests/Invoke-ExportPopulatedRepeat.ps1
          -ConnectionStringEnvironmentVariable TBX_WORKER_TEST_CONNECTION_STRING
          -Scenario Queue20Upgrade
      - name: Execute exported parameter metadata repeat
        shell: pwsh
        run: >-
          ./Deployment/Tests/Invoke-ExportPopulatedRepeat.ps1
          -ConnectionStringEnvironmentVariable TBX_WORKER_TEST_CONNECTION_STRING
          -Scenario ParameterMetadata
      - name: Cleanup owned synthetic target
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          container_name="${TBX_WORKER_CI_NAME:-}"
          container_owner="${TBX_WORKER_CI_OWNER:-}"
          [[ "${container_name}" =~ ^tbx-external-worker-[0-9]+-[0-9]+$ && "${container_owner}" =~ ^[0-9a-f]{32}$ ]] || { echo WORKER_CI_CLEANUP_UNVERIFIED >&2; exit 1; }
          # Eine Inspection bindet vollständige ID und Owner; ein ersetzter Name
          # kann kein Löschziel werden. Fehlende Sicht ist kein Abwesenheitsbeweis.
          names="$(docker container ls --all --filter "name=^/${container_name}$" --format '{{.Names}}' 2>/dev/null)" || { echo WORKER_CI_CLEANUP_UNVERIFIED >&2; exit 1; }
          if [[ -n "${names}" ]]; then
            [[ "${names}" == "${container_name}" ]] || { echo WORKER_CI_CLEANUP_UNVERIFIED >&2; exit 1; }
            identity="$(docker inspect --format '{{.Id}} {{ index .Config.Labels "tbx.external-worker.ci.owner" }}' "${container_name}" 2>/dev/null)" || { echo WORKER_CI_CLEANUP_UNVERIFIED >&2; exit 1; }
            [[ "${identity}" =~ ^([0-9a-f]{64})\ ([0-9a-f]{32})$ ]] || { echo WORKER_CI_CLEANUP_UNVERIFIED >&2; exit 1; }
            container_id="${BASH_REMATCH[1]}"
            [[ "${BASH_REMATCH[2]}" == "${container_owner}" ]] || { echo WORKER_CI_CLEANUP_UNVERIFIED >&2; exit 1; }
            docker rm -f "${container_id}" >/dev/null 2>&1 || { echo WORKER_CI_CLEANUP_UNVERIFIED >&2; exit 1; }
          fi
          names="$(docker container ls --all --filter "name=^/${container_name}$" --format '{{.Names}}' 2>/dev/null)" || { echo WORKER_CI_CLEANUP_UNVERIFIED >&2; exit 1; }
          [[ -z "${names}" ]] || { echo WORKER_CI_CLEANUP_UNVERIFIED >&2; exit 1; }
          echo WORKER_CI_CLEANUP_VERIFIED
