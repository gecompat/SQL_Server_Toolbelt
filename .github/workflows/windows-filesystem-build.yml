name: Windows Filesystem Build

on:
  pull_request:
    paths:
      - 'Modules/toolbelt.filesystem.windows/**'
      - 'Documentation/Architecture/WINDOWS_FILESYSTEM_MODULE_DESIGN.md'
      - '.github/workflows/windows-filesystem-build.yml'
  push:
    branches: [main]
    paths:
      - 'Modules/toolbelt.filesystem.windows/**'
      - 'Documentation/Architecture/WINDOWS_FILESYSTEM_MODULE_DESIGN.md'

jobs:
  build-and-static-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build .NET Framework SQL CLR assembly
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere)) {
            throw "Visual Studio locator was not found on the Windows runner."
          }
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($msbuild) -or -not (Test-Path -LiteralPath $msbuild)) {
            throw "MSBuild.exe was not found through vswhere."
          }
          & $msbuild Modules/toolbelt.filesystem.windows/Clr/Toolbelt.Filesystem.Windows.csproj /p:Configuration=Release /p:Platform=AnyCPU
          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild.exe failed with exit code $LASTEXITCODE."
          }
      - name: Validate static contract
        shell: pwsh
        run: python Modules/toolbelt.filesystem.windows/Tests/Static/validate_contract.py
      - name: Validate synthetic witness controls
        shell: pwsh
        run: ./Modules/toolbelt.filesystem.windows/Tests/Framework/Test-WitnessControls.ps1
      - name: Run bounded current-provider NoOverwrite regression
        shell: pwsh
        run: |
          $framework = "Modules/toolbelt.filesystem.windows/Tests/Framework"
          $runner = Join-Path $framework "Invoke-NoOverwrite.ps1"
          $runnerHash = (Get-FileHash -LiteralPath $runner -Algorithm SHA256).Hash
          $providerHash = (Get-FileHash -LiteralPath "Modules/toolbelt.filesystem.windows/Clr/WindowsFilesystemProvider.cs" -Algorithm SHA256).Hash
          $harnessHash = (Get-FileHash -LiteralPath (Join-Path $framework "NoOverwriteHarness.cs") -Algorithm SHA256).Hash
          & $runner -ExpectedRunnerSHA256 $runnerHash -ExpectedProviderSHA256 $providerHash -ExpectedHarnessSHA256 $harnessHash
          if ($LASTEXITCODE -ne 0) { throw "FS_NO_OVERWRITE_CI_FAILED" }
