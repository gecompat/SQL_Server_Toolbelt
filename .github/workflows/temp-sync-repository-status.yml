        run: bash Tests/CI/run-file-content-linux.sh

      - name: Generate and validate repository status
        run: |
          python3 Tests/Documentation/validate_documentation.py --all --write
          python3 Tests/Documentation/validate_documentation.py --all

      - name: Commit synchronized repository state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- .github/workflows/temp-sync-repository-status.yml
          if git diff --cached --quiet; then
            echo "No synchronized changes were produced."
            exit 0
          fi
          git commit -m "ChatGPT: Synchronisiere Repository-Status und To-dos"
          git push origin HEAD:agent/synchronize-repository-status
