# Current markerless install gates run separately; native lifecycle jobs below retain their original source.
name: W2b JSON Path Runtime

on:
  pull_request:
    paths:
      - "Tests/CI/run-lab-target.sh"
      - "Modules/toolbelt.json.path-exists/Source/**"
      - "Modules/toolbelt.json.path-exists/Deployment/**"
      - "Modules/toolbelt.json.path-exists/Tests/Runtime/**"
      - "Modules/toolbelt.json.path-exists/Tests/Static/**"
      - "Modules/toolbelt.json.path-exists/module.yaml"
      - "Tests/CI/run-w2b-json-path-linux.sh"
      - ".github/workflows/w2b-json-path-runtime.yml"
  push:
    branches: [main]
    paths:
      - "Tests/CI/run-lab-target.sh"
      - "Modules/toolbelt.json.path-exists/Source/**"
      - "Modules/toolbelt.json.path-exists/Deployment/**"
      - "Modules/toolbelt.json.path-exists/Tests/Runtime/**"
      - "Modules/toolbelt.json.path-exists/Tests/Static/**"
      - "Modules/toolbelt.json.path-exists/module.yaml"
      - "Tests/CI/run-w2b-json-path-linux.sh"
      - ".github/workflows/w2b-json-path-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-component-contract:
    name: Current component equivalence and original lifecycle assertions
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject business drift before reusing original assertions
        run: |
          python -B Modules/toolbelt.json.path-exists/Tests/Static/validate_contract.py
  runtime:
    # Retired SQLCMD/marker lifecycle: explicit historical dispatch only.
    if: github.event_name == 'workflow_dispatch'
    name: SQL Server ${{ matrix.sql-version }} Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sql-version: ["2019", "2022", "2025"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && '2fbe8e3e86f370b22ad2ce9f9716d971072a052b' || github.sha }}
      - run: >-
          python3
          Modules/toolbelt.json.path-exists/Tests/Static/validate_contract.py
      - env:
          TBX_SQL_VERSION: ${{ matrix.sql-version }}
          TBX_SQL_IMAGE: mcr.microsoft.com/mssql/server:${{ matrix.sql-version }}-latest
        run: bash Tests/CI/run-lab-target.sh Tests/CI/run-w2b-json-path-linux.sh
