# Current markerless install gates run separately; native lifecycle jobs below retain their original source.
name: Q1 Migration Idempotency

on:
  pull_request:
    paths:
      - "Tests/CI/run-lab-target.sh"
      - "Modules/toolbelt.core.generate-series/Source/**"
      - "Modules/toolbelt.core.generate-series/module.yaml"
      - ".github/workflows/q1-migration-idempotency.yml"
      - "Tests/CI/run-q1-migration-idempotency.sh"
      - "Tests/Quality/MigrationIdempotency/**"
      - "Documentation/Architecture/MIGRATION_IDEMPOTENCY_VERIFIER_DESIGN.md"
      - "Modules/toolbelt.core.generate-series/Deployment/**"
  push:
    branches: [main]
    paths:
      - "Tests/CI/run-lab-target.sh"
      - "Modules/toolbelt.core.generate-series/Source/**"
      - "Modules/toolbelt.core.generate-series/module.yaml"
      - ".github/workflows/q1-migration-idempotency.yml"
      - "Tests/CI/run-q1-migration-idempotency.sh"
      - "Tests/Quality/MigrationIdempotency/**"
      - "Documentation/Architecture/MIGRATION_IDEMPOTENCY_VERIFIER_DESIGN.md"
      - "Modules/toolbelt.core.generate-series/Deployment/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: q1-migration-idempotency-${{ github.ref }}
  # Laufende Runtimeprüfung erhalten: keine belegte Hard-Interrupt-Bereinigung.
  cancel-in-progress: false

jobs:
  current-component-contract:
    name: Current component equivalence and original lifecycle assertions
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject business drift before reusing original assertions
        run: |
          python -B Modules/toolbelt.core.generate-series/Tests/Static/validate_contract.py
  static-contract:
    name: Static contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && '2fbe8e3e86f370b22ad2ce9f9716d971072a052b' || github.sha }}
      - run: python3 Tests/Quality/MigrationIdempotency/validate_contract.py

  sql-server-linux:
    # Retired SQLCMD/marker lifecycle: explicit historical dispatch only.
    if: github.event_name == 'workflow_dispatch'
    name: SQL Server ${{ matrix.version }} Linux
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "2019"
            image: "mcr.microsoft.com/mssql/server:2019-latest"
          - version: "2022"
            image: "mcr.microsoft.com/mssql/server:2022-latest"
          - version: "2025"
            image: "mcr.microsoft.com/mssql/server:2025-latest"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && '2fbe8e3e86f370b22ad2ce9f9716d971072a052b' || github.sha }}
      - name: Verify repeat deploy and uninstall
        env:
          TBX_SQL_IMAGE: ${{ matrix.image }}
          TBX_SQL_VERSION: ${{ matrix.version }}
        run: bash Tests/CI/run-lab-target.sh Tests/CI/run-q1-migration-idempotency.sh
