name: Temporary Apply Validated Repository Status Output

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/temp-apply-status-output.yml

permissions:
  actions: read
  contents: write

jobs:
  apply-validated-output:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Download exact validated output
        uses: actions/download-artifact@v4
        with:
          name: repository-status-output
          path: .runtime/status-output
          repository: gecompat/SQL_Server_Toolbelt
          run-id: 30692267356
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply validated files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .runtime/validated-repository
          tar -xzf .runtime/status-output/repository-status-output.tar.gz \
            -C .runtime/validated-repository
          while IFS= read -r path; do
            [[ -n "${path}" ]] || continue
            source_path=".runtime/validated-repository/${path}"
            [[ -f "${source_path}" ]] || {
              echo "Validierte Datei fehlt im Artifact: ${path}" >&2
              exit 1
            }
            mkdir -p "$(dirname "${path}")"
            cp "${source_path}" "${path}"
          done < .runtime/status-output/changed-files.txt
          rm -f \
            Modules/toolbelt.file.content/Tests/Runtime/fixtures/ansi.txt \
            Modules/toolbelt.file.content/Tests/Runtime/fixtures/sample.bin \
            Modules/toolbelt.file.content/Tests/Runtime/fixtures/utf8-bom.txt \
            Modules/toolbelt.file.content/Tests/Runtime/fixtures/utf16le-bom.txt
      - name: Revalidate applied repository state
        run: |
          python3 Modules/toolbelt.file.content/Tests/Static/validate_contract.py
          python3 Modules/toolbelt.filesystem.windows/Tests/Static/validate_contract.py
          python3 Tests/Documentation/validate_documentation.py --all
      - name: Commit validated repository state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- \
            .github/workflows/temp-apply-status-output.yml \
            .github/workflows/temp-generate-status-output.yml \
            .github/workflows/temp-sync-repository-status.yml \
            .github/workflows/temp-sync-repository-status-pr.yml \
            Tests/Documentation/run_temp_status_sync.py
          if git diff --cached --quiet; then
            echo "Keine geprüften Änderungen zu committen."
            exit 0
          fi
          git commit -m "ChatGPT: Synchronisiere Repository-Status und To-dos"
          git push origin HEAD:${{ github.head_ref }}
