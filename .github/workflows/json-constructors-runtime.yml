name: JSON Constructors Runtime

on:
  pull_request:
    paths:
      - ".github/workflows/json-constructors-runtime.yml"
      - "Modules/toolbelt.json.constructors/.gitattributes"
      - "Modules/toolbelt.json.core/**"
      - "Modules/toolbelt.json.schema/**"
      - "Modules/toolbelt.json.constructors/module.yaml"
      - "Modules/toolbelt.json.constructors/Source/**"
      - "Modules/toolbelt.json.constructors/Deployment/**"
      - "Modules/toolbelt.json.constructors/Clr/**"
      - "Modules/toolbelt.json.constructors/Scripts/**"
      - "Modules/toolbelt.json.constructors/Tests/Framework/**"
      - "Modules/toolbelt.json.constructors/Documentation/KNOWN_CLR_ARTIFACTS.json"
      - "Modules/toolbelt.json.constructors/Tests/Runtime/**"
      - "Modules/toolbelt.json.constructors/Tests/Static/**"
      - "Tests/CI/run-json-constructors-linux.sh"
      - "Tests/CI/run-json-groups-lab.ps1"
      - "Tests/CI/run-json-schema-lab.ps1"
      - "Tests/CI/Test-JsonSchemaLabScope.ps1"
      - "Tests/CI/Test-JsonSchemaLabDisposition.ps1"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/json-constructors-runtime.yml"
      - "Modules/toolbelt.json.constructors/.gitattributes"
      - "Modules/toolbelt.json.core/**"
      - "Modules/toolbelt.json.schema/**"
      - "Modules/toolbelt.json.constructors/module.yaml"
      - "Modules/toolbelt.json.constructors/Source/**"
      - "Modules/toolbelt.json.constructors/Deployment/**"
      - "Modules/toolbelt.json.constructors/Clr/**"
      - "Modules/toolbelt.json.constructors/Scripts/**"
      - "Modules/toolbelt.json.constructors/Tests/Framework/**"
      - "Modules/toolbelt.json.constructors/Documentation/KNOWN_CLR_ARTIFACTS.json"
      - "Modules/toolbelt.json.constructors/Tests/Runtime/**"
      - "Modules/toolbelt.json.constructors/Tests/Static/**"
      - "Tests/CI/run-json-constructors-linux.sh"
      - "Tests/CI/run-json-groups-lab.ps1"
      - "Tests/CI/run-json-schema-lab.ps1"
      - "Tests/CI/Test-JsonSchemaLabScope.ps1"
      - "Tests/CI/Test-JsonSchemaLabDisposition.ps1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: json-constructors-runtime-${{ github.ref }}
  # Laufende Runtimeprüfung erhalten: keine belegte Hard-Interrupt-Bereinigung.
  cancel-in-progress: false

jobs:
  known-artifact:
    name: Known SAFE JSON artifact and offline contracts
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate bounded Lab selector binding without Lab access
        shell: pwsh
        run: ./Tests/CI/Test-JsonSchemaLabScope.ps1
      - name: Build bounded and require exact independently qualified bytes
        shell: pwsh
        run: |
          $module='Modules/toolbelt.json.constructors'
          . "$module/Scripts/Invoke-OwnedProcess.ps1"
          $locator=Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          if(-not(Test-Path -LiteralPath $locator -PathType Leaf)){throw 'JSON_CI_LOCATOR_UNAVAILABLE'}
          $located=Invoke-OwnedProcess -FileName $locator -Arguments @('-latest','-products','*','-requires','Microsoft.Component.MSBuild','-find','MSBuild\Current\Bin\MSBuild.exe') -TimeoutMilliseconds 30000
          if($located.ExitCode -ne 0 -or -not $located.CaptureComplete -or $located.Stderr.Length -ne 0){throw 'JSON_CI_LOCATOR_FAILED'}
          $paths=@($located.Stdout -split '\r?\n' | Where-Object {-not [string]::IsNullOrWhiteSpace($_)})
          if($paths.Count -ne 1 -or -not [IO.Path]::IsPathFullyQualified($paths[0])){throw 'JSON_CI_MSBUILD_UNAVAILABLE'}
          $build=[IO.Path]::GetFullPath($paths[0])
          $compiler=Join-Path (Split-Path -Parent $build) 'Roslyn/csc.exe'
          if(-not(Test-Path -LiteralPath $build -PathType Leaf) -or -not(Test-Path -LiteralPath $compiler -PathType Leaf)){throw 'JSON_CI_MSBUILD_UNAVAILABLE'}
          $refs=Join-Path ${env:ProgramFiles(x86)} 'Reference Assemblies/Microsoft/Framework/.NETFramework/v4.8'
          $framework=Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
          $schema='Modules/toolbelt.json.schema/Tests/Framework'
          & "$schema/Invoke-SourceQualification.ps1" -CompilerPath $compiler -ReferenceDirectory $refs -FrameworkPowerShell $framework -OutputDirectory '.runtime/json-framework'
          & "$schema/Test-ProjectBuild.ps1" -MSBuildPath $build -QualifiedDirectory '.runtime/json-framework' -OutputDirectory '.runtime/json-project'
          & 'Modules/toolbelt.json.core/Tests/Framework/Test-RejectedClosure.ps1' -CompilerPath $compiler -ReferenceDirectory $refs -FrameworkPowerShell $framework -OutputDirectory '.runtime/json-rejected'
          & "$schema/Test-ReleasePackaging.ps1" -QualifiedDirectory '.runtime/json-framework' -OutputDirectory '.runtime/json-packaging-tests'
          foreach($entry in @(@('core','Core','json-core'),@('constructors','Constructors','json-clr'),@('schema','Schema','json-schema'))){
            & 'Modules/toolbelt.json.core/Scripts/New-JsonClosureRelease.ps1' -ModuleId ('toolbelt.json.'+$entry[0]) -AssemblyPath ('.runtime/json-framework/Toolbelt.Json'+$entry[1]+'.dll') -CoreAssemblyPath '.runtime/json-framework/Toolbelt.JsonCore.dll' -OutputDirectory ('.runtime/'+$entry[2])
          }
          & "$module/Deployment/New-Historical12TestArtifacts.ps1" -MSBuildPath $build -OutputDirectory '.runtime/json-historical12-proof'
          & 'Modules/toolbelt.json.schema/Deployment/New-Historical10TestArtifacts.ps1' -MSBuildPath $build -CoreAssemblyPath '.runtime/json-framework/Toolbelt.JsonCore.dll' -OutputDirectory '.runtime/json-schema-historical10-proof'
          Copy-Item -LiteralPath '.runtime/json-historical12-proof/release' -Destination '.runtime/json-historical12' -Recurse
          Copy-Item -LiteralPath '.runtime/json-schema-historical10-proof/release' -Destination '.runtime/json-schema-historical10' -Recurse
          Copy-Item -LiteralPath '.runtime/json-clr/Deploy.WithAssembly.sql' -Destination '.runtime/json-clr/Deploy.sql'
          Copy-Item -LiteralPath '.runtime/json-clr/Uninstall.Expanded.sql' -Destination '.runtime/json-clr/Uninstall.sql'
      - uses: actions/upload-artifact@v4
        with:
          name: known-json-clr
          include-hidden-files: true
          path: |
            .runtime/json-clr/
            .runtime/json-core/
            .runtime/json-schema/
            .runtime/json-historical12/
            .runtime/json-schema-historical10/
          retention-days: 1
  runtime:
    needs: known-artifact
    name: SQL Server ${{ matrix.sql-version }} Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sql-version: ["2019", "2022", "2025"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate static contract
        run: >-
          python3
          Modules/toolbelt.json.constructors/Tests/Static/validate_contract.py

      - name: Validate shared closure and Schema contract
        run: python3 Modules/toolbelt.json.schema/Tests/Static/validate_contract.py

      - uses: actions/download-artifact@v4
        with:
          name: known-json-clr
          path: .runtime

      - name: Echte unveränderte 1.0-Upgradequellen paketieren
        shell: pwsh
        run: ./Modules/toolbelt.json.constructors/Deployment/New-LegacyTestArtifacts.ps1 -OutputDirectory .runtime/json-constructors-legacy

      - name: Execute synthetic compatibility and lifecycle tests
        env:
          TBX_SQL_VERSION: ${{ matrix.sql-version }}
          TBX_SQL_IMAGE: mcr.microsoft.com/mssql/server:${{ matrix.sql-version }}-latest
        run: bash Tests/CI/run-lab-target.sh Tests/CI/run-json-constructors-linux.sh
