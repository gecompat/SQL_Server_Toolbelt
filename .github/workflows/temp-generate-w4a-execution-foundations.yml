name: Temporary Generate W4a Execution Foundations

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/temp-generate-w4a-execution-foundations.yml
      - Tests/Documentation/generate_w4a_execution_foundations.py

permissions:
  contents: write

jobs:
  generate-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      EVIDENCE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Correct generated validator escaping
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Tests/Documentation/generate_w4a_execution_foundations.py')
          text = path.read_text(encoding='utf-8')
          old = "all_source='\\n'.join((root/p).read_text('utf-8') for p in required if p.startswith('Source/'))"
          new = "all_source='\\\\n'.join((root/p).read_text('utf-8') for p in required if p.startswith('Source/'))"
          if text.count(old) != 1:
              raise SystemExit('Der erwartete Execution-Context-Validatorausdruck wurde nicht eindeutig gefunden.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
      - name: Generate W4a modules and repository metadata
        run: python3 Tests/Documentation/generate_w4a_execution_foundations.py
      - name: Normalize generated manifests
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          manifest_contracts = {
              Path('Modules/toolbelt.core.error-envelope/module.yaml'): {
                  'public_objects': ['Documentation/USP_CaptureErrorEnvelope.md'],
                  'architecture': ['../../Documentation/Architecture/ERROR_ENVELOPE_MODULE_DESIGN.md'],
                  'test_matrix': ['Tests/ERROR_ENVELOPE_CONTRACT_TEST_MATRIX.md'],
                  'evidence': ['Tests/README.md'],
              },
              Path('Modules/toolbelt.core.execution-context/module.yaml'): {
                  'public_objects': ['Documentation/EXECUTION_CONTEXT_OBJECTS.md'],
                  'architecture': ['../../Documentation/Architecture/EXECUTION_CONTEXT_MODULE_DESIGN.md'],
                  'test_matrix': ['Tests/EXECUTION_CONTEXT_CONTRACT_TEST_MATRIX.md'],
                  'evidence': ['Tests/README.md'],
              },
          }
          list_replacements = {
              'sql_server_versions': ['"2019"', '"2022"', '"2025"'],
              'compatibility_levels': ['150', '160', '170'],
              'schemas': ['"toolbelt_core"'],
          }

          for path, documentation in manifest_contracts.items():
              text = path.read_text(encoding='utf-8')
              for key, values in list_replacements.items():
                  pattern = rf'(?m)^{re.escape(key)}:\s*\[[^\n]*\]\s*$'
                  block = key + ':\n' + '\n'.join(f'  - {value}' for value in values)
                  text, changed = re.subn(pattern, lambda _match, value=block: value, text, count=1)
                  if changed != 1:
                      raise SystemExit(f'{path}: kompakte Liste {key} wurde nicht eindeutig gefunden.')

              documentation_lines = ['documentation:', '  module: "README.md"']
              for key in ('public_objects', 'architecture', 'test_matrix', 'evidence'):
                  documentation_lines.append(f'  {key}:')
                  documentation_lines.extend(
                      f'    - "{value}"' for value in documentation[key]
                  )
              documentation_block = '\n'.join(documentation_lines) + '\n'
              text, changed = re.subn(
                  r'(?ms)^documentation:\n.*?(?=^contracts:\n)',
                  lambda _match, value=documentation_block: value,
                  text,
                  count=1,
              )
              if changed != 1:
                  raise SystemExit(f'{path}: documentation-Block wurde nicht eindeutig gefunden.')
              path.write_text(text, encoding='utf-8', newline='\n')
          PY
      - name: Validate static contracts
        run: |
          python3 Modules/toolbelt.core.error-envelope/Tests/Static/validate_contract.py
          python3 Modules/toolbelt.core.execution-context/Tests/Static/validate_contract.py
      - name: Execute SQL Server 2025 Linux compatibility matrix
        env:
          TBX_SQL_IMAGE: mcr.microsoft.com/mssql/server:2025-latest
        run: bash Tests/CI/run-w4a-execution-foundations-linux.sh
      - name: Generate and validate repository status
        run: |
          python3 Tests/Documentation/validate_documentation.py --all --write
          python3 Tests/Documentation/validate_documentation.py --all
      - name: Commit consistent W4a state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- \
            .runtime \
            .github/workflows/temp-generate-w4a-execution-foundations.yml \
            .github/workflows/temp-w4a-apply.yml \
            .github/workflows/temp-w4a-snapshot.yml \
            .github/workflows/temp-w4a-snapshot-pr.yml \
            Tests/Documentation/generate_w4a_execution_foundations.py
          if git diff --cached --quiet; then
            echo "Keine W4a-Änderungen zu committen."
            exit 0
          fi
          git commit -m "ChatGPT [LLM: GPT-5.6 Thinking]: Implementiere W4a Execution-Grundlagen"
          git push origin HEAD:${{ github.head_ref }}
