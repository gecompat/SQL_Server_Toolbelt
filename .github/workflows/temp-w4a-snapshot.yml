name: Temporary W4a Repository Snapshot

on:
  push:
    branches:
      - agent/w4a-execution-foundations
    paths:
      - .github/workflows/temp-w4a-snapshot.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Package exact branch state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .runtime
          tar --exclude=.git --exclude=.runtime -czf .runtime/repository.tar.gz .
      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: w4a-repository-snapshot
          if-no-files-found: error
          path: .runtime/repository.tar.gz
