name: Identifier Runtime

on:
  pull_request:
    paths:
      - ".github/workflows/identifier-runtime.yml"
      - "Modules/toolbelt.metadata.identifier/module.yaml"
      - "Modules/toolbelt.metadata.identifier/Source/**"
      - "Modules/toolbelt.metadata.identifier/Deployment/**"
      - "Modules/toolbelt.metadata.identifier/Tests/Runtime/**"
      - "Modules/toolbelt.metadata.identifier/Tests/Static/**"
      - "Tests/CI/run-identifier-linux.sh"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/identifier-runtime.yml"
      - "Modules/toolbelt.metadata.identifier/module.yaml"
      - "Modules/toolbelt.metadata.identifier/Source/**"
      - "Modules/toolbelt.metadata.identifier/Deployment/**"
      - "Modules/toolbelt.metadata.identifier/Tests/Runtime/**"
      - "Modules/toolbelt.metadata.identifier/Tests/Static/**"
      - "Tests/CI/run-identifier-linux.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: identifier-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sql-server-2025-linux:
    name: SQL Server 2025 Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate static contract
        run: >-
          python3
          Modules/toolbelt.metadata.identifier/Tests/Static/validate_contract.py

      - name: Execute synthetic compatibility and lifecycle tests
        env:
          TBX_SQL_IMAGE: mcr.microsoft.com/mssql/server:2025-latest
        run: bash Tests/CI/run-identifier-linux.sh
