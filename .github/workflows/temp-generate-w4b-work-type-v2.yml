name: Temporary Generate W4b Work Type V2

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/temp-generate-w4b-work-type-v2.yml

permissions:
  contents: write

jobs:
  generate-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      EVIDENCE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Correct generator assumptions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Tests/Documentation/generate_w4b_work_type.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              "OR LEFT(LTRIM(@PayloadContractJson), 1) <> N'{'":
                  "OR LEFT(LTRIM(@PayloadContractJson), 1) <> N'{{'",
              '"# Changelog\\n\\n"':
                  '"# CHANGELOG\\n\\n"',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'Die erwartete Generatorstelle wurde nicht eindeutig gefunden: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
      - name: Generate W4b module and repository metadata
        run: python3 Tests/Documentation/generate_w4b_work_type.py
      - name: Normalize generated T-SQL
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          table_path = Path('Modules/toolbelt.core.work-type/Source/WorkType.sql')
          text = table_path.read_text(encoding='utf-8')
          inline_defaults = {
              '        , [ParameterMode]          varchar(16) COLLATE Latin1_General_100_BIN2 NOT NULL': "        , [ParameterMode]          varchar(16) COLLATE Latin1_General_100_BIN2 NOT NULL CONSTRAINT [DF_WorkType_ParameterMode] DEFAULT ('NONE')",
              '        , [DefaultTimeoutSeconds]  int NOT NULL': '        , [DefaultTimeoutSeconds]  int NOT NULL CONSTRAINT [DF_WorkType_DefaultTimeoutSeconds] DEFAULT (300)',
              '        , [IsIdempotent]           bit NOT NULL': '        , [IsIdempotent]           bit NOT NULL CONSTRAINT [DF_WorkType_IsIdempotent] DEFAULT (0)',
              '        , [IsEnabled]              bit NOT NULL': '        , [IsEnabled]              bit NOT NULL CONSTRAINT [DF_WorkType_IsEnabled] DEFAULT (1)',
              '        , [CreatedAtUtc]           datetime2(7) NOT NULL': '        , [CreatedAtUtc]           datetime2(7) NOT NULL CONSTRAINT [DF_WorkType_CreatedAtUtc] DEFAULT (SYSUTCDATETIME())',
              '        , [CreatedBy]              sysname NOT NULL': '        , [CreatedBy]              sysname NOT NULL CONSTRAINT [DF_WorkType_CreatedBy] DEFAULT (ORIGINAL_LOGIN())',
              '        , [ModifiedAtUtc]          datetime2(7) NOT NULL': '        , [ModifiedAtUtc]          datetime2(7) NOT NULL CONSTRAINT [DF_WorkType_ModifiedAtUtc] DEFAULT (SYSUTCDATETIME())',
              '        , [ModifiedBy]             sysname NOT NULL': '        , [ModifiedBy]             sysname NOT NULL CONSTRAINT [DF_WorkType_ModifiedBy] DEFAULT (ORIGINAL_LOGIN())',
          }
          for old, new in inline_defaults.items():
              if text.count(old) != 1:
                  raise SystemExit(f'Die erwartete Spaltendefinition wurde nicht eindeutig gefunden: {old}')
              text = text.replace(old, new, 1)

          text, removed = re.subn(
              r"\n        , CONSTRAINT \[DF_WorkType_[^\]]+\]\n            DEFAULT \([^\n]+\) FOR \[[^\]]+\]",
              '',
              text,
          )
          if removed != 8:
              raise SystemExit(f'Erwartet wurden acht table-level DEFAULT-Constraints, entfernt wurden {removed}.')
          table_path.write_text(text, encoding='utf-8', newline='\n')

          register_path = Path('Modules/toolbelt.core.work-type/Source/USP_RegisterWorkType.sql')
          register = register_path.read_text(encoding='utf-8')
          old = "    IF @Debug > 0\n        RAISERROR(N'USP_RegisterWorkType: Registrierung verarbeitet; Änderung=%d.', 10, 1, @Changed) WITH NOWAIT;\n"
          new = "    IF @Debug > 0\n    BEGIN\n        DECLARE @ChangedForMessage int = CONVERT(int, @Changed);\n        RAISERROR(N'USP_RegisterWorkType: Registrierung verarbeitet; Änderung=%d.', 10, 1, @ChangedForMessage) WITH NOWAIT;\n    END;\n"
          if register.count(old) != 1:
              raise SystemExit('Die erwartete Register-Debugmeldung wurde nicht eindeutig gefunden.')
          register_path.write_text(register.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
      - name: Validate static contract
        run: python3 Modules/toolbelt.core.work-type/Tests/Static/validate_contract.py
      - name: Execute SQL Server 2025 Linux compatibility matrix
        env:
          TBX_SQL_IMAGE: mcr.microsoft.com/mssql/server:2025-latest
        run: bash Tests/CI/run-w4b-work-type-linux.sh
      - name: Generate and validate repository status
        run: |
          python3 Tests/Documentation/validate_documentation.py --all --write
          python3 Tests/Documentation/validate_documentation.py --all
      - name: Commit consistent W4b state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- \
            .github/workflows/temp-generate-w4b-work-type.yml \
            .github/workflows/temp-generate-w4b-work-type-v2.yml \
            Tests/Documentation/generate_w4b_work_type.py
          if git diff --cached --quiet; then
            echo "Keine W4b-Änderungen zu committen."
            exit 0
          fi
          git commit -m "ChatGPT [LLM: GPT-5.6 Thinking]: Implementiere W4b Work-Type-Katalog"
          git push origin HEAD:${{ github.head_ref }}
